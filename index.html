<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI-Powered Canvas Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: fixed;
        }
        
        .red-dot {
            width: 16px;
            height: 16px;
            background-color: #ff0000;
            border: 3px solid white;
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 9999;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(255,0,0,0.5);
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255,0,0,0.5); }
            70% { box-shadow: 0 0 0 10px rgba(255,0,0,0); }
            100% { box-shadow: 0 0 0 0 rgba(255,0,0,0); }
        }
        
        #livePreview {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }
        
        .deletable-element {
            transition: outline 0.2s;
        }
        
        .deletable-element:hover {
            outline: 2px solid rgba(255,0,0,0.5) !important;
            cursor: pointer;
        }
        
        .deletable-element.selected-for-delete {
            outline: 2px solid #ff0000 !important;
            background-color: rgba(255,0,0,0.1) !important;
        }
        
        #loadingIndicator {
            display: none;
        }
        
        .typing-dot {
            animation: typingAnimation 1.4s infinite;
        }
        
        @keyframes typingAnimation {
            0%, 60%, 100% { opacity: 0.3; }
            30% { opacity: 1; }
        }

        /* Custom scrollbar for any overflow */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body class="bg-gray-100" style="height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column;">
    
    <!-- Header -->
    <div class="bg-gradient-to-r from-blue-600 to-purple-600 text-white px-6 py-2 flex items-center justify-between shadow-lg flex-shrink-0" style="min-height: 50px;">
        <div class="flex items-center gap-3">
            <i class="fas fa-robot text-xl"></i>
            <h1 class="text-lg font-bold">AI Canvas Builder</h1>
        </div>
        <div id="statusIndicator" class="flex items-center gap-2 text-sm">
            <span class="w-2 h-2 bg-green-400 rounded-full"></span>
            <span>Ready</span>
        </div>
    </div>

    <!-- Full Screen White Canvas -->
    <div id="canvasContainer" class="relative flex-grow" style="min-height: 0; height: calc(100vh - 120px);">
        <iframe id="livePreview" class="w-full h-full" style="display: block;"></iframe>
        <!-- Red pointer dot -->
        <div id="pointerDot" class="red-dot hidden"></div>
        <!-- Loading overlay -->
        <div id="loadingIndicator" class="absolute inset-0 bg-black bg-opacity-30 flex items-center justify-center" style="z-index: 1000;">
            <div class="bg-white rounded-xl p-6 shadow-2xl flex items-center gap-3">
                <div class="flex gap-1">
                    <div class="w-3 h-3 bg-blue-500 rounded-full typing-dot"></div>
                    <div class="w-3 h-3 bg-blue-500 rounded-full typing-dot" style="animation-delay: 0.2s"></div>
                    <div class="w-3 h-3 bg-blue-500 rounded-full typing-dot" style="animation-delay: 0.4s"></div>
                </div>
                <span class="text-gray-700 font-medium">AI is thinking...</span>
            </div>
        </div>
    </div>

    <!-- Bottom Control Bar -->
    <div class="bg-white p-3 shadow-lg border-t-2 border-gray-200 flex-shrink-0" style="min-height: 70px;">
        <div class="flex items-center gap-2 h-full" style="max-width: 100%;">
            <!-- Chat Input -->
            <div class="flex-grow relative" style="min-width: 200px;">
                <input 
                    type="text" 
                    id="chatInput" 
                    placeholder="Tell AI what to add or modify..." 
                    class="w-full px-4 py-2 border-2 border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    style="font-size: 14px; height: 40px;"
                    autocomplete="off"
                >
                <button id="sendBtn" class="absolute right-1 top-1/2 transform -translate-y-1/2 bg-blue-500 hover:bg-blue-600 text-white rounded-full transition duration-200 flex items-center justify-center" style="width: 32px; height: 32px;">
                    <i class="fas fa-paper-plane text-sm"></i>
                </button>
            </div>

            <!-- Action Buttons -->
            <button id="copyBtn" class="flex items-center gap-1 bg-green-500 hover:bg-green-600 text-white px-3 py-2 rounded-lg transition duration-200 shadow font-medium flex-shrink-0" style="font-size: 13px; height: 40px;">
                <i class="fas fa-copy text-sm"></i>
                <span class="hidden sm:inline">Copy Code</span>
            </button>

            <button id="togglePointerBtn" class="flex items-center gap-1 bg-purple-500 hover:bg-purple-600 text-white px-3 py-2 rounded-lg transition duration-200 shadow font-medium flex-shrink-0" style="font-size: 13px; height: 40px;">
                <i class="fas fa-crosshairs text-sm"></i>
                <span class="hidden sm:inline">Pointer: OFF</span>
            </button>
            
            <button id="clearBtn" class="flex items-center gap-1 bg-gray-500 hover:bg-gray-600 text-white px-3 py-2 rounded-lg transition duration-200 shadow font-medium flex-shrink-0" style="font-size: 13px; height: 40px;">
                <i class="fas fa-trash-alt text-sm"></i>
                <span class="hidden sm:inline">Clear</span>
            </button>
        </div>
    </div>

    <script>
        // --- Configuration ---
        const GROQ_API_KEY = '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';
        const GROQ_ENDPOINT = 'https://api.groq.com/openai/v1/chat/completions';
        
        // --- State Management ---
        let pointerActive = false;
        let pointerPosition = { x: 0, y: 0 };
        let currentHTML = '';
        let conversationHistory = [];
        
        // Initialize basic HTML
        const initialHTML = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: white;
            min-height: 100vh;
            padding: 20px;
        }
        .element { position: relative; }
    </style>
</head>
<body>
    <!-- Add elements here -->
</body>
</html>`;
        
        // --- DOM Elements ---
        const livePreview = document.getElementById('livePreview');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const copyBtn = document.getElementById('copyBtn');
        const togglePointerBtn = document.getElementById('togglePointerBtn');
        const clearBtn = document.getElementById('clearBtn');
        const pointerDot = document.getElementById('pointerDot');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const canvasContainer = document.getElementById('canvasContainer');
        const statusIndicator = document.getElementById('statusIndicator');
        
        // --- Initialize ---
        function init() {
            currentHTML = initialHTML;
            updateLivePreview(currentHTML);
            setupEventListeners();
            console.log('AI Canvas Builder initialized successfully');
            console.log('Viewport height:', window.innerHeight);
            console.log('Viewport width:', window.innerWidth);
        }
        
        function updateLivePreview(html) {
            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            
            livePreview.onload = () => {
                // Add delete functionality to elements in iframe
                try {
                    const iframeDoc = livePreview.contentDocument || livePreview.contentWindow.document;
                    addDeleteListeners(iframeDoc);
                } catch(e) {
                    console.log('Cannot access iframe content');
                }
            };
            
            livePreview.src = url;
        }
        
        function addDeleteListeners(doc) {
            // Add click-to-delete functionality
            let selectedElement = null;
            
            doc.addEventListener('click', function(e) {
                // Don't trigger on body or html
                if (e.target === doc.body || e.target === doc.documentElement) return;
                
                // If there was a previously selected element, deselect it
                if (selectedElement && selectedElement !== e.target) {
                    selectedElement.classList.remove('selected-for-delete');
                }
                
                // Toggle selection
                if (e.target === selectedElement) {
                    // Second click - confirm delete
                    if (confirm('Delete this element?')) {
                        e.target.remove();
                        selectedElement = null;
                        // Update the stored HTML
                        setTimeout(updateStoredHTML, 100);
                    }
                } else {
                    // First click - select element
                    e.target.classList.add('selected-for-delete');
                    selectedElement = e.target;
                }
            });
        }
        
        function updateStoredHTML() {
            try {
                const iframeDoc = livePreview.contentDocument || livePreview.contentWindow.document;
                if (iframeDoc && iframeDoc.documentElement) {
                    currentHTML = iframeDoc.documentElement.outerHTML;
                }
            } catch(e) {
                console.log('Cannot access iframe content');
            }
        }
        
        // --- Event Listeners ---
        function setupEventListeners() {
            // Send message on button click
            sendBtn.addEventListener('click', handleSendMessage);
            
            // Send message on Enter key
            chatInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleSendMessage();
                }
            });
            
            // Copy button
            copyBtn.addEventListener('click', handleCopy);
            
            // Toggle pointer
            togglePointerBtn.addEventListener('click', togglePointer);
            
            // Clear button
            clearBtn.addEventListener('click', handleClear);
            
            // Track pointer position on canvas
            canvasContainer.addEventListener('mousemove', (e) => {
                if (pointerActive) {
                    const rect = canvasContainer.getBoundingClientRect();
                    pointerPosition.x = e.clientX - rect.left;
                    pointerPosition.y = e.clientY - rect.top;
                    
                    pointerDot.style.left = pointerPosition.x + 'px';
                    pointerDot.style.top = pointerPosition.y + 'px';
                    pointerDot.classList.remove('hidden');
                }
            });
            
            // Hide pointer when leaving canvas
            canvasContainer.addEventListener('mouseleave', () => {
                if (pointerActive) {
                    pointerDot.classList.add('hidden');
                }
            });
            
            canvasContainer.addEventListener('mouseenter', () => {
                if (pointerActive) {
                    pointerDot.classList.remove('hidden');
                }
            });
            
            // Handle window resize
            window.addEventListener('resize', () => {
                console.log('Window resized:', window.innerHeight, window.innerWidth);
            });
        }
        
        // --- Toggle Pointer ---
        function togglePointer() {
            pointerActive = !pointerActive;
            
            if (pointerActive) {
                togglePointerBtn.innerHTML = '<i class="fas fa-crosshairs text-sm"></i> <span class="hidden sm:inline">Pointer: ON</span>';
                togglePointerBtn.classList.remove('bg-purple-500', 'hover:bg-purple-600');
                togglePointerBtn.classList.add('bg-red-500', 'hover:bg-red-600');
                canvasContainer.style.cursor = 'crosshair';
                pointerDot.classList.remove('hidden');
            } else {
                togglePointerBtn.innerHTML = '<i class="fas fa-crosshairs text-sm"></i> <span class="hidden sm:inline">Pointer: OFF</span>';
                togglePointerBtn.classList.remove('bg-red-500', 'hover:bg-red-600');
                togglePointerBtn.classList.add('bg-purple-500', 'hover:bg-purple-600');
                canvasContainer.style.cursor = 'default';
                pointerDot.classList.add('hidden');
            }
        }
        
        // --- Handle Send Message ---
        async function handleSendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;
            
            // Clear input
            chatInput.value = '';
            
            // Show loading
            showLoading(true);
            
            // Update stored HTML before making changes
            updateStoredHTML();
            
            // Prepare the prompt
            let fullPrompt = '';
            
            if (pointerActive) {
                // If pointer is active, include position
                fullPrompt = `Current HTML code:\n${currentHTML}\n\nUser request: ${message}\n\nIMPORTANT: The user has placed their pointer at position X: ${Math.round(pointerPosition.x)}px, Y: ${Math.round(pointerPosition.y)}px in the canvas. Add the requested element AT or NEAR this position using absolute positioning. Only modify the specific parts requested, do not rewrite the entire code. Return ONLY the complete modified HTML code, nothing else.`;
            } else {
                fullPrompt = `Current HTML code:\n${currentHTML}\n\nUser request: ${message}\n\nIMPORTANT: Only modify the specific parts requested, do not rewrite the entire code unless necessary. Return ONLY the complete modified HTML code, nothing else.`;
            }
            
            try {
                const response = await callGroqAPI(fullPrompt);
                if (response) {
                    currentHTML = response;
                    updateLivePreview(currentHTML);
                    showLoading(false);
                    updateStatus('Done', 'green');
                }
            } catch (error) {
                console.error('Error:', error);
                showLoading(false);
                updateStatus('Error occurred', 'red');
                alert('Failed to get response from AI. Please check your API key and try again.');
            }
        }
        
        // --- Call Groq API ---
        async function callGroqAPI(prompt) {
            const response = await fetch(GROQ_ENDPOINT, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${GROQ_API_KEY}`
                },
                body: JSON.stringify({
                    model: 'llama-3.3-70b-versatile',
                    messages: [
                        {
                            role: 'system',
                            content: 'You are a helpful AI that modifies HTML code. You ONLY return the complete modified HTML code, no explanations, no markdown formatting, just the pure HTML code. You make targeted changes based on user requests without unnecessary rewrites of unchanged parts.'
                        },
                        {
                            role: 'user',
                            content: prompt
                        }
                    ],
                    temperature: 0.7,
                    max_tokens: 4096
                })
            });
            
            if (!response.ok) {
                const errorData = await response.text();
                throw new Error(`API request failed: ${response.status} - ${errorData}`);
            }
            
            const data = await response.json();
            let content = data.choices[0].message.content;
            
            // Clean up the response - remove markdown code blocks if present
            content = content.replace(/```html\n?/g, '').replace(/```\n?/g, '').trim();
            
            return content;
        }
        
        // --- Handle Copy ---
        async function handleCopy() {
            updateStoredHTML();
            
            try {
                await navigator.clipboard.writeText(currentHTML);
                
                // Visual feedback
                const originalHTML = copyBtn.innerHTML;
                copyBtn.innerHTML = '<i class="fas fa-check text-sm"></i> <span class="hidden sm:inline">Copied!</span>';
                copyBtn.classList.remove('bg-green-500', 'hover:bg-green-600');
                copyBtn.classList.add('bg-blue-500', 'hover:bg-blue-600');
                
                setTimeout(() => {
                    copyBtn.innerHTML = originalHTML;
                    copyBtn.classList.remove('bg-blue-500', 'hover:bg-blue-600');
                    copyBtn.classList.add('bg-green-500', 'hover:bg-green-600');
                }, 1500);
            } catch (err) {
                alert('Failed to copy code');
            }
        }
        
        // --- Handle Clear ---
        function handleClear() {
            if (confirm('Clear all elements? This will reset the canvas.')) {
                currentHTML = initialHTML;
                updateLivePreview(currentHTML);
                updateStatus('Canvas cleared', 'green');
            }
        }
        
        // --- UI Helpers ---
        function showLoading(show) {
            if (show) {
                loadingIndicator.style.display = 'flex';
                updateStatus('AI thinking...', 'yellow');
            } else {
                loadingIndicator.style.display = 'none';
            }
        }
        
        function updateStatus(message, color) {
            const statusSpans = statusIndicator.querySelectorAll('span');
            if (statusSpans.length >= 2) {
                statusSpans[0].className = `w-2 h-2 bg-${color}-400 rounded-full`;
                statusSpans[1].textContent = message;
            }
        }
        
        // --- Start the app ---
        init();
    </script>
</body>
</html>
