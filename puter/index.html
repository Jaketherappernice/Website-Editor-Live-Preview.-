<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Canvas Builder - Puter Engine</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://js.puter.com/v2/"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #f1f5f9; }

        #appHeader { flex: 0 0 auto; background: #1e293b; color: white; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; z-index: 10; }
        #canvasWrapper { flex: 1 1 0; position: relative; overflow: hidden; background: #cbd5e1; }
        #livePreview { width: 100%; height: 100%; border: none; display: block; background: white; }
        
        #loadingOverlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 100; color: white; font-weight: bold; }
        #loadingOverlay.visible { display: flex; }

        #appFooter { flex: 0 0 auto; background: white; border-top: 1px solid #e2e8f0; padding: 10px; }
        #bottomBar { display: flex; gap: 8px; }
        #chatInput { flex: 1; height: 40px; padding: 0 15px; border: 1px solid #94a3b8; border-radius: 8px; outline: none; }
        .abtn { height: 40px; padding: 0 12px; border: none; border-radius: 8px; color: white; cursor: pointer; font-weight: bold; }
        #sendBtn { background: #3b82f6; }
        #copyBtn { background: #10b981; }
        #clearBtn { background: #ef4444; }
    </style>
</head>
<body>

    <div id="appHeader">
        <div>Canvas Builder</div>
        <div id="status">Ready</div>
    </div>

    <div id="canvasWrapper">
        <iframe id="livePreview"></iframe>
        <div id="loadingOverlay">AI IS THINKING...</div>
    </div>

    <div id="appFooter">
        <div id="bottomBar">
            <input id="chatInput" type="text" placeholder="Update design..." />
            <button id="sendBtn" class="abtn"><i class="fas fa-paper-plane"></i></button>
            <button id="copyBtn" class="abtn"><i class="fas fa-copy"></i></button>
            <button id="clearBtn" class="abtn"><i class="fas fa-trash"></i></button>
        </div>
    </div>

    <script>
        let currentHTML = `<!DOCTYPE html><html><head><style>
            body { margin: 0; padding: 20px; font-family: sans-serif; min-height: 100vh; overflow: auto; }
            .resizer-dot { width: 30px; height: 30px; background: #3b82f6; border: 3px solid white; border-radius: 50%; position: absolute; z-index: 99999; touch-action: none; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
            .dragging { opacity: 0.7 !important; }
            [data-selected="true"] { outline: 2px solid #3b82f6 !important; }
        </style></head><body></body></html>`;

        const preview = document.getElementById('livePreview');
        const chatInput = document.getElementById('chatInput');
        const loading = document.getElementById('loadingOverlay');

        function render() {
            const blob = new Blob([currentHTML], { type: 'text/html' });
            preview.src = URL.createObjectURL(blob);
            preview.onload = () => setupInteractions(preview.contentDocument);
        }

        function setupInteractions(doc) {
            let selected = null, resizing = null, dragging = null;
            let startRect, startPos, handleType, offset = {x:0, y:0};
            const tapState = new WeakMap();

            const getPos = (e) => {
                const t = (e.touches && e.touches.length > 0) ? e.touches[0] : e;
                return { x: t.clientX, y: t.clientY };
            };

            const clearDots = () => {
                doc.querySelectorAll('.resizer-dot').forEach(d => d.remove());
                doc.querySelectorAll('[data-selected]').forEach(el => el.removeAttribute('data-selected'));
            };

            const addDots = (el) => {
                doc.querySelectorAll('.resizer-dot').forEach(d => d.remove());
                if (!el) return;
                el.setAttribute('data-selected', 'true');
                const r = el.getBoundingClientRect();
                const sx = doc.defaultView.scrollX;
                const sy = doc.defaultView.scrollY;
                
                ['tl', 'tr', 'bl', 'br'].forEach(p => {
                    const dot = doc.createElement('div');
                    dot.className = `resizer-dot resizer-${p}`;
                    dot.style.top = (sy + (p.includes('t') ? r.top : r.bottom) - 15) + 'px';
                    dot.style.left = (sx + (p.includes('l') ? r.left : r.right) - 15) + 'px';
                    
                    const startResizing = (e) => {
                        e.stopPropagation(); e.preventDefault();
                        resizing = el; handleType = p;
                        const pnt = getPos(e);
                        startPos = {x: pnt.x, y: pnt.y};
                        startRect = el.getBoundingClientRect();
                        el.style.position = 'absolute';
                    };

                    dot.addEventListener('mousedown', startResizing);
                    dot.addEventListener('touchstart', startResizing, {passive: false});
                    doc.body.appendChild(dot);
                });
            };

            const handleTripleTap = (e) => {
                if (e.target.classList.contains('resizer-dot')) return;
                const t = e.target;
                if (t === doc.body || t === doc.documentElement) return;
                const now = Date.now();
                if (!tapState.has(t)) tapState.set(t, { count: 0, lastTime: 0 });
                const state = tapState.get(t);
                if (now - state.lastTime > 500) state.count = 0;
                state.count++; state.lastTime = now;
                if (state.count >= 3) {
                    state.count = 0;
                    if (confirm('Delete?')) { t.remove(); clearDots(); sync(); }
                }
            };

            const handleStart = (e) => {
                if (e.target.classList.contains('resizer-dot')) return;
                const t = e.target;
                if (t === doc.body || t === doc.documentElement) { clearDots(); return; }
                selected = t; addDots(selected); dragging = t;
                const p = getPos(e); const r = dragging.getBoundingClientRect();
                offset = { x: p.x - r.left, y: p.y - r.top };
                dragging.style.position = 'absolute';
                dragging.classList.add('dragging');
            };

            const handleMove = (e) => {
                if (!resizing && !dragging) return;
                e.preventDefault();
                const p = getPos(e);
                if (resizing) {
                    const dx = p.x - startPos.x; const dy = p.y - startPos.y;
                    if (handleType.includes('r')) resizing.style.width = Math.max(20, startRect.width + dx) + 'px';
                    if (handleType.includes('b')) resizing.style.height = Math.max(20, startRect.height + dy) + 'px';
                    if (handleType.includes('l')) { resizing.style.width = Math.max(20, startRect.width - dx) + 'px'; resizing.style.left = (startRect.left + dx) + 'px'; }
                    if (handleType.includes('t')) { resizing.style.height = Math.max(20, startRect.height - dy) + 'px'; resizing.style.top = (startRect.top + dy) + 'px'; }
                } else if (dragging) {
                    dragging.style.left = (p.x - offset.x) + 'px';
                    dragging.style.top = (p.y - offset.y) + 'px';
                }
            };

            const handleEnd = () => {
                if (resizing || dragging) {
                    const el = resizing || dragging;
                    el.classList.remove('dragging');
                    addDots(el); resizing = dragging = null; sync();
                }
            };

            doc.addEventListener('mousedown', handleStart);
            doc.addEventListener('touchstart', handleStart, {passive: false});
            doc.addEventListener('mousemove', handleMove);
            doc.addEventListener('touchmove', handleMove, {passive: false});
            doc.addEventListener('mouseup', handleEnd);
            doc.addEventListener('touchend', handleEnd);
            doc.addEventListener('touchend', handleTripleTap, {passive: true});
        }

        function sync() {
            const doc = preview.contentDocument;
            if (!doc) return;
            const clone = doc.documentElement.cloneNode(true);
            clone.querySelectorAll('.resizer-dot').forEach(d => d.remove());
            clone.querySelectorAll('[data-selected]').forEach(el => el.removeAttribute('data-selected'));
            currentHTML = clone.outerHTML;
        }

        async function send() {
            const val = chatInput.value.trim(); 
            if(!val) return;
            chatInput.value = ''; 
            sync();
            loading.classList.add('visible');

            try {
                const response = await puter.ai.chat(
                    `Task: ${val}\n\nExisting HTML:\n${currentHTML}`,
                    { 
                        system_prompt: "STRICT OUTPUT MODE: Return ONLY the full HTML code. No markdown, no backticks, no text before or after. Start immediately with <!DOCTYPE html> and end with </html>.",
                        model: 'gpt-4o' 
                    }
                );
                
                let code = response.toString();
                
                // Extraction Logic: Find the actual HTML block and ignore everything else
                const htmlMatch = code.match(/<!DOCTYPE html>[\s\S]*<\/html>/i);
                
                if (htmlMatch) {
                    code = htmlMatch[0];
                } else {
                    // Fallback: If doctype is missing, try to find <html> tags or at least strip backticks
                    code = code.replace(/```html|```/gi, '').trim();
                }

                if (code.toLowerCase().includes('<html')) {
                    currentHTML = code;
                    render();
                }
            } catch(e) {
                console.error("AI Error:", e);
            } finally { 
                loading.classList.remove('visible'); 
            }
        }

        document.getElementById('sendBtn').onclick = send;
        chatInput.onkeydown = e => e.key === 'Enter' && send();
        document.getElementById('copyBtn').onclick = () => { sync(); navigator.clipboard.writeText(currentHTML); alert('Copied!'); };
        document.getElementById('clearBtn').onclick = () => { if(confirm('Reset?')) { location.reload(); } };

        render();
    </script>
</body>
</html>
