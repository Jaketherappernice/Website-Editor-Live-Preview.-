<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Spray Web Editor</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, sans-serif; overflow: hidden; background: #000; }
        
        /* Setup Screen */
        #setup-screen { position: fixed; inset: 0; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 3000; padding: 20px; text-align: center; }
        textarea { width: 90%; height: 40%; margin: 20px 0; background: #222; color: #0f0; border: 1px solid #444; padding: 10px; font-family: monospace; border-radius: 8px; font-size: 14px; }
        .btn-primary { padding: 15px 40px; background: #007bff; color: white; border: none; border-radius: 30px; font-weight: bold; font-size: 16px; }

        /* Canvas & Viewport */
        #preview-container { width: 100vw; height: 100vh; position: relative; background: white; }
        iframe { width: 100%; height: 100%; border: none; pointer-events: auto; }
        #brush-canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1500; }

        /* UI Controls */
        .fab { position: fixed; bottom: 30px; left: 30px; width: 65px; height: 65px; border-radius: 50%; background: #007bff; border: 4px solid white; color: white; font-size: 28px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.4); z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .export-btn { position: fixed; top: 20px; right: 20px; padding: 12px 20px; background: #28a745; color: white; border: none; border-radius: 10px; cursor: pointer; z-index: 2000; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }

        /* Helper Classes */
        .highlight-target { outline: 4px dashed #ff0000 !important; outline-offset: -4px; }
    </style>
</head>
<body>

    <div id="setup-screen">
        <h2>Web Brush Editor</h2>
        <p>Paste your HTML source code below:</p>
        <textarea id="code-input" placeholder="<html>...</html>"></textarea>
        <button class="btn-primary" onclick="startEditing()">LAUNCH PREVIEW</button>
    </div>

    <div id="preview-container">
        <button class="export-btn" onclick="exportCode()">EXPORT CODE</button>
        <button class="fab" onclick="changeBrushColor()">🖌️</button>
        <iframe id="viewer"></iframe>
        <canvas id="brush-canvas"></canvas>
    </div>

    <script>
        const viewer = document.getElementById('viewer');
        const canvas = document.getElementById('brush-canvas');
        const ctx = canvas.getContext('2d');
        
        let brushColor = '#ff0000';
        let selectedElement = null;
        let isPainting = false;

        function startEditing() {
            const code = document.getElementById('code-input').value;
            if(!code) return alert("Paste code first!");
            
            // Inject the code into the iframe
            const blob = new Blob([code], {type: 'text/html'});
            viewer.src = URL.createObjectURL(blob);
            
            document.getElementById('setup-screen').style.display = 'none';
            viewer.onload = setupInteractions;
        }

        function changeBrushColor() {
            const hex = prompt("Enter Hex Color (e.g., #00ff00):", brushColor);
            if (hex && /^#[0-9A-F]{6}$/i.test(hex)) {
                brushColor = hex;
            }
        }

        function setupInteractions() {
            const doc = viewer.contentDocument || viewer.contentWindow.document;

            // Handle Element Selection (Click/Tap)
            doc.addEventListener('click', (e) => {
                // If we are currently painting, don't switch elements immediately
                if(isPainting) return;

                e.preventDefault();
                e.stopPropagation();

                // Remove previous highlight
                if(selectedElement) selectedElement.classList.remove('highlight-target');

                selectedElement = e.target;
                selectedElement.classList.add('highlight-target');

                // Align canvas to the clicked element
                const rect = selectedElement.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
                canvas.style.top = (rect.top + viewer.getBoundingClientRect().top) + 'px';
                canvas.style.left = (rect.left + viewer.getBoundingClientRect().left) + 'px';
                
                // Enable the canvas for drawing
                canvas.style.pointerEvents = 'auto';
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            });
        }

        // CORE PAINTING LOGIC
        function draw(x, y) {
            if (!isPainting || !selectedElement) return;

            const rect = canvas.getBoundingClientRect();
            const localX = x - rect.left;
            const localY = y - rect.top;

            // Spray paint gradient effect
            const radGrad = ctx.createRadialGradient(localX, localY, 0, localX, localY, 15);
            radGrad.addColorStop(0, brushColor);
            radGrad.addColorStop(1, 'rgba(0,0,0,0)');

            ctx.fillStyle = radGrad;
            ctx.globalAlpha = 0.3;
            ctx.beginPath();
            ctx.arc(localX, localY, 15, 0, Math.PI * 2);
            ctx.fill();
        }

        // MOUSE CONTROLS
        canvas.addEventListener('mousedown', () => isPainting = true);
        window.addEventListener('mouseup', () => isPainting = false);
        canvas.addEventListener('mousemove', (e) => draw(e.clientX, e.clientY));

        // MOBILE TOUCH CONTROLS
        canvas.addEventListener('touchstart', (e) => {
            isPainting = true;
            const touch = e.touches[0];
            draw(touch.clientX, touch.clientY);
            e.preventDefault(); 
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            draw(touch.clientX, touch.clientY);
            e.preventDefault();
        }, { passive: false });

        canvas.addEventListener('touchend', () => isPainting = false);

        // EXPORT LOGIC
        function exportCode() {
            if (!selectedElement) return alert("Select and brush an element first!");

            // Flatten canvas to element background
            const dataURL = canvas.toDataURL();
            selectedElement.style.backgroundImage = `url(${dataURL})`;
            selectedElement.style.backgroundSize = '100% 100%';
            selectedElement.style.backgroundRepeat = 'no-repeat';
            selectedElement.classList.remove('highlight-target');

            // Get full HTML
            const fullHTML = viewer.contentDocument.documentElement.outerHTML;

            // Copy to Clipboard (Fallback Method for Mobile)
            const textArea = document.createElement("textarea");
            textArea.value = fullHTML;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                alert("FULL CODE COPIED TO CLIPBOARD!");
            } catch (err) {
                alert("Manual copy required. See console.");
                console.log(fullHTML);
            }
            document.body.removeChild(textArea);
        }
    </script>
</body>
</html>
