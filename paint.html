<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fixed Web Brush</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; overflow: hidden; background: #000; }
        
        /* Setup */
        #setup-screen { position: fixed; inset: 0; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5000; padding: 20px; }
        textarea { width: 90%; height: 50%; background: #222; color: #0f0; border: 1px solid #444; padding: 10px; border-radius: 8px; margin-bottom: 20px; }

        /* Preview Area */
        #preview-container { width: 100vw; height: 100vh; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }

        /* The Shield: Prevents the website's buttons from working */
        #click-shield { position: absolute; inset: 0; z-index: 1000; background: transparent; touch-action: none; }

        /* The Canvas: Where the painting happens */
        #brush-canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1100; }

        /* UI */
        .fab { position: fixed; bottom: 20px; left: 20px; width: 60px; height: 60px; border-radius: 50%; background: #007bff; border: 3px solid #fff; color: white; font-size: 24px; z-index: 2000; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .export-btn { position: fixed; top: 20px; right: 20px; padding: 12px 20px; background: #28a745; color: white; border: none; border-radius: 8px; z-index: 2000; font-weight: bold; }
        
        .indicator { position: fixed; bottom: 20px; right: 20px; background: rgba(0,0,0,0.7); color: white; padding: 5px 10px; border-radius: 5px; font-size: 12px; z-index: 2000; }
    </style>
</head>
<body>

    <div id="setup-screen">
        <h3>Paste Website Code</h3>
        <textarea id="code-input" placeholder="<html>...</html>"></textarea>
        <button onclick="startEditing()" style="padding: 15px 30px; border-radius: 25px; border: none; background: #007bff; color: white; font-weight: bold;">START EDITING</button>
    </div>

    <div id="preview-container">
        <div id="click-shield"></div>
        <canvas id="brush-canvas"></canvas>
        <iframe id="viewer"></iframe>
        
        <button class="export-btn" onclick="exportCode()">COPY CODE</button>
        <button class="fab" onclick="changeBrushColor()">🎨</button>
        <div class="indicator" id="status">Status: Select an element</div>
    </div>

    <script>
        const viewer = document.getElementById('viewer');
        const shield = document.getElementById('click-shield');
        const canvas = document.getElementById('brush-canvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');
        
        let brushColor = '#ff0000';
        let selectedElement = null;
        let isPainting = false;

        function startEditing() {
            const code = document.getElementById('code-input').value;
            if(!code) return alert("Please paste code!");
            viewer.srcdoc = code;
            document.getElementById('setup-screen').style.display = 'none';
        }

        function changeBrushColor() {
            const hex = prompt("Hex Color:", brushColor);
            if(hex) brushColor = hex;
        }

        // Logic to find element inside Iframe through the shield
        function getElementAt(x, y) {
            const doc = viewer.contentDocument;
            return doc.elementFromPoint(x, y);
        }

        function selectElement(x, y) {
            const el = getElementAt(x, y);
            if (!el || el.tagName === 'HTML' || el.tagName === 'BODY') return;

            if (selectedElement) selectedElement.style.outline = "none";
            
            selectedElement = el;
            selectedElement.style.outline = "3px dashed red";
            selectedElement.style.outlineOffset = "-3px";

            // Fit canvas to element
            const rect = selectedElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            canvas.style.top = rect.top + "px";
            canvas.style.left = rect.left + "px";
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            status.innerText = "Status: Brushing " + el.tagName;
        }

        function paint(clientX, clientY) {
            if (!isPainting || !selectedElement) return;
            const rect = canvas.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            const grad = ctx.createRadialGradient(x, y, 0, x, y, 15);
            grad.addColorStop(0, brushColor);
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad;
            ctx.globalAlpha = 0.3;
            ctx.fillRect(x - 15, y - 15, 30, 30);
        }

        // Handle ALL interactions on the shield
        shield.addEventListener('pointerdown', (e) => {
            // First tap: Select element
            if (!selectedElement || !isPainting) {
                selectElement(e.clientX, e.clientY);
            }
            isPainting = true;
        });

        window.addEventListener('pointerup', () => {
            isPainting = false;
        });

        shield.addEventListener('pointermove', (e) => {
            if(isPainting) paint(e.clientX, e.clientY);
        });

        function exportCode() {
            if(selectedElement) {
                const dataURL = canvas.toDataURL();
                selectedElement.style.backgroundImage = `url(${dataURL})`;
                selectedElement.style.backgroundSize = '100% 100%';
                selectedElement.style.outline = "none";
            }
            const finalCode = viewer.contentDocument.documentElement.outerHTML;
            const ta = document.createElement('textarea');
            ta.value = finalCode;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            alert("Code Copied!");
        }
    </script>
</body>
</html>
