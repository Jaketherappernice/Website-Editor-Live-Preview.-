<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta id="vp" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fixed Persistent Brush</title>
    <style>
        * {
            touch-action: none; 
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            box-sizing: border-box;
        }
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: sans-serif; overflow: hidden; background: #000;
            position: fixed; 
        }
        #setup-screen { 
            position: fixed; inset: 0; background: #121212; color: white; 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; z-index: 5000; padding: 20px; 
        }
        textarea { 
            width: 95%; height: 50%; background: #222; color: #0f0; 
            border: 1px solid #444; padding: 10px; border-radius: 8px; 
            margin-bottom: 20px; touch-action: auto; user-select: text;
        }
        #preview-container { width: 100vw; height: 100vh; position: relative; }
        iframe { width: 100%; height: 100%; border: none; background: white; }
        #click-shield { position: absolute; inset: 0; z-index: 1000; background: transparent; }
        #brush-canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1100; }
        .fab { position: fixed; bottom: 20px; left: 20px; width: 60px; height: 60px; border-radius: 50%; background: #007bff; border: 3px solid #fff; color: white; font-size: 24px; z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .export-btn { position: fixed; top: 20px; right: 20px; padding: 12px 20px; background: #28a745; color: white; border: none; border-radius: 8px; z-index: 2000; font-weight: bold; }
        .indicator { position: fixed; bottom: 20px; right: 20px; background: rgba(0,0,0,0.8); color: white; padding: 6px 12px; border-radius: 20px; font-size: 11px; z-index: 2000; border: 1px solid #444; }
    </style>
</head>
<body>

    <div id="setup-screen">
        <h3>Web Spray Editor</h3>
        <textarea id="code-input" placeholder="Paste HTML code here..."></textarea>
        <button onclick="startEditing()" style="padding: 15px 40px; border-radius: 30px; border: none; background: #007bff; color: white; font-weight: bold;">START EDITING</button>
    </div>

    <div id="preview-container">
        <div id="click-shield"></div>
        <canvas id="brush-canvas"></canvas>
        <iframe id="viewer"></iframe>
        
        <button class="export-btn" onclick="exportCode()">COPY CODE</button>
        <button class="fab" onclick="changeBrushColor()">🎨</button>
        <div class="indicator" id="status">Double-tap an element to paint</div>
    </div>

    <script>
        const viewer = document.getElementById('viewer');
        const shield = document.getElementById('click-shield');
        const canvas = document.getElementById('brush-canvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');
        const vp = document.getElementById('vp');
        
        let brushColor = '#ff0000';
        let selectedElement = null;
        let isPainting = false;
        let lastTap = 0;

        // Auto-zoom-out check
        setInterval(() => {
            if (window.visualViewport && window.visualViewport.scale !== 1) {
                document.getElementById('vp').setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
                window.scrollTo(0, 0);
            }
        }, 500);

        function startEditing() {
            const code = document.getElementById('code-input').value;
            if(!code) return alert("Paste code!");
            viewer.srcdoc = code;
            document.getElementById('setup-screen').style.display = 'none';
        }

        function changeBrushColor() {
            const hex = prompt("Hex Color:", brushColor);
            if(hex) brushColor = hex;
        }

        function saveLayer() {
            if (selectedElement && canvas.width > 0) {
                const dataURL = canvas.toDataURL();
                // Combine existing background with the new one
                selectedElement.style.backgroundImage = `url(${dataURL})`;
                selectedElement.style.backgroundSize = '100% 100%';
                selectedElement.style.backgroundRepeat = 'no-repeat';
            }
        }

        function selectNewElement(x, y) {
            const doc = viewer.contentDocument;
            const el = doc.elementFromPoint(x, y);
            
            if (!el || el.tagName === 'HTML' || el.tagName === 'BODY') return;
            
            // Save work on previous element
            saveLayer();

            if (selectedElement) selectedElement.style.outline = "none";
            selectedElement = el;
            selectedElement.style.outline = "2px solid red";

            const rect = selectedElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            canvas.style.top = rect.top + "px";
            canvas.style.left = rect.left + "px";
            
            // Start fresh for THIS element
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            status.innerText = "Locked: " + el.tagName.toLowerCase();
        }

        function paint(clientX, clientY) {
            if (!isPainting || !selectedElement) return;
            const rect = canvas.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            const grad = ctx.createRadialGradient(x, y, 0, x, y, 15);
            grad.addColorStop(0, brushColor);
            grad.addColorStop(1, 'transparent');
            
            ctx.fillStyle = grad;
            ctx.globalAlpha = 0.2; 
            ctx.fillRect(x - 15, y - 15, 30, 30);
        }

        shield.addEventListener('pointerdown', (e) => {
            const now = Date.now();
            const timesince = now - lastTap;
            
            // DOUBLE TAP logic to switch elements
            if (timesince < 300 && timesince > 0) {
                selectNewElement(e.clientX, e.clientY);
                isPainting = false; // Prevent immediate painting on double tap
            } else {
                // SINGLE TAP starts painting on CURRENT element
                if (selectedElement) {
                    isPainting = true;
                    paint(e.clientX, e.clientY);
                }
            }
            lastTap = now;
        });

        window.addEventListener('pointerup', () => {
            isPainting = false;
        });

        shield.addEventListener('pointermove', (e) => {
            if(isPainting) paint(e.clientX, e.clientY);
        });

        function exportCode() {
            saveLayer();
            if(selectedElement) selectedElement.style.outline = "none";
            const finalCode = viewer.contentDocument.documentElement.outerHTML;
            const ta = document.createElement('textarea');
            ta.value = finalCode;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            alert("Code Saved & Copied!");
        }
    </script>
</body>
</html>
