<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CSS Keyframer v8</title>
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-color: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --danger-color: #ef4444;
        }

        * { box-sizing: border-box; touch-action: manipulation; }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            width: 100%;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-color);
            border-bottom: 1px solid #334155;
        }

        button {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
        }

        #stage-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        #stage {
            width: 300px;
            height: 300px;
            background-color: #1e293b;
            background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            position: relative;
            border: 1px solid #475569;
            border-radius: 4px;
        }

        /* The Box */
        #target-box {
            width: 80px;
            height: 80px;
            background-color: var(--accent-color);
            position: absolute;
            top: 50%;
            left: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #000;
            font-weight: bold;
            border-radius: 4px;
            /* Anchored to center */
            transform: translate(-50%, -50%);
            transform-origin: center center;
        }

        #controls {
            background: var(--panel-color);
            padding: 20px;
            border-top: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .control-row { display: flex; align-items: center; gap: 12px; }
        .control-row label { width: 60px; font-size: 0.7rem; text-transform: uppercase; color: #94a3b8; }

        input[type="range"] { flex-grow: 1; accent-color: var(--accent-color); }
        .val-display { width: 40px; font-size: 0.75rem; text-align: right; font-family: monospace; }

        .button-group { display: flex; gap: 10px; justify-content: center; }
        .btn-reset { background: var(--danger-color); color: white; }

        #modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            flex-direction: column;
            padding: 20px;
            z-index: 100;
        }

        #output-text {
            flex-grow: 1;
            background: #020617;
            color: #22c55e;
            font-family: 'Courier New', monospace;
            padding: 15px;
            border: 1px solid #334155;
            margin-bottom: 15px;
            font-size: 0.8rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<header>
    <h2 style="margin:0; font-size: 1rem;">Visual Keyframer <span style="color:var(--accent-color)">v8</span></h2>
    <div>
        <button onclick="playPreview()">▶ Play</button>
        <button style="background:#475569; color:white;" onclick="exportCSS()">Export</button>
    </div>
</header>

<div id="stage-container">
    <div id="stage">
        <div id="target-box" data-x="0" data-y="0" data-angle="0" data-scale="1">TARGET</div>
    </div>
</div>

<div id="controls">
    <div class="control-row">
        <label>Time</label>
        <input type="range" id="timeline" min="0" max="100" value="0">
        <span class="val-display" id="time-val">0%</span>
    </div>
    <div class="control-row">
        <label>Rotate</label>
        <input type="range" id="rotator" min="-180" max="180" value="0">
        <span class="val-display" id="rot-val">0°</span>
    </div>
    <div class="control-row">
        <label>Scale</label>
        <input type="range" id="scaler" min="0.1" max="3" step="0.1" value="1">
        <span class="val-display" id="scale-val">1.0</span>
    </div>

    <div style="text-align:center; font-size: 0.7rem; color: var(--accent-color);" id="kf-status">0 keyframes saved</div>

    <div class="button-group">
        <button onclick="addKeyframe()">+ Add Keyframe</button>
        <button class="btn-reset" onclick="clearKeyframes()">Reset</button>
    </div>
</div>

<div id="modal-overlay">
    <h3 style="margin-top:0">Portable CSS Output</h3>
    <textarea id="output-text" readonly></textarea>
    <button onclick="closeModal()" style="width: 100%">Close</button>
</div>

<script>
    let keyframes = [];
    const box = document.getElementById('target-box');
    const timeline = document.getElementById('timeline');
    const rotator = document.getElementById('rotator');
    const scaler = document.getElementById('scaler');

    // Dragging setup
    interact('#target-box').draggable({
        listeners: {
            move(event) {
                const x = (parseFloat(box.getAttribute('data-x')) || 0) + event.dx;
                const y = (parseFloat(box.getAttribute('data-y')) || 0) + event.dy;
                updateView(x, y, null, null);
            }
        }
    });

    // Input Listeners
    timeline.oninput = () => document.getElementById('time-val').innerText = timeline.value + '%';
    rotator.oninput = () => {
        document.getElementById('rot-val').innerText = rotator.value + '°';
        updateView(null, null, rotator.value, null);
    };
    scaler.oninput = () => {
        document.getElementById('scale-val').innerText = parseFloat(scaler.value).toFixed(1);
        updateView(null, null, null, scaler.value);
    };

    function updateView(x, y, a, s) {
        if (x !== null) box.setAttribute('data-x', x);
        if (y !== null) box.setAttribute('data-y', y);
        if (a !== null) box.setAttribute('data-angle', a);
        if (s !== null) box.setAttribute('data-scale', s);

        const curX = box.getAttribute('data-x');
        const curY = box.getAttribute('data-y');
        const curA = box.getAttribute('data-angle');
        const curS = box.getAttribute('data-scale');

        // We use calc(-50% + offset) to keep it centered on the stage
        box.style.transform = `translate(calc(-50% + ${curX}px), calc(-50% + ${curY}px)) rotate(${curA}deg) scale(${curS})`;
    }

    function addKeyframe() {
        const percent = parseInt(timeline.value);
        const x = parseFloat(box.getAttribute('data-x'));
        const y = parseFloat(box.getAttribute('data-y'));
        const a = box.getAttribute('data-angle');
        const s = box.getAttribute('data-scale');

        // Explicitly format with units for the export data
        const transformString = `translate(${x}px, ${y}px) rotate(${a}deg) scale(${s})`;

        keyframes = keyframes.filter(k => k.percent !== percent);
        keyframes.push({ percent, transform: transformString });
        keyframes.sort((a, b) => a.percent - b.percent);
        
        document.getElementById('kf-status').innerText = `${keyframes.length} keyframes saved`;
    }

    function playPreview() {
        if (keyframes.length < 2) return;
        const styleId = 'anim-preview-style';
        let styleTag = document.getElementById(styleId) || document.createElement('style');
        styleTag.id = styleId;

        let css = `@keyframes previewMove {\n`;
        keyframes.forEach(k => {
            // Preview needs that -50% offset to stay centered in the stage
            css += `  ${k.percent}% { transform: translate(-50%, -50%) ${k.transform}; }\n`;
        });
        css += `}`;
        
        styleTag.innerHTML = css;
        document.head.appendChild(styleTag);
        
        box.style.animation = 'none';
        setTimeout(() => {
            box.style.animation = `previewMove 2s infinite ease-in-out`;
        }, 10);
    }

    function exportCSS() {
        if (keyframes.length === 0) return;
        
        let output = `/* Generated CSS - Apply to your element */\n`;
        output += `.my-animated-element {\n`;
        output += `  display: inline-block; /* Critical for transforms */\n`;
        output += `  transform-origin: center;\n`;
        output += `  animation: myGeneratedAnim 2s infinite ease-in-out;\n`;
        output += `}\n\n`;
        output += `@keyframes myGeneratedAnim {\n`;
        
        keyframes.forEach(k => {
            output += `  ${k.percent}% { transform: ${k.transform}; }\n`;
        });
        output += `}`;

        document.getElementById('output-text').value = output;
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    function clearKeyframes() {
        keyframes = [];
        document.getElementById('kf-status').innerText = `0 keyframes saved`;
        box.style.animation = 'none';
        updateView(0, 0, 0, 1);
    }

    function closeModal() {
        document.getElementById('modal-overlay').style.display = 'none';
    }
</script>
</body>
</html>
