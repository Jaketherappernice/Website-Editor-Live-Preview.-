<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandbox Matrix - Interactive Canvas Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Neon Cyber UI Styling rules */
        body {
            background-color: #0d0d0d;
            color: #e5e5e5;
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }
        .neon-border {
            box-shadow: 0 0 10px #ff6600, inset 0 0 5px #ff6600;
            border: 1px solid #ff6600;
        }
        .neon-text {
            text-shadow: 0 0 8px #ff6600;
        }
        /* Custom Scrollbar Elements */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0d0d0d;
        }
        ::-webkit-scrollbar-thumb {
            background: #ff6600;
            border-radius: 3px;
        }
        
        /* Drag and Drop Canvas Elements Manipulation Class Matrices */
        .editable-element {
            position: absolute;
            cursor: move;
            user-select: none;
            transition: outline 0.1s ease;
        }
        .editable-element:hover {
            outline: 2px dashed #ff6600;
        }
        .editable-element.selected {
            outline: 2px solid #ff6600 !important;
        }
        
        /* 4-Dot Resizer Elements Structure */
        .resize-handle {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #ff6600;
            border: 1px solid #ffffff;
            border-radius: 50%;
            display: none;
            z-index: 50;
        }
        .editable-element.selected .resize-handle {
            display: block;
        }
        .tl { top: -5px; left: -5px; cursor: nwse-resize; }
        .tr { top: -5px; right: -5px; cursor: nesw-resize; }
        .bl { bottom: -5px; left: -5px; cursor: nesw-resize; }
        .br { bottom: -5px; right: -5px; cursor: nwse-resize; }
    </style>
</head>
<body class="w-screen h-screen flex flex-col m-0 p-0 select-none">

    <div id="setup-view" class="w-full h-full flex flex-col items-center justify-center p-6 z-50 bg-[#0d0d0d]">
        <div class="w-full max-w-3xl bg-zinc-900 border border-zinc-800 rounded-xl p-6 space-y-4 shadow-2xl">
            <div class="flex items-center space-x-3 border-b border-zinc-800 pb-3">
                <i class="fa-solid fa-code-matrix text-2xl text-orange-500 neon-text"></i>
                <h1 class="text-xl font-black uppercase tracking-wider text-white">Sandbox <span class="text-orange-500 neon-text">Compiler</span></h1>
            </div>
            
            <div class="space-y-2">
                <label class="block text-xs font-bold text-zinc-400 uppercase tracking-widest">Paste Source Code Sandbox Layout (HTML Strings)</label>
                <textarea id="source-code-input" rows="12" placeholder="<!DOCTYPE html>&#10;<html>&#10;<body>&#10;  <div style='width:200px; height:100px; background:red;'>Drag Me</div>&#10;</body>&#10;</html>" class="w-full bg-black border border-zinc-700 rounded-lg p-3 font-mono text-xs focus:outline-none focus:border-orange-500 text-emerald-400 resize-none"></textarea>
            </div>
            
            <button onclick="compileRawSourceInput()" class="w-full neon-border bg-black text-orange-500 font-bold py-3.5 rounded-lg text-xs uppercase tracking-widest transition duration-200 hover:bg-orange-600 hover:text-black">
                <i class="fa-solid fa-bolt mr-2"></i>Initialize Workspace
            </button>
        </div>
    </div>

    <div id="editor-view" class="hidden w-full h-full flex flex-col relative bg-zinc-900">
        
        <div class="bg-zinc-950 border-b border-zinc-900 px-6 py-4 flex items-center justify-between z-40">
            <div class="flex items-center space-x-4">
                <button onclick="clearWorkspaceSession()" class="text-zinc-400 hover:text-red-500 p-2 bg-black rounded border border-zinc-800 transition">
                    <i class="fa-solid fa-trash-can-list mr-2"></i>Clear Session
                </button>
                <div>
                    <h2 class="font-bold text-white leading-tight uppercase tracking-wide text-sm">Active Workspace Canvas</h2>
                    <p class="text-[11px] text-zinc-500">Changes auto-save locally. Double click elements to edit content properties.</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-4">
                <div class="bg-black rounded-lg p-1 border border-zinc-800 flex space-x-1 text-xs">
                    <button onclick="setCanvasMode('desktop')" id="btn-mode-desktop" class="px-3 py-1.5 rounded font-medium bg-orange-600 text-black">
                        <i class="fa-solid fa-desktop mr-1.5"></i>Desktop
                    </button>
                    <button onclick="setCanvasMode('mobile')" id="btn-mode-mobile" class="px-3 py-1.5 rounded font-medium text-zinc-400 hover:text-white">
                        <i class="fa-solid fa-mobile-screen-button mr-1.5"></i>Mobile
                    </button>
                </div>
                <button onclick="exportToClipboard()" class="neon-border bg-black text-orange-500 font-bold px-5 py-2 rounded-lg text-sm transition flex items-center hover:bg-orange-600 hover:text-black">
                    <i class="fa-solid fa-copy mr-2"></i>Export Clipboard Blueprint
                </button>
            </div>
        </div>

        <div class="flex-1 w-full bg-zinc-900 overflow-auto relative p-0 m-0 z-10">
            <div id="editor-canvas" class="bg-white text-black min-h-full relative transition-all duration-300 shadow-2xl mx-auto" style="width: 100%; max-width: none; flex-shrink: 0;">
                </div>
        </div>
    </div>

    <script>
        // Core Global Engine State Variables
        let currentlySelectedElement = null;
        let activeDragElement = null;
        let isResizing = false;
        let currentHandleType = '';
        let startX, startY, startWidth, startHeight, startLeft, startTop;

        // Track taps for mobile touch interactions
        let lastTapTime = 0;
        let lastTapTarget = null;

        // Initialization Pipeline: Verifies LocalStorage Matrix Logs on Setup
        document.addEventListener("DOMContentLoaded", () => {
            const cachedProgressData = localStorage.getItem("sandbox_autosave_payload");
            if (cachedProgressData) {
                document.getElementById("setup-view").classList.add("hidden");
                document.getElementById("editor-view").classList.remove("hidden");
                
                const canvas = document.getElementById("editor-canvas");
                canvas.innerHTML = cachedProgressData;
                
                // Re-bind mouse interaction listeners to active objects inside container matrix
                setupCanvasElements(canvas);
            }
        });

        // Initialize compiler workflow interface
        function compileRawSourceInput() {
            const codePayload = document.getElementById("source-code-input").value.trim();
            if (!codePayload) {
                alert("Cannot initialize environment with empty layout strings.");
                return;
            }

            document.getElementById("setup-view").classList.add("hidden");
            document.getElementById("editor-view").classList.remove("hidden");

            const canvas = document.getElementById("editor-canvas");
            
            // Clean code segments formatting and inject raw source strings straight inside frame window
            canvas.innerHTML = extractBodyContent(codePayload);
            
            setupCanvasElements(canvas);
            saveCurrentStateProgress();
        }

        // Extracts content inside body tags safely if a whole html document was pasted
        function extractBodyContent(htmlString) {
            const match = htmlString.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
            return match ? match[1] : htmlString;
        }

        function setupCanvasElements(canvas) {
            const elements = canvas.querySelectorAll('*');
            elements.forEach((el) => {
                if(el === canvas || el.classList.contains('resize-handle')) return;
                
                el.classList.add('editable-element');
                
                // Mount 4 corner resize handles inside element bounding layouts
                const handles = ['tl', 'tr', 'bl', 'br'];
                handles.forEach(h => {
                    if (!el.querySelector(`.resize-handle.${h}`)) {
                        const d = document.createElement('div');
                        d.className = `resize-handle ${h}`;
                        el.appendChild(d);
                    }
                });

                // Enforce absolute layouts to allow free element movement coordination parameters
                const computed = window.getComputedStyle(el);
                if(computed.position !== 'absolute' && computed.position !== 'fixed') {
                    el.style.position = 'absolute';
                    if(!el.style.top || el.style.top === 'auto') el.style.top = `${el.offsetTop}px`;
                    if(!el.style.left || el.style.left === 'auto') el.style.left = `${el.offsetLeft}px`;
                }

                // Drag, Drop and Touch Pointer Normalizers Mapping Interfaces
                el.addEventListener('mousedown', initiateDragOrResize);
                el.addEventListener('touchstart', initiateDragOrResize, { passive: false });
                el.addEventListener('dblclick', processElementConfigurationMenu);

                // Pure Mobile Multi-touch Double-Tap Logic Mapping Setup Configuration
                el.addEventListener('touchstart', function(e) {
                    const currentTime = new Date().getTime();
                    const tapLength = currentTime - lastTapTime;
                    if (lastTapTarget === this && tapLength < 250 && tapLength > 0) {
                        e.preventDefault(); 
                        e.stopPropagation();
                        processElementConfigurationMenu.call(this, e);
                    }
                    lastTapTime = currentTime;
                    lastTapTarget = this;
                }, { passive: false });
            });

            // Global Mouse tracking layout state operations parameters cleanup management loop
            document.removeEventListener('mousemove', globalTrackMovement);
            document.removeEventListener('mouseup', globalCeaseMovement);
            document.removeEventListener('touchmove', globalTrackMovement);
            document.removeEventListener('touchend', globalCeaseMovement);

            document.addEventListener('mousemove', globalTrackMovement);
            document.addEventListener('mouseup', globalCeaseMovement);
            document.addEventListener('touchmove', globalTrackMovement, { passive: false });
            document.addEventListener('touchend', globalCeaseMovement);
            
            canvas.addEventListener('click', (e) => { if(e.target === canvas) clearSelectionMatrix(); });
            canvas.addEventListener('touchstart', (e) => { if(e.target === canvas) clearSelectionMatrix(); });
        }

        function clearSelectionMatrix() {
            if(currentlySelectedElement) {
                currentlySelectedElement.classList.remove('selected');
                currentlySelectedElement = null;
            }
        }

        function initiateDragOrResize(e) {
            clearSelectionMatrix();
            let targetElement = e.target.closest('.editable-element');
            if(!targetElement) return;

            currentlySelectedElement = targetElement;
            currentlySelectedElement.classList.add('selected');

            if (e.target.classList.contains('resize-handle')) {
                isResizing = true;
                currentHandleType = e.target.classList[1];
                activeDragElement = currentlySelectedElement;
            } else {
                isResizing = false;
                activeDragElement = currentlySelectedElement;
            }

            const pointerSource = e.touches ? e.touches[0] : e;
            startX = pointerSource.clientX;
            startY = pointerSource.clientY;
            
            startWidth = parseInt(document.defaultView.getComputedStyle(activeDragElement).width, 10) || activeDragElement.offsetWidth;
            startHeight = parseInt(document.defaultView.getComputedStyle(activeDragElement).height, 10) || activeDragElement.offsetHeight;
            startLeft = parseInt(activeDragElement.style.left, 10) || activeDragElement.offsetLeft;
            startTop = parseInt(activeDragElement.style.top, 10) || activeDragElement.offsetTop;

            e.stopPropagation();
            if(e.cancelable && e.type !== 'touchstart') e.preventDefault();
        }

        function globalTrackMovement(e) {
            if (!activeDragElement) return;

            const pointerSource = e.touches ? e.touches[0] : e;
            const deltaX = pointerSource.clientX - startX;
            const deltaY = pointerSource.clientY - startY;

            if (isResizing) {
                if (currentHandleType === 'br') {
                    activeDragElement.style.width = `${startWidth + deltaX}px`;
                    activeDragElement.style.height = `${startHeight + deltaY}px`;
                } else if (currentHandleType === 'bl') {
                    activeDragElement.style.width = `${startWidth - deltaX}px`;
                    activeDragElement.style.left = `${startLeft + deltaX}px`;
                    activeDragElement.style.height = `${startHeight + deltaY}px`;
                } else if (currentHandleType === 'tr') {
                    activeDragElement.style.width = `${startWidth + deltaX}px`;
                    activeDragElement.style.height = `${startHeight - deltaY}px`;
                    activeDragElement.style.top = `${startTop + deltaY}px`;
                } else if (currentHandleType === 'tl') {
                    activeDragElement.style.width = `${startWidth - deltaX}px`;
                    activeDragElement.style.left = `${startLeft + deltaX}px`;
                    activeDragElement.style.height = `${startHeight - deltaY}px`;
                    activeDragElement.style.top = `${startTop + deltaY}px`;
                }
            } else {
                activeDragElement.style.left = `${startLeft + deltaX}px`;
                activeDragElement.style.top = `${startTop + deltaY}px`;
            }

            if(e.cancelable) e.preventDefault();
            saveCurrentStateProgress();
        }

        function globalCeaseMovement() {
            activeDragElement = null;
            isResizing = false;
        }

        function processElementConfigurationMenu(e) {
            if (e) e.stopPropagation();
            const el = this;

            const selection = prompt(
                "Select element configuration attribute parameter to change:\n" +
                "1: Edit text content\n" +
                "2: Edit color / background styles\n" +
                "3: Modify typography font dimensions sizing scale"
            );

            if (!selection) return;

            switch(selection.trim()) {
                case '1':
                    const originalText = el.innerText;
                    const newText = prompt("Enter text context content string:", originalText);
                    if (newText !== null) {
                        const structures = el.querySelectorAll('.resize-handle');
                        el.innerText = newText;
                        structures.forEach(h => el.appendChild(h));
                    }
                    break;
                case '2':
                    const option = prompt("Enter 1 to change text color, or 2 to change Background Color properties:");
                    if(option === '1') {
                        const colorValue = prompt("Enter text color (e.g., white, #ff6600, red):");
                        if(colorValue) el.style.color = colorValue;
                    } else if(option === '2') {
                        const bgValue = prompt("Enter background styling rules values (e.g., black, rgba(0,0,0,0.8), #000):");
                        if(bgValue) el.style.backgroundColor = bgValue;
                    }
                    break;
                case '3':
                    const fontSize = prompt("Enter text design sizing matrix metrics (e.g., 14px, 1.5rem, 32px):");
                    if(fontSize) el.style.fontSize = fontSize;
                    break;
                default:
                    alert("Invalid option selected.");
                    break;
            }
            saveCurrentStateProgress();
        }

        function setCanvasMode(mode) {
            const canvas = document.getElementById('editor-canvas');
            const btnD = document.getElementById('btn-mode-desktop');
            const btnM = document.getElementById('btn-mode-mobile');

            if(mode === 'mobile') {
                canvas.style.width = '375px';
                btnM.className = "px-3 py-1.5 rounded font-medium bg-orange-600 text-black";
                btnD.className = "px-3 py-1.5 rounded font-medium text-zinc-400 hover:text-white";
            } else {
                canvas.style.width = '100%';
                btnD.className = "px-3 py-1.5 rounded font-medium bg-orange-600 text-black";
                btnM.className = "px-3 py-1.5 rounded font-medium text-zinc-400 hover:text-white";
            }
        }

        // Syncs active runtime canvas markup structures payload cleanly into LocalStorage tracking banks
        function saveCurrentStateProgress() {
            const innerCanvasHtml = document.getElementById('editor-canvas').innerHTML;
            localStorage.setItem("sandbox_autosave_payload", innerCanvasHtml);
        }

        function clearWorkspaceSession() {
            if(confirm("Are you sure you want to completely drop this workspace session tracking history?")) {
                localStorage.removeItem("sandbox_autosave_payload");
                document.getElementById("source-code-input").value = "";
                document.getElementById("editor-view").classList.add("hidden");
                document.getElementById("setup-view").classList.remove("hidden");
            }
        }

        // Export utility mapping process pipeline copies structural code variables right straight into clipboard matrices
        function exportToClipboard() {
            const workingCanvas = document.getElementById('editor-canvas').cloneNode(true);
            
            // Cleanup engine asset wrappers before building compilation output matrix
            workingCanvas.querySelectorAll('.resize-handle').forEach(h => h.remove());
            workingCanvas.querySelectorAll('.editable-element').forEach(el => {
                el.classList.remove('editable-element', 'selected');
            });

            const cleanInnerHtml = workingCanvas.innerHTML;

            const structuralOutputDocument = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exported Project Matrix</title>
    <script src="https://cdn.tailwindcss.com"><\/script>
    <style>
        body { margin: 0; padding: 0; overflow-x: hidden; position: relative; width: 100%; min-height: 100vh; }
        .responsive-container { position: relative; width: 100%; min-height: 100vh; overflow: hidden; }
        @media (max-width: 768px) {
            .responsive-container * {
                position: relative !important;
                left: 0 !important;
                top: 0 !important;
                width: 100% !important;
                height: auto !important;
                margin-bottom: 1rem !important;
                box-sizing: border-box !important;
                display: block !important;
            }
            .responsive-container {
                display: flex !important;
                flex-direction: column !important;
                padding: 16px !important;
                overflow-y: auto !important;
            }
        }
    </style>
</head>
<body class="bg-white text-black">
    <div class="responsive-container">
        ${cleanInnerHtml.trim()}
    </div>
</body>
</html>`;

            navigator.clipboard.writeText(structuralOutputDocument)
                .then(() => {
                    alert("Cleaned deployment production blueprint code matrix successfully copied directly to your clipboard system.");
                })
                .catch(err => {
                    console.error("Unable to execute automated writing requests straight onto system clipboard storage channels: ", err);
                    alert("Failure to copy package data context payload automatically.");
                });
        }
    </script>
</body>
</html>
