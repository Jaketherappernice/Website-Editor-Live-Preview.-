<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>ChaosForge · Random Website Generator + COPY FULL PAGE</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #101115 0%, #1a1c22 100%);
      font-family: system-ui, 'Segoe UI', 'Inter', 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
      padding: 1.5rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .generator-panel {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      background: rgba(12, 12, 18, 0.65);
      backdrop-filter: blur(12px);
      border-radius: 3rem;
      padding: 1.5rem 2rem 2rem 2rem;
      box-shadow: 0 25px 45px -12px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .action-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .btn-group {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .randomize-btn {
      background: radial-gradient(circle at 30% 10%, #f0b87b, #f57c2e);
      border: none;
      padding: 0.9rem 2rem;
      font-size: 1.3rem;
      font-weight: 700;
      border-radius: 60px;
      color: #1e1a0c;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
    }

    .copy-btn {
      background: radial-gradient(circle at 30% 10%, #1e2a3a, #0f1722);
      border: 1px solid #60a5fa;
      padding: 0.9rem 2rem;
      font-size: 1.3rem;
      font-weight: 600;
      border-radius: 60px;
      color: #bbf0ff;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
    }

    .copy-btn:hover {
      background: radial-gradient(circle at 30% 10%, #2d3e52, #182433);
      border-color: #93c5fd;
      transform: translateY(-2px);
    }

    .randomize-btn:hover {
      transform: scale(1.02) translateY(-2px);
      filter: brightness(1.05);
    }

    .stats {
      background: #0c0c12cc;
      backdrop-filter: blur(4px);
      padding: 0.5rem 1.4rem;
      border-radius: 80px;
      font-family: monospace;
      font-size: 1rem;
      font-weight: 500;
      color: #f5e7d9;
      border: 1px solid #ffb56b30;
    }

    .stats span {
      color: #ffbc6e;
      font-weight: 700;
    }

    .website-stage {
      background: #ffffff;
      border-radius: 2rem;
      overflow: hidden;
      box-shadow: 0 20px 35px -12px black;
      border: 1px solid rgba(255,255,240,0.2);
      min-height: 540px;
    }

    .website-frame {
      width: 100%;
      background: white;
    }

    .toast-msg {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) scale(0.9);
      background: #0a2f1fcc;
      backdrop-filter: blur(16px);
      color: #b9ffc3;
      padding: 0.8rem 2rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.95rem;
      z-index: 999;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      border: 1px solid #6eff8e;
      white-space: nowrap;
      font-family: monospace;
    }

    .toast-msg.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    @media (max-width: 760px) {
      body { padding: 0.8rem; }
      .generator-panel { padding: 1rem; }
      .randomize-btn, .copy-btn { padding: 0.6rem 1.2rem; font-size: 1rem; }
      .toast-msg { white-space: nowrap; font-size: 0.8rem; padding: 0.5rem 1rem; }
    }
  </style>
</head>
<body>

<div class="generator-panel">
  <div class="action-bar">
    <div class="btn-group">
      <button class="randomize-btn" id="chaosButton">✨ RANDOMIZE ✨</button>
      <button class="copy-btn" id="copyFullPageBtn">📋 COPY FULL PAGE SOURCE</button>
    </div>
    <div class="stats">
      🔮 seed: <span id="seedValue">—</span> &nbsp;|&nbsp; 📁 category: <span id="categoryLabel">—</span>
    </div>
  </div>

  <div class="website-stage">
    <div id="liveWebsiteRoot" class="website-frame">
      <div style="padding: 3rem; text-align: center; color: #555; background: #faf9fc;">🌀 click RANDOMIZE → then COPY</div>
    </div>
  </div>
</div>

<div id="toastMsg" class="toast-msg">✅ Full page HTML copied to clipboard!</div>

<script>
  (function(){
    // ----- RANDOM ENGINE (same chaotic goodness) -----
    const CATEGORIES = ["LANDING PAGE","E-COMMERCE","DASHBOARD","PORTFOLIO","BLOG","SAAS STARTER","ADMIN PANEL","SOCIAL APP","MAGAZINE","ANALYTICS HUB"];
    
    function randomColorPalette(seedOffset = 0) {
      const hue = (Math.floor(Math.random() * 360) + seedOffset) % 360;
      const sat = 55 + Math.floor(Math.random() * 35);
      const lightBg = 92 + Math.floor(Math.random() * 6);
      const primaryHue = (hue + 40 + Math.floor(Math.random() * 60)) % 360;
      const accentHue = (primaryHue + 130 + Math.floor(Math.random() * 80)) % 360;
      return {
        bgLight: `hsl(${hue}, ${sat}%, ${lightBg}%)`,
        primaryColor: `hsl(${primaryHue}, ${Math.min(sat+10,88)}%, 48%)`,
        accentColor: `hsl(${accentHue}, 72%, 58%)`,
        textDark: `hsl(${hue}, 30%, 18%)`,
        textMuted: `hsl(${hue}, 20%, 38%)`,
        cardBg: `hsl(${hue}, ${sat-15}%, 98%)`,
      };
    }
    
    function getRandomPicsumUrl(width, height, seed) {
      const realSeed = seed !== undefined ? seed : Math.floor(Math.random() * 10000);
      return `https://picsum.photos/id/${realSeed % 1000}/${width}/${height}?rand=${Date.now()+Math.random()}`;
    }
    
    function generateRandomWebsite(clickCounter) {
      const chaosSeed = (clickCounter * 127) ^ Math.floor(Date.now() * Math.random());
      const r = (max) => Math.floor(Math.random() * max);
      const category = CATEGORIES[(chaosSeed + r(7)) % CATEGORIES.length];
      const theme = randomColorPalette(chaosSeed);
      const layoutVariant = r(5);
      const bannerId = (chaosSeed + r(300)) % 400 + 1;
      const bannerImg = `https://picsum.photos/id/${bannerId}/1200/400`;
      const productImg1 = `https://picsum.photos/id/${(bannerId + 37) % 400}/400/300`;
      const productImg2 = `https://picsum.photos/id/${(bannerId + 88) % 400}/400/300`;
      const productImg3 = `https://picsum.photos/id/${(bannerId + 143) % 400}/400/300`;
      const avatarImg = `https://picsum.photos/id/${(bannerId % 70) + 30}/80/80`;
      
      const randNouns = ["Nexus","Orbit","Void","Aether","Lumina","Cypher","Flux","Nimbus"];
      const randAdj = ["Radical","Neo","Hyper","Frost","Ember","Zenith","Mythic"];
      const brandName = `${randAdj[Math.floor(Math.random()*randAdj.length)]}${randNouns[Math.floor(Math.random()*randNouns.length)]}`;
      const fakePrice = (Math.random() * 450 + 19).toFixed(2);
      const discount = Math.floor(Math.random() * 40) + 5;
      
      const styleBlock = `
        <style>
          .rand-website * { margin: 0; padding: 0; box-sizing: border-box; }
          .rand-website { font-family: 'Inter', system-ui, sans-serif; background: ${theme.bgLight}; color: ${theme.textDark}; line-height: 1.4; }
          .rand-website .container { max-width: 1280px; margin: 0 auto; padding: 1.2rem 2rem; }
          .rand-website .btn-primary { background: ${theme.primaryColor}; border: none; color: white; padding: 0.75rem 1.8rem; border-radius: 40px; font-weight: 600; display: inline-block; cursor: default; }
          .rand-website .btn-accent { background: ${theme.accentColor}; border: none; color: #1f1f2a; padding: 0.7rem 1.5rem; border-radius: 60px; font-weight: 600; cursor: default; }
          .rand-website .card { background: ${theme.cardBg}; border-radius: 28px; padding: 1.5rem; box-shadow: 0 12px 24px -12px rgba(0,0,0,0.08); border: 1px solid rgba(0,0,0,0.02);}
          .rand-website .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.8rem; margin: 2rem 0; }
          .rand-website .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;}
          .rand-website h1, h2, h3 { font-weight: 700; letter-spacing: -0.02em; }
          .rand-website .hero-gradient { background: linear-gradient(135deg, ${theme.primaryColor}10, ${theme.accentColor}15); border-radius: 2rem; padding: 2rem; }
        </style>
      `;
      
      const productShowcase = `<div class="grid-3"><div class="card"><img src="${productImg1}" style="width:100%; border-radius: 18px;"><h3>Cosmic Edition</h3><p>$${fakePrice}</p><div class="btn-primary">Shop</div></div><div class="card"><img src="${productImg2}" style="width:100%; border-radius: 18px;"><h3>NeoVibe</h3><p>$${(parseFloat(fakePrice)+47).toFixed(2)}</p><div class="btn-primary">Explore</div></div><div class="card"><img src="${productImg3}" style="width:100%; border-radius: 18px;"><h3>Aether Pro</h3><p>$${(parseFloat(fakePrice)*1.2).toFixed(2)}</p><div class="btn-accent">-${discount}%</div></div></div>`;
      const dashboardMetrics = `<div class="grid-3"><div class="card"><h3>📈 Revenue</h3><p style="font-size:2rem;">$${Math.floor(Math.random()*10000+1200)}</p></div><div class="card"><h3>👥 Users</h3><p style="font-size:2rem;">${Math.floor(Math.random()*25000+340)}</p></div><div class="card"><h3>⚙️ Conversion</h3><p style="font-size:2rem;">${(Math.random()*12+2).toFixed(1)}%</p></div></div>`;
      
      let customSection = "";
      if (category === "DASHBOARD" || layoutVariant === 2) customSection = `<div class="hero-gradient"><h2>📊 Dashboard</h2>${dashboardMetrics}</div>`;
      else if (category === "E-COMMERCE" || layoutVariant === 1) customSection = `<div><h2>🔥 Trending</h2>${productShowcase}</div>`;
      else customSection = `<div class="hero-gradient"><h2>✨ ${brandName}</h2><p>Fresh random design. Every click is unique.</p><div class="flex-between"><span class="btn-primary">Start</span><span class="btn-accent">Learn</span></div></div>`;
      
      const hero = `<div style="background: url(${bannerImg}) center/cover no-repeat; border-radius: 28px; min-height: 220px; display: flex; align-items: center; justify-content: center;"><div style="background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); padding: 1rem 2rem; border-radius: 60px; color: white;"><h1>${brandName}</h1><p>${category}</p></div></div>`;
      const nav = `<div class="flex-between" style="border-bottom: 2px solid ${theme.primaryColor}30; padding-bottom: 1rem;"><div style="font-weight:800; font-size:1.5rem;">⚡${brandName.slice(0,2)}</div><div style="display:flex; gap:1.2rem;"><span>Explore</span><span>Shop</span><span>Account</span></div></div>`;
      const footer = `<div style="margin-top: 3rem; padding: 1.5rem 0; text-align: center; border-top: 1px solid ${theme.textMuted}30;">🌀 randomized generator | picsum assets</div>`;
      let extra = "";
      if (category === "SOCIAL APP") extra = `<div class="grid-3"><div class="card"><img src="${avatarImg}" style="border-radius: 50%; width:60px;"><h4>@randomuser</h4></div><div class="card">🔥 trending #viral</div></div>`;
      
      const innerHTML = `<div class="rand-website">${styleBlock}<div class="container">${nav}${hero}${customSection}${extra}${footer}</div></div>`;
      
      // FULL STANDALONE HTML DOCUMENT (what you actually want to copy)
      const fullDocument = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Generated ${category} · ChaosForge</title>
  ${styleBlock}
</head>
<body style="margin:0; padding:0;">
  ${innerHTML}
</body>
</html>`;
      
      return { fullHTML: fullDocument, displayHTML: innerHTML, categoryDisplay: category, themeColors: theme };
    }
    
    // ----- DOM elements -----
    const btn = document.getElementById('chaosButton');
    const copyBtn = document.getElementById('copyFullPageBtn');
    const liveRoot = document.getElementById('liveWebsiteRoot');
    const seedSpan = document.getElementById('seedValue');
    const categorySpan = document.getElementById('categoryLabel');
    const toastEl = document.getElementById('toastMsg');
    
    let clickCount = 0;
    let lastFullHTML = "";
    
    function showToast(msg) {
      toastEl.textContent = msg || "✅ Full page HTML copied!";
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 2000);
    }
    
    function renderRandom() {
      clickCount++;
      seedSpan.innerText = clickCount;
      const { fullHTML, displayHTML, categoryDisplay, themeColors } = generateRandomWebsite(clickCount);
      lastFullHTML = fullHTML;
      liveRoot.innerHTML = displayHTML;
      categorySpan.innerText = categoryDisplay;
      const stage = document.querySelector('.website-stage');
      if (themeColors?.primaryColor) {
        stage.style.border = `1px solid ${themeColors.primaryColor}80`;
        setTimeout(() => stage.style.border = "1px solid rgba(255,255,240,0.2)", 200);
      }
    }
    
    function copyFullPage() {
      if (!lastFullHTML) {
        showToast("⚠️ Generate a website first!");
        return;
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(lastFullHTML).then(() => showToast("✅ Full page HTML copied!")).catch(() => fallbackCopy(lastFullHTML));
      } else {
        fallbackCopy(lastFullHTML);
      }
    }
    
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast("✅ Copied (fallback)");
    }
    
    btn.addEventListener('click', renderRandom);
    copyBtn.addEventListener('click', copyFullPage);
    
    // initial render
    renderRandom();
  })();
</script>
</body>
</html>
