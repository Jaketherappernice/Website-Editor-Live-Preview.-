<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Hub - Admin Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0d0d0d;
            color: #e5e5e5;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        .neon-border {
            box-shadow: 0 0 10px #ff6600, inset 0 0 5px #ff6600;
            border: 1px solid #ff6600;
        }
        .neon-text {
            text-shadow: 0 0 8px #ff6600;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0d0d0d;
        }
        ::-webkit-scrollbar-thumb {
            background: #ff6600;
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-black border-b border-orange-600/30 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-user-gear text-2xl text-orange-500 neon-text"></i>
            <h1 class="text-xl font-black uppercase tracking-wider text-white">Template <span class="text-orange-500 neon-text">Hub</span> <span class="text-xs text-zinc-500 ml-2 font-mono">v1.0 (Admin)</span></h1>
        </div>
        <a href="index.html" class="px-4 py-2 rounded text-sm font-semibold border border-orange-500/50 text-orange-500 hover:bg-orange-500 hover:text-black transition duration-300">
            <i class="fa-solid fa-arrow-left mr-2"></i>Back to Live Site
        </a>
    </header>

    <main class="flex-1 p-6 max-w-7xl w-full mx-auto space-y-6">
        
        <div class="flex justify-between items-center">
            <h2 class="text-2xl font-bold tracking-tight text-white uppercase border-l-4 border-orange-500 pl-3">Database Management</h2>
            <button onclick="openModal()" class="bg-orange-600 hover:bg-orange-500 text-black font-bold px-5 py-2.5 rounded-lg text-sm flex items-center shadow-lg shadow-orange-600/20 transition duration-200">
                <i class="fa-solid fa-plus mr-2"></i>Add New Template
            </button>
        </div>

        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-zinc-900/50 p-4 rounded-xl border border-zinc-800">
            <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-zinc-500"></i>
                <input type="text" id="admin-search" oninput="filterTemplates()" placeholder="Search template formulas by name..." class="w-full bg-black border border-zinc-700 rounded-lg pl-12 pr-4 py-3 text-sm focus:outline-none focus:border-orange-500 text-white">
            </div>
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-filter text-zinc-400 text-sm"></i>
                <select id="admin-filter" onchange="filterTemplates()" class="bg-black border border-zinc-700 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-orange-500 text-white min-w-[180px]">
                    <option value="all">All Subcategories</option>
                    <option value="landing">Landing Pages</option>
                    <option value="portfolio">Portfolios</option>
                    <option value="dashboard">Dashboards</option>
                </select>
            </div>
        </div>

        <div class="bg-black border border-zinc-800 rounded-xl overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-zinc-900 text-zinc-400 uppercase text-xs tracking-wider border-b border-zinc-800">
                            <th class="p-4 w-24">Preview</th>
                            <th class="p-4">Template Name</th>
                            <th class="p-4">Category Segment</th>
                            <th class="p-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body" class="divide-y divide-zinc-900 text-sm">
                        <tr>
                            <td colspan="4" class="p-12 text-center text-zinc-500">
                                <i class="fa-solid fa-circle-notch animate-spin text-2xl text-orange-500 mb-3"></i>
                                <p>Syncing layout schemas from Firestore core cloud network...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="admin-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-zinc-900 border border-zinc-700 w-full max-w-2xl rounded-xl shadow-2xl flex flex-col overflow-hidden">
            
            <div class="bg-black border-b border-zinc-800 px-6 py-4 flex justify-between items-center">
                <h3 id="modal-headline" class="text-md font-bold uppercase text-orange-500 tracking-wide">Add Structural Formula</h3>
                <button onclick="closeModal()" class="text-zinc-500 hover:text-white transition"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <form id="template-form" onsubmit="saveTemplateRecord(event)" class="p-6 space-y-4 overflow-y-auto max-h-[75vh]">
                <input type="hidden" id="form-template-id">
                
                <div>
                    <label class="block text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2">Template Name</label>
                    <input type="text" id="form-name" required placeholder="e.g., Cyberpunk Grid System" class="w-full bg-black border border-zinc-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-orange-500 text-white">
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2">Category Segment</label>
                        <select id="form-category" class="w-full bg-black border border-zinc-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-orange-500 text-white">
                            <option value="landing">Landing Page</option>
                            <option value="portfolio">Portfolio Layout</option>
                            <option value="dashboard">Dashboard Interface</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2">Thumbnail Preview URL</label>
                        <input type="url" id="form-image" required placeholder="https://images.unsplash.com/..." class="w-full bg-black border border-zinc-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-orange-500 text-white">
                    </div>
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2">Source Code Blueprint (HTML Sandbox Elements)</label>
                    <textarea id="form-code" required rows="10" placeholder="&#10;<div style='position: absolute; top: 50px; left: 50px; width: 200px; height: 100px; background-color: cyan;'>Text Content Box</div>" class="w-full bg-black border border-zinc-700 rounded-lg p-3 font-mono text-xs focus:outline-none focus:border-orange-500 text-emerald-400"></textarea>
                </div>
                
                <div class="pt-2 flex justify-end space-x-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-medium rounded-lg text-sm transition">Cancel</button>
                    <button type="submit" class="px-5 py-2 bg-orange-600 hover:bg-orange-500 text-black font-bold rounded-lg text-sm shadow-lg shadow-orange-600/10 transition">Commit Record</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Configuration Matching Project Sandbox Credentials
        const firebaseConfig = {
            apiKey: "AIzaSyBfJVcXgioTyyg6ZvJrlZjlmbRCGdGf0Hk",
            authDomain: "evidence-hub-media.firebaseapp.com",
            projectId: "evidence-hub-media",
            storageBucket: "evidence-hub-media.firebasestorage.app",
            messagingSenderId: "140321888915",
            appId: "1:140321888915:web:d974047e083d757ce20b66",
            measurementId: "G-BZT4GWT9FF"
        };

        // Initialize App & Access Layer Components
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let templatesCache = [];

        // Expose control workflows to raw window environment layout triggers
        window.openModal = openModal;
        window.closeModal = closeModal;
        window.saveTemplateRecord = saveTemplateRecord;
        window.editTemplate = editTemplate;
        window.deleteTemplate = deleteTemplate;
        window.filterTemplates = filterTemplates;

        // Fetch Live Updates from Firestore
        async function streamTemplatesDatabase() {
            try {
                const querySnapshot = await getDocs(collection(db, "templates"));
                templatesCache = [];
                querySnapshot.forEach((doc) => {
                    templatesCache.push({ id: doc.id, ...doc.data() });
                });
                renderAdminTable(templatesCache);
            } catch (err) {
                console.error("Failed to populate remote matrix collections: ", err);
                document.getElementById('admin-table-body').innerHTML = `
                    <tr><td colspan="4" class="p-8 text-center text-red-500 font-semibold">Error linking database arrays. Check console logs.</td></tr>
                `;
            }
        }

        // Output formatting engines
        function renderAdminTable(dataset) {
            const tbody = document.getElementById('admin-table-body');
            if (dataset.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-zinc-600">No layout components discovered on node.</td></tr>`;
                return;
            }
            tbody.innerHTML = dataset.map(item => `
                <tr class="hover:bg-zinc-900/40 border-b border-zinc-900 transition">
                    <td class="p-4">
                        <img src="${item.imageUrl || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe'}" class="w-14 h-10 object-cover rounded border border-zinc-800">
                    </td>
                    <td class="p-4 font-semibold text-white tracking-wide">${item.name}</td>
                    <td class="p-4"><span class="text-xs font-mono uppercase bg-zinc-800 text-orange-400 border border-orange-500/10 px-2 py-1 rounded">${item.category}</span></td>
                    <td class="p-4 text-right space-x-1">
                        <button onclick="editTemplate('${item.id}')" class="text-zinc-400 hover:text-orange-500 hover:bg-orange-500/10 w-9 h-9 rounded-lg transition" title="Edit Formula"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button onclick="deleteTemplate('${item.id}')" class="text-zinc-400 hover:text-red-500 hover:bg-red-500/10 w-9 h-9 rounded-lg transition" title="Delete Formula"><i class="fa-solid fa-trash-can"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        // Live filtration routines
        function filterTemplates() {
            const searchVal = document.getElementById('admin-search').value.toLowerCase();
            const categoryVal = document.getElementById('admin-filter').value;

            const filtered = templatesCache.filter(item => {
                const searchMatch = item.name.toLowerCase().includes(searchVal);
                const categoryMatch = categoryVal === 'all' || item.category === categoryVal;
                return searchMatch && categoryMatch;
            });
            renderAdminTable(filtered);
        }

        // Interface triggers
        function openModal() {
            document.getElementById('template-form').reset();
            document.getElementById('form-template-id').value = '';
            document.getElementById('modal-headline').innerText = "Add Structural Formula";
            document.getElementById('admin-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('admin-modal').classList.add('hidden');
        }

        // Commit Logic (Write or Overwrite Mutation Actions)
        async function saveTemplateRecord(e) {
            e.preventDefault();
            const id = document.getElementById('form-template-id').value;
            const payload = {
                name: document.getElementById('form-name').value,
                category: document.getElementById('form-category').value,
                imageUrl: document.getElementById('form-image').value,
                sourceCode: document.getElementById('form-code').value
            };

            try {
                if (id) {
                    await updateDoc(doc(db, "templates", id), payload);
                } else {
                    await addDoc(collection(db, "templates"), payload);
                }
                closeModal();
                streamTemplatesDatabase();
            } catch (err) {
                console.error("Database structural update aborted: ", err);
                alert("Failed to commit database block parameters.");
            }
        }

        // Edit Mode Hook Engine mapping layout parameters to textfield inputs
        function editTemplate(id) {
            const target = templatesCache.find(t => t.id === id);
            if (!target) return;

            document.getElementById('form-template-id').value = target.id;
            document.getElementById('form-name').value = target.name;
            document.getElementById('form-category').value = target.category;
            document.getElementById('form-image').value = target.imageUrl;
            document.getElementById('form-code').value = target.sourceCode;

            document.getElementById('modal-headline').innerText = "Modify Blueprint Matrix";
            document.getElementById('admin-modal').classList.remove('hidden');
        }

        // Purge Execution Routines
        async function deleteTemplate(id) {
            if (confirm("Are you absolutely sure you want to permanently delete this template component from cloud storage memory files?")) {
                try {
                    await deleteDoc(doc(db, "templates", id));
                    streamTemplatesDatabase();
                } catch (err) {
                    console.error("Purge operations denied: ", err);
                }
            }
        }

        // Launch stream arrays
        streamTemplatesDatabase();
    </script>
</body>
</html>
