<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body, html { margin:0; padding:0; width:100%; min-height:100%; overflow-x:hidden; background:#fff; font-family: sans-serif; }
        #site-canvas { position:relative; width:100%; max-width:1440px; height:1000px; background-color:white; background-image:none; background-size:cover; background-position:center; margin:0 auto; overflow:hidden; }
        .dropped-element { position:absolute; display:flex; align-items:center; justify-content:center; box-sizing: border-box; transition: opacity 0.2s; }
        .dropped-element > * { width:100%; height:100%; object-fit:cover; border-radius:12px; border:none; margin:0; box-sizing: border-box; }
        textarea { resize: none; box-sizing: border-box; padding: 10px; }
        button { cursor: pointer; transition: transform 0.1s; background-size: cover; background-position: center; }
        button:active { transform: scale(0.98); }
        @media (min-width: 601px) { #site-canvas { width: 100%; } #el-0 { left:13.8281%; top:159px; width:23.8473%; height:280.132px; z-index:40 !important; opacity:1; }
#el-0 > * { font-size:24px !important; }
 }
        @media (max-width: 600px) { #site-canvas { width: 100vw; max-width: 100vw; } #el-0 { left:47.2000%; top:159px; width:81.3989%; height:280.132px; z-index:40 !important; opacity:1; }
#el-0 > * { font-size:24px !important; }
 }
    </style>
</head>
<body><div id="site-canvas"><div id="el-0" class="dropped-element"><h2 style="font-size: 24px; color: rgb(0, 0, 0);">Heading</h2></div></div></body>
</html>
