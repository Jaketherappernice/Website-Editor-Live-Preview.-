<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Canvas Builder</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #f1f5f9; }

        #appHeader { flex: 0 0 auto; background: #1e293b; color: white; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; z-index: 10; }
        #canvasWrapper { flex: 1 1 0; position: relative; overflow: hidden; background: #cbd5e1; }
        #livePreview { width: 100%; height: 100%; border: none; display: block; background: white; }
        
        #loadingOverlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 100; color: white; font-weight: bold; }
        #loadingOverlay.visible { display: flex; }

        #appFooter { flex: 0 0 auto; background: white; border-top: 1px solid #e2e8f0; padding: 10px; }
        #bottomBar { display: flex; gap: 8px; }
        #chatInput { flex: 1; height: 40px; padding: 0 15px; border: 1px solid #94a3b8; border-radius: 8px; outline: none; }
        .abtn { height: 40px; padding: 0 12px; border: none; border-radius: 8px; color: white; cursor: pointer; font-weight: bold; }
        #sendBtn { background: #3b82f6; }
        #copyBtn { background: #10b981; }
        #clearBtn { background: #ef4444; }
    </style>
</head>
<body>

    <div id="appHeader">
        <div>Canvas Builder</div>
        <div id="status">Ready</div>
    </div>

    <div id="canvasWrapper">
        <iframe id="livePreview"></iframe>
        <div id="loadingOverlay">AI IS THINKING...</div>
    </div>

    <div id="appFooter">
        <div id="bottomBar">
            <input id="chatInput" type="text" placeholder="Update design..." />
            <button id="sendBtn" class="abtn"><i class="fas fa-paper-plane"></i></button>
            <button id="copyBtn" class="abtn"><i class="fas fa-copy"></i></button>
            <button id="clearBtn" class="abtn"><i class="fas fa-trash"></i></button>
        </div>
    </div>

    <script>
        const GROQ_API_KEY  = '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';
        const GROQ_ENDPOINT = 'https://api.groq.com/openai/v1/chat/completions';

        let currentHTML = `<!DOCTYPE html><html><head><style>
            body { margin: 0; padding: 20px; font-family: sans-serif; min-height: 100vh; overflow: auto; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
            .resizer-dot { width: 26px; height: 26px; background: #3b82f6; border: 3px solid white; border-radius: 50%; position: absolute; z-index: 99999; touch-action: none; }
            .dragging { opacity: 0.5 !important; pointer-events: none !important; }
        </style></head><body></body></html>`;

        const preview = document.getElementById('livePreview');
        const chatInput = document.getElementById('chatInput');
        const loading = document.getElementById('loadingOverlay');

        function render() {
            const blob = new Blob([currentHTML], { type: 'text/html' });
            preview.src = URL.createObjectURL(blob);
            preview.onload = () => setupInteractions(preview.contentDocument);
        }

        function setupInteractions(doc) {
            let selected = null, resizing = null, dragging = null;
            let startRect, startPos, handleType, offset = {x:0, y:0};

            const getPos = (e) => {
                const t = e.touches ? e.touches[0] : e;
                return { x: t.clientX, y: t.clientY };
            };

            const clearDots = () => doc.querySelectorAll('.resizer-dot').forEach(d => d.remove());

            const addDots = (el) => {
                clearDots();
                if (!el) return;
                const r = el.getBoundingClientRect();
                const sx = doc.defaultView.scrollX;
                const sy = doc.defaultView.scrollY;
                const pos = ['tl', 'tr', 'bl', 'br'];
                
                pos.forEach(p => {
                    const dot = doc.createElement('div');
                    dot.className = `resizer-dot resizer-${p}`;
                    dot.style.top = (sy + (p.includes('t') ? r.top : r.bottom) - 13) + 'px';
                    dot.style.left = (sx + (p.includes('l') ? r.left : r.right) - 13) + 'px';
                    
                    const onStart = (e) => {
                        e.stopPropagation(); e.preventDefault();
                        resizing = el; handleType = p;
                        const pnt = getPos(e);
                        startPos = {x: pnt.x, y: pnt.y};
                        startRect = el.getBoundingClientRect();
                        if(doc.defaultView.getComputedStyle(el).display === 'inline') el.style.display = 'inline-block';
                        el.style.position = 'absolute';
                    };
                    dot.ontouchstart = onStart;
                    dot.onmousedown = onStart;
                    doc.body.appendChild(dot);
                });
            };

            doc.ontouchstart = (e) => {
                if (e.target.classList.contains('resizer-dot')) return;
                const t = e.target;
                if (t === doc.body || t === doc.documentElement) {
                    if(selected) selected.style.outline = '';
                    selected = null; clearDots(); return;
                }
                if (selected === t) {
                    if(confirm('Delete?')) { t.remove(); selected = null; clearDots(); sync(); }
                } else {
                    if(selected) selected.style.outline = '';
                    selected = t;
                    selected.style.outline = '2px solid red';
                    addDots(selected);
                }
            };

            doc.oncontextmenu = (e) => {
                if(e.target === doc.body) return;
                e.preventDefault();
                dragging = e.target;
                const p = getPos(e);
                const r = dragging.getBoundingClientRect();
                offset = { x: p.x - r.left, y: p.y - r.top };
                dragging.style.position = 'absolute';
                dragging.classList.add('dragging');
                clearDots();
            };

            const onMove = (e) => {
                if (!resizing && !dragging) return;
                e.preventDefault();
                const p = getPos(e);
                if (resizing) {
                    const dx = p.x - startPos.x;
                    const dy = p.y - startPos.y;
                    if (handleType.includes('r')) resizing.style.width = (startRect.width + dx) + 'px';
                    if (handleType.includes('b')) resizing.style.height = (startRect.height + dy) + 'px';
                    if (handleType.includes('l')) { resizing.style.width = (startRect.width - dx) + 'px'; resizing.style.left = (startRect.left + dx) + 'px'; }
                    if (handleType.includes('t')) { resizing.style.height = (startRect.height - dy) + 'px'; resizing.style.top = (startRect.top + dy) + 'px'; }
                } else if (dragging) {
                    dragging.style.left = (p.x - offset.x) + 'px';
                    dragging.style.top = (p.y - offset.y) + 'px';
                }
            };

            doc.ontouchmove = onMove;
            doc.onmousemove = onMove;

            const onEnd = () => {
                if (resizing || dragging) {
                    const el = resizing || dragging;
                    el.classList.remove('dragging');
                    addDots(el);
                    resizing = dragging = null;
                    sync();
                }
            };

            doc.ontouchend = onEnd;
            doc.onmouseup = onEnd;
        }

        function sync() {
            const doc = preview.contentDocument;
            const clone = doc.documentElement.cloneNode(true);
            clone.querySelectorAll('.resizer-dot').forEach(d => d.remove());
            clone.querySelectorAll('*').forEach(el => el.style.outline = '');
            currentHTML = clone.outerHTML;
        }

        async function send() {
            const val = chatInput.value.trim(); if(!val) return;
            chatInput.value = ''; sync();
            loading.classList.add('visible');
            try {
                const r = await fetch(GROQ_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${GROQ_API_KEY}` },
                    body: JSON.stringify({
                        model: 'llama-3.3-70b-versatile',
                        messages: [{role: 'system', content: 'Return ONLY raw HTML code.'}, {role: 'user', content: `Current HTML: ${currentHTML}\nTask: ${val}`}]
                    })
                });
                const d = await r.json();
                currentHTML = d.choices[0].message.content.replace(/```html|```/g, '').trim();
                render();
            } finally { loading.classList.remove('visible'); }
        }

        document.getElementById('sendBtn').onclick = send;
        chatInput.onkeydown = e => e.key === 'Enter' && send();
        document.getElementById('copyBtn').onclick = () => { sync(); navigator.clipboard.writeText(currentHTML); alert('Copied!'); };
        document.getElementById('clearBtn').onclick = () => { if(confirm('Clear?')) { location.reload(); } };

        render();
    </script>
</body>
</html>
