<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visual Animation Injector Pro</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        html { touch-action: pan-x pan-y; }

        #setup-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; transition: all 0.5s ease;
        }

        #code-input {
            width: 70%; height: 350px; padding: 20px;
            border-radius: 15px; border: 2px solid #ddd;
            font-family: 'Courier New', Courier, monospace; 
            font-size: 16px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); outline: none;
        }

        #start-btn {
            margin-top: 25px; padding: 18px 50px; font-size: 20px;
            background: #000; color: white; border: none;
            border-radius: 50px; cursor: pointer; transition: 0.3s;
        }

        #start-btn:hover { transform: scale(1.05); background: #333; }

        #render-canvas { width: 100%; min-height: 100vh; display: none; padding: 20px; box-sizing: border-box; }

        /* CRITICAL: This disables button/link functionality inside the preview */
        #render-canvas button, 
        #render-canvas a, 
        #render-canvas input[type="submit"] {
            pointer-events: auto; /* Keep this auto so the canvas listener can still hear the click */
            cursor: crosshair;
        }

        .editing-now { outline: 4px solid #00ff88 !important; outline-offset: 4px; border-radius: 2px; }

        #export-btn {
            position: fixed; bottom: 30px; right: 30px;
            width: 70px; height: 70px; border-radius: 50%;
            background: #28a745; color: white; border: none;
            font-size: 35px; cursor: pointer; display: none;
            box-shadow: 0 10px 25px rgba(40, 167, 69, 0.4); z-index: 10000;
        }
    </style>
</head>
<body>

    <div id="setup-overlay">
        <h1 style="margin-bottom: 10px;">Paste Website HTML</h1>
        <p style="margin-bottom: 20px; color: #666;">Once started, double-click an element to animate it.</p>
        <textarea id="code-input" placeholder="<html>...</html>"></textarea>
        <button id="start-btn">Let's Start</button>
    </div>

    <div id="render-canvas"></div>
    <div id="style-bucket"></div>

    <button id="export-btn">📋</button>

    <script>
        const canvas = document.getElementById('render-canvas');
        const styleBucket = document.getElementById('style-bucket');
        const exportBtn = document.getElementById('export-btn');
        let activeEl = null;

        // 1. Initial Load
        document.getElementById('start-btn').onclick = () => {
            const raw = document.getElementById('code-input').value;
            if(!raw) return alert("Empty code!");
            
            canvas.innerHTML = raw;
            document.getElementById('setup-overlay').style.display = 'none';
            canvas.style.display = 'block';
            exportBtn.style.display = 'block';

            // Disable all functional elements in the injected HTML
            const links = canvas.querySelectorAll('a, button, input[type="submit"]');
            links.forEach(item => {
                item.addEventListener('click', (e) => {
                    e.preventDefault(); // Stop links from navigating or buttons from submitting
                    e.stopPropagation(); // Stop events from bubbling up weirdly
                });
            });
        };

        // 2. Interaction Logic
        canvas.addEventListener('click', (e) => {
            // This still works because we didn't disable the canvas itself
            if(e.target === canvas) return;
            e.preventDefault();
            e.stopPropagation();

            if(activeEl) activeEl.classList.remove('editing-now');
            activeEl = e.target;

            if (e.detail === 1) {
                activeEl.classList.add('editing-now');
            } 
            else if (e.detail === 2) {
                const cssInput = prompt("Paste your @keyframes and .class block here:");
                if (cssInput) {
                    const classMatch = cssInput.match(/\.([a-zA-Z0-9_-]+)/);
                    if (classMatch && classMatch[1]) {
                        activeEl.classList.add(classMatch[1]);
                    }

                    const styleTag = document.createElement('style');
                    styleTag.textContent = cssInput;
                    styleBucket.appendChild(styleTag);
                }
            } 
            else if (e.detail === 3) {
                activeEl.className = ""; 
                activeEl.style.animation = "none";
                alert("Animations cleared.");
            }
        });

        // 3. Export with CSS
        exportBtn.onclick = () => {
            if(activeEl) activeEl.classList.remove('editing-now');
            
            const styles = Array.from(styleBucket.querySelectorAll('style'))
                                .map(s => s.textContent).join('\n');
            
            const finalDoc = `
<!DOCTYPE html>
<html>
<head>
    <style>${styles}</style>
</head>
<body>
    ${canvas.innerHTML}
</body>
</html>`;

            navigator.clipboard.writeText(finalDoc).then(() => {
                alert("Exported! The HTML is clean and ready for use.");
            });
        };

        // --- ANTI-ZOOM PROTECTION ---
        window.addEventListener('keydown', function (e) {
            if (e.ctrlKey && (e.key === '=' || e.key === '+')) e.preventDefault();
        }, { passive: false });

        window.addEventListener('wheel', function (e) {
            if (e.ctrlKey && e.deltaY < 0) e.preventDefault();
        }, { passive: false });

        document.addEventListener('touchstart', function (e) {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });

        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });

    </script>
</body>
</html>
