<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visual Animation Injector Pro</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        html { touch-action: pan-x pan-y; }

        #setup-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999;
        }

        #code-input {
            width: 70%; height: 350px; padding: 20px;
            border-radius: 15px; border: 2px solid #ddd;
            font-family: 'Courier New', Courier, monospace; font-size: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); outline: none;
        }

        #start-btn {
            margin-top: 25px; padding: 18px 50px; font-size: 20px;
            background: #000; color: white; border: none;
            border-radius: 50px; cursor: pointer;
        }

        #render-canvas { width: 100%; min-height: 100vh; display: none; padding: 20px; box-sizing: border-box; }

        /* visual indicator that elements are 'locked' and selectable */
        #render-canvas * { cursor: crosshair !important; }

        .editing-now { outline: 4px solid #00ff88 !important; outline-offset: 4px; border-radius: 2px; }

        #export-btn {
            position: fixed; bottom: 30px; right: 30px;
            width: 70px; height: 70px; border-radius: 50%;
            background: #28a745; color: white; border: none;
            font-size: 35px; cursor: pointer; display: none;
            z-index: 10000;
        }
    </style>
</head>
<body>

    <div id="setup-overlay">
        <h1>Paste Website HTML</h1>
        <p style="margin-bottom: 20px; color: #666;">Editing Mode: Clicks are disabled to allow selection.</p>
        <textarea id="code-input" placeholder="<html>...</html>"></textarea>
        <button id="start-btn">Let's Start</button>
    </div>

    <div id="render-canvas"></div>
    <div id="style-bucket"></div>
    <button id="export-btn">📋</button>

    <script>
        const canvas = document.getElementById('render-canvas');
        const styleBucket = document.getElementById('style-bucket');
        const exportBtn = document.getElementById('export-btn');
        let activeEl = null;

        // 1. Initial Load
        document.getElementById('start-btn').onclick = () => {
            const raw = document.getElementById('code-input').value;
            if(!raw) return alert("Empty code!");
            
            canvas.innerHTML = raw;
            document.getElementById('setup-overlay').style.display = 'none';
            canvas.style.display = 'block';
            exportBtn.style.display = 'block';
        };

        // 2. THE LOCKDOWN: Capture all clicks and submits before they happen
        // Using 'true' as the third argument enables "Capture Phase" which overrides internal HTML scripts
        canvas.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();

            if(e.target === canvas) return;

            if(activeEl) activeEl.classList.remove('editing-now');
            activeEl = e.target;

            if (e.detail === 1) {
                activeEl.classList.add('editing-now');
            } 
            else if (e.detail === 2) {
                const cssInput = prompt("Paste CSS (.class + @keyframes):");
                if (cssInput) {
                    const classMatch = cssInput.match(/\.([a-zA-Z0-9_-]+)/);
                    if (classMatch && classMatch[1]) {
                        activeEl.classList.add(classMatch[1]);
                    }
                    const styleTag = document.createElement('style');
                    styleTag.textContent = cssInput;
                    styleBucket.appendChild(styleTag);
                }
            } 
            else if (e.detail === 3) {
                activeEl.className = ""; 
                alert("Cleared.");
            }
        }, true); // TRUE = Capture Phase (The "Secret Sauce" to stop redirects)

        // Block form submissions (searching/logging in) in the preview
        canvas.addEventListener('submit', (e) => {
            e.preventDefault();
            e.stopPropagation();
        }, true);

        // 3. Export
        exportBtn.onclick = () => {
            if(activeEl) activeEl.classList.remove('editing-now');
            const styles = Array.from(styleBucket.querySelectorAll('style')).map(s => s.textContent).join('\n');
            const finalDoc = `<!DOCTYPE html><html><head><style>${styles}</style></head><body>${canvas.innerHTML}</body></html>`;
            navigator.clipboard.writeText(finalDoc).then(() => alert("Exported to clipboard!"));
        };

        // --- ANTI-ZOOM ---
        window.addEventListener('keydown', (e) => {
            if (e.ctrlKey && (e.key === '=' || e.key === '+')) e.preventDefault();
        }, { passive: false });

        window.addEventListener('wheel', (e) => {
            if (e.ctrlKey && e.deltaY < 0) e.preventDefault();
        }, { passive: false });

        document.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });

        document.addEventListener('gesturestart', (e) => e.preventDefault());
    </script>
</body>
</html>
