<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Responsive Builder</title>
    <style>
        :root { --primary: #4f46e5; --secondary: #10b981; --grid: #e5e7eb; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: sans-serif; overflow: hidden; background: #f3f4f6; touch-action: none; user-select: none; transition: background 0.3s; }
        
        #viewport { 
            width: 100vw; height: 100vh; margin: 0 auto; background: white; position: relative; 
            overflow-y: auto; overflow-x: hidden; transition: width 0.3s ease, height 0.3s ease;
            box-shadow: 0 0 50px rgba(0,0,0,0.1);
            background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 25px 25px;
            scroll-behavior: smooth;
        }
        
        #viewport.mobile { 
            width: 375px; height: 80vh; margin: 5vh auto; 
            border: 12px solid #333; border-radius: 30px; 
            position: relative;
        }

        #canvas {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .fab { position: fixed; width: 60px; height: 60px; border-radius: 50%; color: white; border: none; font-size: 24px; z-index: 1001; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; cursor: pointer; }
        #add-btn { bottom: 20px; left: 20px; background: var(--primary); }
        #settings-btn { bottom: 20px; left: 90px; background: #4b5563; }
        .popup-panel { position: fixed; bottom: 95px; background: white; border-radius: 12px; padding: 15px; display: none; flex-direction: column; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.2); width: 220px; }
        .item { padding: 10px; margin-bottom: 8px; background: #f8fafc; border: 1px solid #cbd5e1; text-align: center; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .toggle-active { background: var(--primary) !important; color: white; }

        .dropped-element { position: absolute; box-sizing: border-box; display: flex; align-items: center; justify-content: center; cursor: move; }
        .dropped-element > *:not(.resizer) { width: 100%; height: 100%; display: block; margin: 0; pointer-events: none; object-fit: cover; }
        
        .dropped-element[data-type="Box"] { z-index: 10 !important; }
        .dropped-element[data-type="Image"] { z-index: 20 !important; }
        .dropped-element[data-type="Button"] { z-index: 30 !important; }
        .dropped-element[data-type="Heading"], 
        .dropped-element[data-type="Paragraph"], 
        .dropped-element[data-type="Textarea"] { z-index: 40 !important; }

        .selected { outline: 2px solid var(--primary); z-index: 100 !important; }
        .resizer { width: 14px; height: 14px; background: white; border: 2px solid var(--primary); position: absolute; border-radius: 2px; display: none; z-index: 110; }
        .selected .resizer { display: block; }
        .nw { top: -7px; left: -7px; } .ne { top: -7px; right: -7px; } .sw { bottom: -7px; left: -7px; } .se { bottom: -7px; right: -7px; }

        #copy-btn { position: fixed; top: 15px; right: 15px; padding: 12px 20px; background: var(--secondary); color: white; border: none; border-radius: 8px; font-weight: bold; z-index: 1000; cursor: pointer; }
        #size-control, #height-control, #opacity-control { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 15px; box-shadow: 0 0 50px rgba(0,0,0,0.3); z-index: 2000; width: 250px; text-align: center; }

        .dropped-element[data-type="Image"], 
        .dropped-element[data-type="Image"] img { background-color: transparent !important; background-image: none !important; }

        /* Save & Load Modal Styles */
        #save-load-modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 20px; border-radius: 15px; box-shadow: 0 10px 50px rgba(0,0,0,0.4);
            z-index: 3000; width: 340px; max-height: 80vh; overflow-y: auto;
        }
        .save-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .save-header h3 { margin: 0; color: #333; }
        .close-btn { cursor: pointer; font-size: 24px; border: none; background: transparent; color: #666; }
        .save-input-group { display: flex; gap: 8px; margin-bottom: 20px; }
        .save-input-group input { flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
        .save-input-group button { background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: opacity 0.2s; }
        .save-input-group button:disabled { opacity: 0.6; cursor: not-allowed; }
        .save-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 10px; background: #f8fafc; }
        .save-item-name { font-weight: bold; color: #333; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .save-actions button { border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; margin-left: 5px; color: white; }
        .btn-load { background: var(--secondary); }
        .btn-delete { background: #ef4444; }
    </style>
</head>
<body>

    <button id="copy-btn">Copy Full Website</button>
    
    <div id="viewport">
        <div id="canvas" style="width:100%; height:1000px; position:relative; min-height: 100%; background-color: white;"></div>
    </div>

    <button id="add-btn" class="fab">+</button>
    <button id="settings-btn" class="fab">⚙️</button>

    <div id="panel" class="popup-panel">
        <div class="item" data-type="Heading">Heading</div>
        <div class="item" data-type="Paragraph">Paragraph</div>
        <div class="item" data-type="Button">Button</div>
        <div class="item" data-type="Image">Image</div>
        <div class="item" data-type="Textarea">Textarea</div>
        <div class="item" data-type="Box">Container</div>
    </div>

    <div id="settings-panel" class="popup-panel">
        <div class="item" id="mode-toggle" onclick="toggleViewMode()">Switch to Mobile</div>
        <div class="item" onclick="triggerCanvasColor()">BG Color</div>
        <div class="item" onclick="triggerCanvasImage()">BG Image URL</div>
        <div class="item" onclick="document.getElementById('height-control').style.display='block'">Page Height</div>
        <div class="item" style="background:#4b5563;color:white;border:none;" onclick="openSaveLoad()">💾 Save & Load</div>
    </div>

    <div id="save-load-modal">
        <div class="save-header">
            <h3>Projects</h3>
            <button class="close-btn" onclick="closeSaveLoad()">&times;</button>
        </div>
        <div class="save-input-group">
            <input type="text" id="save-name-input" placeholder="Project Name...">
            <button id="save-action-btn" onclick="window.saveProject()">Save</button>
        </div>
        <div id="saves-list">
        </div>
    </div>

    <div id="size-control">
        <strong>Font Size</strong><br>
        <input type="range" id="size-slider" min="8" max="200">
        <input type="number" id="size-num"> px<br><br>
        <button onclick="document.getElementById('size-control').style.display='none'" style="background:var(--primary);color:white;border:none;padding:8px 15px;border-radius:5px;">Done</button>
    </div>

    <div id="opacity-control">
        <strong>Opacity</strong><br>
        <input type="range" id="opacity-slider" min="0" max="100" value="100">
        <span id="opacity-val">100</span>%<br><br>
        <button onclick="document.getElementById('opacity-control').style.display='none'" style="background:var(--primary);color:white;border:none;padding:8px 15px;border-radius:5px;">Done</button>
    </div>

    <div id="height-control">
        <strong>Page Height</strong><br>
        <input type="range" id="height-slider" min="500" max="8000" value="1000">
        <input type="number" id="height-num" value="1000"> px<br><br>
        <button onclick="document.getElementById('height-control').style.display='none'" style="background:var(--primary);color:white;border:none;padding:8px 15px;border-radius:5px;">Done</button>
    </div>

    <input type="color" id="colorPicker" style="display:none">
    <input type="color" id="canvasColorPicker" style="display:none">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBZG26OmqR_DwV9UKCVQuRE3JzCy6SleAs",
            authDomain: "dragndrop-eeda4.firebaseapp.com",
            projectId: "dragndrop-eeda4",
            storageBucket: "dragndrop-eeda4.firebasestorage.app",
            messagingSenderId: "124148111401",
            appId: "1:124148111401:web:95011428420e219497e438",
            measurementId: "G-L6NJ4Y36QW"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        window.loadedProjectsData = {};

        // Helper function to force timeouts on Firebase calls
        const withTimeout = (promise, ms, errorMsg) => {
            let timeoutId;
            const timeoutPromise = new Promise((_, reject) => {
                timeoutId = setTimeout(() => reject(new Error(errorMsg)), ms);
            });
            return Promise.race([promise, timeoutPromise]).finally(() => clearTimeout(timeoutId));
        };

        window.loadSavesList = async function() {
            const listEl = document.getElementById('saves-list');
            listEl.innerHTML = '<div style="text-align:center;color:#666;">Loading saves...</div>';
            try {
                // Timeout after 8 seconds if rules block reads
                const querySnapshot = await withTimeout(
                    getDocs(collection(db, "saves")), 
                    8000, 
                    "Firebase took too long to load saves. Check your Firestore Rules."
                );
                
                listEl.innerHTML = '';
                window.loadedProjectsData = {};
                
                if(querySnapshot.empty) {
                    listEl.innerHTML = '<div style="text-align:center;color:#9ca3af;padding:10px;">No saved projects yet.</div>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    window.loadedProjectsData[docSnap.id] = data;
                    
                    const div = document.createElement('div');
                    div.className = 'save-item';
                    div.innerHTML = `
                        <div class="save-item-name" title="${data.name}">${data.name}</div>
                        <div class="save-actions">
                            <button class="btn-load" onclick="window.loadProject('${docSnap.id}')">Load</button>
                            <button class="btn-delete" onclick="window.deleteProject('${docSnap.id}')">Del</button>
                        </div>
                    `;
                    listEl.appendChild(div);
                });
            } catch(e) {
                console.error("Error loading list: ", e);
                listEl.innerHTML = `<div style="color:red;font-size:12px;text-align:center;">Failed to load data:<br>${e.message}</div>`;
            }
        };

        window.saveProject = async function() {
            const saveName = document.getElementById('save-name-input').value.trim();
            if(!saveName) { alert("Please enter a project name!"); return; }
            
            document.querySelectorAll('.dropped-element').forEach(window.saveCurrentState);

            const elements = [];
            document.querySelectorAll('.dropped-element').forEach(el => {
                elements.push({
                    type: el.dataset.type,
                    desktop: el.dataset.desktop || '{}',
                    mobile: el.dataset.mobile || '{}',
                    link: el.dataset.link || '',
                    innerHTML: el.innerHTML
                });
            });

            const canvasData = {
                height: document.getElementById('canvas').style.height || '1000px',
                bgColor: document.getElementById('canvas').style.backgroundColor || 'white',
                bgImg: document.getElementById('canvas').style.backgroundImage || 'none'
            };

            const btn = document.getElementById('save-action-btn');
            btn.innerText = "Saving...";
            btn.disabled = true;
            
            try {
                // Timeout after 8 seconds if rules block writes
                await withTimeout(
                    addDoc(collection(db, "saves"), {
                        name: saveName,
                        elements: elements,
                        canvas: canvasData,
                        timestamp: Date.now()
                    }),
                    8000,
                    "Save action timed out. Are your Firestore rules set to allow writes?"
                );

                document.getElementById('save-name-input').value = '';
                alert("Project Saved Successfully!");
                await window.loadSavesList();
            } catch (e) {
                console.error("Error saving: ", e);
                alert(`Save Failed:\n${e.message}\n\nPlease check Firebase Console -> Firestore Database -> Rules.`);
            } finally {
                btn.innerText = "Save";
                btn.disabled = false;
            }
        };

        window.deleteProject = async function(id) {
            if(!confirm("Are you sure you want to delete this save permanently?")) return;
            try {
                await withTimeout(
                    deleteDoc(doc(db, "saves", id)),
                    8000,
                    "Delete action timed out."
                );
                await window.loadSavesList();
            } catch(e) {
                console.error("Error deleting: ", e);
                alert(`Failed to delete:\n${e.message}`);
            }
        };
    </script>

    <script>
    const canvas = document.getElementById('canvas');
    const viewport = document.getElementById('viewport');
    const modeToggle = document.getElementById('mode-toggle');
    const heightSlider = document.getElementById('height-slider');
    const heightNum = document.getElementById('height-num');
    
    let currentMode = 'desktop'; 
    let activeEl, isMoving, currentResizer, startX, startY, startW, startH, startL, startT;

    window.loadSavesList = window.loadSavesList || function() {};
    window.saveProject = window.saveProject || function() { alert("Database logic is still connecting... try again in a moment."); };
    window.deleteProject = window.deleteProject || function() {};

    function toggleP(id) {
        const p = document.getElementById(id);
        const isVisible = p.style.display === 'flex';
        document.querySelectorAll('.popup-panel').forEach(panel => panel.style.display = 'none');
        p.style.display = isVisible ? 'none' : 'flex';
    }

    function openSaveLoad() {
        document.getElementById('settings-panel').style.display = 'none';
        document.getElementById('save-load-modal').style.display = 'block';
        window.loadSavesList();
    }

    function closeSaveLoad() {
        document.getElementById('save-load-modal').style.display = 'none';
    }

    document.getElementById('add-btn').onclick = (e) => { e.stopPropagation(); toggleP('panel'); };
    document.getElementById('settings-btn').onclick = (e) => { e.stopPropagation(); toggleP('settings-panel'); };

    heightSlider.oninput = heightNum.oninput = (e) => {
        const val = e.target.value;
        heightSlider.value = heightNum.value = val;
        canvas.style.height = val + 'px';
    };

    function toggleViewMode() {
        currentMode = currentMode === 'desktop' ? 'mobile' : 'desktop';
        viewport.className = currentMode === 'mobile' ? 'mobile' : '';
        modeToggle.innerText = currentMode === 'mobile' ? 'Switch to Desktop' : 'Switch to Mobile';
        modeToggle.classList.toggle('toggle-active', currentMode === 'mobile');
        
        document.querySelectorAll('.dropped-element').forEach(el => {
            const data = JSON.parse(el.dataset[currentMode] || '{}');
            if (data.w) {
                el.style.width = data.w; el.style.height = data.h;
                el.style.left = data.l; el.style.top = data.t;
                const inner = el.querySelector('h2, p, button, img, div, textarea');
                if (data.fs && inner && ['Heading', 'Paragraph', 'Textarea', 'Button'].includes(el.dataset.type)) {
                    inner.style.fontSize = data.fs;
                }
                if (data.op) el.style.opacity = data.op;
            }
        });
    }

    window.saveCurrentState = function(el) {
        const inner = el.querySelector('h2, p, button, img, div, textarea');
        const state = {
            w: el.style.width, h: el.style.height,
            l: el.style.left, t: el.style.top,
            fs: (inner && inner.style.fontSize) ? inner.style.fontSize : "",
            op: el.style.opacity || "1"
        };
        el.dataset[currentMode] = JSON.stringify(state);
    };

    document.querySelectorAll('.item[data-type]').forEach(i => {
        i.onclick = () => { 
            const scrollPos = viewport.scrollTop;
            createNode(i.dataset.type, 50, scrollPos + 50); 
            toggleP('panel'); 
        };
    });

    function createNode(type, x, y) {
        const el = document.createElement('div');
        el.className = 'dropped-element';
        el.dataset.type = type;
        el.style.left = x + 'px'; el.style.top = y + 'px';
        
        if (type === 'Box' || type === 'Image' || type === 'Textarea') {
            el.style.width = "200px"; el.style.height = "150px";
        } else {
            el.style.width = "180px"; el.style.height = "50px";
        }

        const html = {
            'Heading': '<h2 style="font-size:24px;color:#000;">Heading</h2>',
            'Paragraph': '<p style="font-size:16px;color:#000;">Text...</p>',
            'Button': '<button style="background:#4f46e5;color:white;border:none;border-radius:12px;width:100%;height:100%;cursor:pointer;font-size:16px;">Click</button>',
            'Image': '<img src="https://via.placeholder.com/150" style="border-radius:12px;width:100%;height:100%;">',
            'Textarea': '<textarea placeholder="Enter text..." style="border:1px solid #ccc;border-radius:12px;padding:10px;width:100%;height:100%;resize:none;font-size:14px;"></textarea>',
            'Box': '<div style="border:2px solid #333;background:rgba(0,0,0,0.05);width:100%;height:100%;border-radius:12px;"></div>'
        };

        el.innerHTML = html[type] + `<div class="resizer nw"></div><div class="resizer ne"></div><div class="resizer sw"></div><div class="resizer se"></div>`;
        canvas.appendChild(el);
        window.saveCurrentState(el);
        setupEl(el);
    }

    function setupEl(el) {
        el.onmousedown = el.ontouchstart = (e) => {
            if (e.target.classList.contains('resizer')) return;
            activeEl = el; isMoving = true;
            document.querySelectorAll('.dropped-element').forEach(d => d.classList.remove('selected'));
            el.classList.add('selected');
            const t = e.touches ? e.touches[0] : e;
            startX = t.clientX - el.offsetLeft; 
            startY = t.clientY - el.offsetTop;
        };
        el.querySelectorAll('.resizer').forEach(r => {
            r.onmousedown = r.ontouchstart = (e) => {
                e.preventDefault(); e.stopPropagation();
                currentResizer = r; activeEl = el;
                const t = e.touches ? e.touches[0] : e;
                startX = t.clientX; startY = t.clientY;
                startW = el.offsetWidth; startH = el.offsetHeight;
                startL = el.offsetLeft; startT = el.offsetTop;
            };
        });
        let clicks = 0;
        el.onclick = (e) => {
            e.stopPropagation();
            clicks++;
            if (clicks === 2) { setTimeout(() => { if(clicks === 2) edit(el); }, 250); }
            else if (clicks === 3) { if(confirm("Delete?")) el.remove(); clicks = 0; }
            setTimeout(() => clicks = 0, 500);
        };
    }

    window.onmousemove = window.ontouchmove = (e) => {
        if (!activeEl) return;
        const t = e.touches ? e.touches[0] : e;
        if (isMoving) { activeEl.style.left = (t.clientX - startX) + 'px'; activeEl.style.top = (t.clientY - startY) + 'px'; }
        if (currentResizer) {
            const dx = t.clientX - startX, dy = t.clientY - startY, c = currentResizer.classList;
            if (c.contains('se')) { activeEl.style.width = (startW + dx)+'px'; activeEl.style.height = (startH + dy)+'px'; }
            if (c.contains('nw')) { activeEl.style.width = (startW - dx)+'px'; activeEl.style.left = (startL + dx)+'px'; activeEl.style.height = (startH - dy)+'px'; activeEl.style.top = (startT + dy)+'px'; }
        }
        if (isMoving || currentResizer) window.saveCurrentState(activeEl);
    };
    window.onmouseup = window.ontouchend = () => { isMoving = false; currentResizer = null; };

    function edit(el) {
        const inner = el.querySelector('h2, p, button, img, div, textarea');
        const action = prompt("1: Content/Link | 2: Size | 3: Color | 4: Transparency");
        
        if (action === '1') {
            if (el.dataset.type === 'Image') inner.src = prompt("URL:", inner.src) || inner.src;
            else if (el.dataset.type === 'Textarea') inner.placeholder = prompt("Placeholder:", inner.placeholder) || inner.placeholder;
            else if (el.dataset.type === 'Button') {
                inner.innerText = prompt("Text:", inner.innerText) || inner.innerText;
                let link = prompt("Link (e.g. google.com):", el.dataset.link || "");
                if (link && !link.startsWith('http')) link = 'https://' + link;
                el.dataset.link = link;
            } else inner.innerText = prompt("Text:", inner.innerText) || inner.innerText;
        } else if (action === '2' && ['Heading', 'Paragraph', 'Textarea', 'Button'].includes(el.dataset.type)) {
            document.getElementById('size-control').style.display = 'block';
            const s = document.getElementById('size-slider');
            const n = document.getElementById('size-num');
            s.value = n.value = parseInt(inner.style.fontSize) || 16;
            s.oninput = n.oninput = (e) => { inner.style.fontSize = e.target.value + 'px'; s.value = n.value = e.target.value; window.saveCurrentState(el); };
        } else if (action === '3') {
            let choice = prompt("1: Color Picker | 2: HEX Code | 3: Image URL (Stroke/BG)");
            if (choice === '1') {
                const cp = document.getElementById('colorPicker'); cp.click();
                cp.oninput = () => { 
                    if (['Button', 'Box'].includes(el.dataset.type)) {
                        inner.style.backgroundColor = cp.value;
                        inner.style.backgroundImage = 'none';
                    } else {
                        inner.style.color = cp.value;
                        inner.style.webkitTextFillColor = '';
                        inner.style.webkitBackgroundClip = '';
                        inner.style.backgroundImage = '';
                    }
                };
            } else if (choice === '2') {
                let hex = prompt("Enter HEX (e.g. #ff0000):");
                if (hex) {
                    if (['Button', 'Box'].includes(el.dataset.type)) {
                        inner.style.backgroundColor = hex;
                        inner.style.backgroundImage = 'none';
                    } else {
                        inner.style.color = hex;
                        inner.style.webkitTextFillColor = '';
                        inner.style.webkitBackgroundClip = '';
                        inner.style.backgroundImage = '';
                    }
                }
            } else if (choice === '3') {
                let url = prompt("Enter Image URL:");
                if (url) {
                    if (['Button', 'Box'].includes(el.dataset.type)) {
                        inner.style.backgroundImage = `url('${url}')`;
                        inner.style.backgroundSize = 'cover';
                    } else {
                        inner.style.backgroundImage = `url('${url}')`;
                        inner.style.webkitBackgroundClip = 'text';
                        inner.style.webkitTextFillColor = 'transparent';
                        inner.style.backgroundSize = 'cover';
                        inner.style.backgroundPosition = 'center';
                    }
                }
            }
        } else if (action === '4') {
            if (el.dataset.type === 'Button') {
                let currentBg = window.getComputedStyle(inner).backgroundColor;
                let opacity = prompt("Enter Background Opacity (0 to 1):", "0.5");
                let rgba = currentBg.replace('rgb', 'rgba').replace(')', `, ${opacity})`);
                inner.style.backgroundColor = rgba;
            } else {
                document.getElementById('opacity-control').style.display = 'block';
                const os = document.getElementById('opacity-slider');
                const ov = document.getElementById('opacity-val');
                os.value = (parseFloat(el.style.opacity) || 1) * 100;
                ov.innerText = os.value;
                os.oninput = (e) => { 
                    el.style.opacity = e.target.value / 100; 
                    ov.innerText = e.target.value; 
                    window.saveCurrentState(el); 
                };
            }
        }
        window.saveCurrentState(el);
    }

    function triggerCanvasColor() { const cp = document.getElementById('canvasColorPicker'); cp.click(); cp.oninput = () => { canvas.style.backgroundColor = cp.value; }; }
    function triggerCanvasImage() { const u = prompt("URL:"); if(u) canvas.style.backgroundImage = `url('${u}')`; }

    window.loadProject = function(id) {
        if(!confirm("Loading will overwrite your current unsaved work. Continue?")) return;
        const data = window.loadedProjectsData[id];
        if(!data) return;

        canvas.style.height = data.canvas.height;
        canvas.style.backgroundColor = data.canvas.bgColor;
        canvas.style.backgroundImage = data.canvas.bgImg;
        heightSlider.value = parseInt(data.canvas.height);
        heightNum.value = parseInt(data.canvas.height);

        canvas.innerHTML = '';
        data.elements.forEach(elData => {
            const el = document.createElement('div');
            el.className = 'dropped-element';
            el.dataset.type = elData.type;
            el.dataset.desktop = elData.desktop;
            el.dataset.mobile = elData.mobile;
            if(elData.link) el.dataset.link = elData.link;
            el.innerHTML = elData.innerHTML;
            
            canvas.appendChild(el);
            
            const state = JSON.parse(elData[currentMode] || elData.desktop || '{}');
            if (state.w) {
                el.style.width = state.w; el.style.height = state.h;
                el.style.left = state.l; el.style.top = state.t;
                const inner = el.querySelector('h2, p, button, img, div, textarea');
                if (state.fs && inner && ['Heading', 'Paragraph', 'Textarea', 'Button'].includes(elData.type)) {
                    inner.style.fontSize = state.fs;
                }
                if (state.op) el.style.opacity = state.op;
            }
            
            setupEl(el);
        });
        
        closeSaveLoad();
    };

    document.getElementById('copy-btn').onclick = () => {
        document.querySelectorAll('.dropped-element').forEach(window.saveCurrentState);
        
        const getZ = (t) => { 
            if (t === 'Heading' || t === 'Paragraph' || t === 'Textarea') return 40;
            if (t === 'Button') return 30;
            if (t === 'Image') return 20;
            if (t === 'Box') return 10;
            return 1;
        };

        const referenceW = 1440; 
        const mobileW = 375;
        const currentCanvasW = canvas.offsetWidth;

        let dStyles = "", mStyles = "";
        const fHeight = canvas.style.height || "1000px";
        const bgC = canvas.style.backgroundColor || "white";
        const bgI = canvas.style.backgroundImage || "none";
        
        let elementsHTML = "";
        document.querySelectorAll('.dropped-element').forEach((el, index) => {
            const id = `el-${index}`;
            const type = el.dataset.type;
            const z = getZ(type);
            const d = JSON.parse(el.dataset.desktop || '{}');
            const m = JSON.parse(el.dataset.mobile || '{}');
            const sourceInner = el.querySelector('h2, p, button, img, div, textarea');
            const inner = sourceInner.cloneNode(true);
            
            inner.style.cssText = sourceInner.style.cssText;
            if (type === 'Button' && el.dataset.link) {
                inner.setAttribute('onclick', `window.location.href='${el.dataset.link}'`);
            }

            elementsHTML += `<div id="${id}" class="dropped-element">${inner.outerHTML}</div>`;
            
            const dL = ((parseFloat(d.l) / currentCanvasW) * 100).toFixed(4) + '%';
            const dW = ((parseFloat(d.w) / currentCanvasW) * 100).toFixed(4) + '%';
            
            dStyles += `#${id} { left:${dL}; top:${d.t}; width:${dW}; height:${d.h}; z-index:${z} !important; opacity:${d.op || 1}; }\n`;
            if(d.fs) dStyles += `#${id} > * { font-size:${d.fs} !important; }\n`;
            
            const mlRaw = m.l || d.l;
            const mtRaw = m.t || d.t;
            const mwRaw = m.w || d.w;
            const mhRaw = m.h || d.h;
            const mL = ((parseFloat(mlRaw) / mobileW) * 100).toFixed(4) + '%';
            const mW = ((parseFloat(mwRaw) / mobileW) * 100).toFixed(4) + '%';
            
            mStyles += `#${id} { left:${mL}; top:${mtRaw}; width:${mW}; height:${mhRaw}; z-index:${z} !important; opacity:${m.op || d.op || 1}; }\n`;
            if(m.fs || d.fs) mStyles += `#${id} > * { font-size:${m.fs || d.fs} !important; }\n`;
        });

        const finalHTML = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body, html { margin:0; padding:0; width:100%; min-height:100%; overflow-x:hidden; background:#fff; font-family: sans-serif; }
        #site-canvas { position:relative; width:100%; max-width:${referenceW}px; height:${fHeight}; background-color:${bgC}; background-image:${bgI}; background-size:cover; background-position:center; margin:0 auto; overflow:hidden; }
        .dropped-element { position:absolute; display:flex; align-items:center; justify-content:center; box-sizing: border-box; transition: opacity 0.2s; }
        .dropped-element > * { width:100%; height:100%; object-fit:cover; border-radius:12px; border:none; margin:0; box-sizing: border-box; }
        textarea { resize: none; box-sizing: border-box; padding: 10px; }
        button { cursor: pointer; transition: transform 0.1s; background-size: cover; background-position: center; }
        button:active { transform: scale(0.98); }
        @media (min-width: 601px) { #site-canvas { width: 100%; } ${dStyles} }
        @media (max-width: 600px) { #site-canvas { width: 100vw; max-width: 100vw; } ${mStyles} }
    </style>
</head>
<body><div id="site-canvas">${elementsHTML}</div></body>
</html>`;
        
        navigator.clipboard.writeText(finalHTML).then(() => alert("Website Copied! Layout Fixed for Desktop."));
    };
    </script> 
</body>
</html>
