<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Responsive Builder - Full Version</title>
    <style>
        :root { --primary: #4f46e5; --secondary: #10b981; --grid: #e5e7eb; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: sans-serif; overflow: hidden; background: #f3f4f6; touch-action: none; user-select: none; transition: background 0.3s; }
        
        #viewport { 
            width: 100vw; height: 100vh; margin: 0 auto; background: white; position: relative; 
            overflow-y: auto; overflow-x: hidden; transition: width 0.3s ease, height 0.3s ease;
            box-shadow: 0 0 50px rgba(0,0,0,0.1);
            background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 25px 25px;
            scroll-behavior: smooth;
        }
        
        /* Mobile Preview Class */
        #viewport.mobile { 
            width: 375px; height: 80vh; margin: 5vh auto; 
            border: 12px solid #333; border-radius: 30px; 
            position: relative;
        }

        #canvas {
            min-height: 100%;
            position: relative;
            background-color: white;
            background-size: cover;
            background-position: center;
        }

        /* UI Elements */
        .fab { position: fixed; width: 60px; height: 60px; border-radius: 50%; color: white; border: none; font-size: 24px; z-index: 1001; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; cursor: pointer; }
        #add-btn { bottom: 20px; left: 20px; background: var(--primary); }
        #settings-btn { bottom: 20px; left: 90px; background: #4b5563; }
        
        .popup-panel { position: fixed; bottom: 95px; background: white; border-radius: 12px; padding: 15px; display: none; flex-direction: column; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.2); width: 220px; }
        .item { padding: 10px; margin-bottom: 8px; background: #f8fafc; border: 1px solid #cbd5e1; text-align: center; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .item:hover { background: #e2e8f0; }

        /* Builder Elements */
        .dropped-element { position: absolute; box-sizing: border-box; display: flex; align-items: center; justify-content: center; cursor: move; }
        .dropped-element > *:not(.resizer) { width: 100%; height: 100%; display: block; margin: 0; pointer-events: none; object-fit: cover; }
        
        .selected { outline: 2px solid var(--primary); z-index: 100 !important; }
        .resizer { width: 14px; height: 14px; background: white; border: 2px solid var(--primary); position: absolute; border-radius: 2px; display: none; z-index: 110; }
        .selected .resizer { display: block; }
        .nw { top: -7px; left: -7px; } .ne { top: -7px; right: -7px; } .sw { bottom: -7px; left: -7px; } .se { bottom: -7px; right: -7px; }

        #copy-btn { position: fixed; top: 15px; right: 15px; padding: 12px 20px; background: var(--secondary); color: white; border: none; border-radius: 8px; font-weight: bold; z-index: 1000; cursor: pointer; }
        
        #import-staging { position: absolute; visibility: hidden; pointer-events: none; top: 0; left: 0; width: 100%; }
        
        #size-control { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 15px; box-shadow: 0 0 50px rgba(0,0,0,0.3); z-index: 2000; width: 250px; text-align: center; }
    </style>
</head>
<body>

    <button id="copy-btn">Copy Full Website</button>
    
    <div id="viewport">
        <div id="canvas" style="width:100%; height:1000px;"></div>
    </div>

    <div id="import-staging"></div>

    <button id="add-btn" class="fab">+</button>
    <button id="settings-btn" class="fab">⚙️</button>

    <!-- Elements Panel -->
    <div id="panel" class="popup-panel">
        <div class="item" onclick="createNode('Heading', 50, 50)">Heading</div>
        <div class="item" onclick="createNode('Paragraph', 50, 100)">Paragraph</div>
        <div class="item" onclick="createNode('Button', 50, 150)">Button</div>
        <div class="item" onclick="createNode('Image', 50, 200)">Image</div>
        <div class="item" onclick="createNode('Box', 50, 300)">Container</div>
    </div>

    <!-- Settings Panel -->
    <div id="settings-panel" class="popup-panel">
        <div class="item" onclick="toggleViewMode()" id="mode-toggle">Switch to Mobile</div>
        <div class="item" style="background:#4f46e5; color:white;" onclick="importCode()">Import Source Code</div>
        <div class="item" onclick="triggerCanvasColor()">BG Color</div>
        <div class="item" onclick="triggerCanvasImage()">BG Image URL</div>
    </div>

    <div id="size-control">
        <strong>Font Size</strong><br>
        <input type="range" id="size-slider" min="8" max="200" oninput="updateFontSize(this.value)">
        <span id="size-val">24</span>px<br><br>
        <button onclick="document.getElementById('size-control').style.display='none'">Done</button>
    </div>

    <input type="color" id="colorPicker" style="display:none">
    <input type="color" id="canvasColorPicker" style="display:none">

    <script>
    const canvas = document.getElementById('canvas');
    const viewport = document.getElementById('viewport');
    const staging = document.getElementById('import-staging');
    
    let currentMode = 'desktop'; 
    let activeEl, isMoving, currentResizer, startX, startY, startW, startH, startL, startT;

    function toggleP(id) {
        const p = document.getElementById(id);
        const isVisible = p.style.display === 'flex';
        document.querySelectorAll('.popup-panel').forEach(panel => panel.style.display = 'none');
        if (!isVisible) p.style.display = 'flex';
    }

    document.getElementById('add-btn').onclick = (e) => { e.stopPropagation(); toggleP('panel'); };
    document.getElementById('settings-btn').onclick = (e) => { e.stopPropagation(); toggleP('settings-panel'); };

    function toggleViewMode() {
        viewport.classList.toggle('mobile');
        const btn = document.getElementById('mode-toggle');
        btn.innerText = viewport.classList.contains('mobile') ? "Switch to Desktop" : "Switch to Mobile";
        toggleP('settings-panel');
    }

    function importCode() {
        const source = prompt("Paste HTML/CSS code here:");
        if (!source) return;
        if (confirm("Clear current canvas?")) canvas.innerHTML = "";

        staging.innerHTML = source;
        const allElements = staging.querySelectorAll('*');
        
        allElements.forEach((el) => {
            if (['SCRIPT', 'STYLE', 'META', 'HEAD', 'HTML', 'BODY'].includes(el.tagName)) return;
            const rect = el.getBoundingClientRect();
            if (rect.width < 5 || rect.height < 5) return;

            let type = "Box";
            if (el.tagName.startsWith('H')) type = "Heading";
            else if (el.tagName === 'P' || el.tagName === 'SPAN') type = "Paragraph";
            else if (el.tagName === 'BUTTON' || el.tagName === 'A') type = "Button";
            else if (el.tagName === 'IMG') type = "Image";

            const newNode = createNode(type, rect.left, rect.top + viewport.scrollTop);
            newNode.style.width = rect.width + 'px';
            newNode.style.height = rect.height + 'px';

            const inner = newNode.querySelector('h2, p, button, img, div, textarea');
            const style = window.getComputedStyle(el);

            if (type === "Image") inner.src = el.src;
            else if (['Heading', 'Paragraph', 'Button'].includes(type)) inner.innerText = el.innerText;

            inner.style.backgroundColor = style.backgroundColor;
            inner.style.color = style.color;
            inner.style.fontSize = style.fontSize;
            inner.style.borderRadius = style.borderRadius;
            inner.style.backgroundImage = style.backgroundImage;
            inner.style.backgroundSize = style.backgroundSize;
        });

        staging.innerHTML = "";
        toggleP('settings-panel');
    }

    function createNode(type, x, y) {
        const el = document.createElement('div');
        el.className = 'dropped-element';
        el.style.left = x + 'px'; el.style.top = y + 'px';
        
        const html = {
            'Heading': '<h2 style="font-size:24px;color:#000;margin:0;">Heading</h2>',
            'Paragraph': '<p style="font-size:16px;color:#000;margin:0;">Text...</p>',
            'Button': '<button style="background:#4f46e5;color:white;border:none;border-radius:8px;width:100%;height:100%;">Click</button>',
            'Image': '<img src="https://via.placeholder.com/150" style="width:100%;height:100%;">',
            'Box': '<div style="border:1px solid #333;width:100%;height:100%;"></div>'
        };

        el.innerHTML = html[type] + `<div class="resizer nw"></div><div class="resizer ne"></div><div class="resizer sw"></div><div class="resizer se"></div>`;
        canvas.appendChild(el);
        setupEl(el);
        return el;
    }

    function setupEl(el) {
        el.onmousedown = (e) => {
            if (e.target.classList.contains('resizer')) return;
            activeEl = el; isMoving = true;
            document.querySelectorAll('.dropped-element').forEach(d => d.classList.remove('selected'));
            el.classList.add('selected');
            startX = e.clientX - el.offsetLeft; 
            startY = e.clientY - el.offsetTop;
        };
        el.querySelectorAll('.resizer').forEach(r => {
            r.onmousedown = (e) => {
                e.preventDefault(); e.stopPropagation();
                currentResizer = r; activeEl = el;
                startX = e.clientX; startY = e.clientY;
                startW = el.offsetWidth; startH = el.offsetHeight;
                startL = el.offsetLeft; startT = el.offsetTop;
            };
        });
        el.ondblclick = () => edit(el);
    }

    window.onmousemove = (e) => {
        if (!activeEl) return;
        if (isMoving) { 
            activeEl.style.left = (e.clientX - startX) + 'px'; 
            activeEl.style.top = (e.clientY - startY) + 'px'; 
        }
        if (currentResizer) {
            const dx = e.clientX - startX, dy = e.clientY - startY;
            if (currentResizer.classList.contains('se')) {
                activeEl.style.width = (startW + dx)+'px'; 
                activeEl.style.height = (startH + dy)+'px';
            }
        }
    };
    window.onmouseup = () => { isMoving = false; currentResizer = null; };

    function edit(el) {
        const inner = el.querySelector('h2, p, button, img, div');
        const act = prompt("1: Text/URL | 2: Font Size | 3: Color | 4: Delete");
        if (act === '1') {
            if (el.dataset.type === 'Image') inner.src = prompt("URL:", inner.src);
            else inner.innerText = prompt("Text:", inner.innerText);
        } else if (act === '2') {
            document.getElementById('size-control').style.display = 'block';
        } else if (act === '3') {
            const cp = document.getElementById('colorPicker');
            cp.click();
            cp.oninput = () => inner.style.backgroundColor = cp.value;
        } else if (act === '4') el.remove();
    }

    function updateFontSize(val) {
        if (activeEl) {
            const inner = activeEl.querySelector('h2, p, button');
            if (inner) inner.style.fontSize = val + 'px';
            document.getElementById('size-val').innerText = val;
        }
    }

    function triggerCanvasColor() { 
        const cp = document.getElementById('canvasColorPicker'); 
        cp.click(); 
        cp.oninput = () => canvas.style.backgroundColor = cp.value; 
    }
    function triggerCanvasImage() { 
        const u = prompt("URL:"); 
        if(u) canvas.style.backgroundImage = `url('${u}')`; 
    }

    document.getElementById('copy-btn').onclick = () => {
        navigator.clipboard.writeText(canvas.innerHTML).then(() => alert("Copied!"));
    };
    </script> 
</body>
</html>
