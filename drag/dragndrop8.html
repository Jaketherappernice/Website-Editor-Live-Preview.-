<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apollo Hub Builder</title>
    <style>
        :root { --primary: #ff6600; --bg: #0a0a0a; --surface: #1a1a1a; --text: #ffffff; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Segoe UI', sans-serif; overflow: hidden; background: var(--bg); color: var(--text); }
        
        #viewport { 
            width: 100vw; height: 100vh; margin: 0 auto; background: #fff; position: relative; 
            overflow-y: auto; overflow-x: hidden; transition: 0.3s;
        }
        
        #viewport.mobile { width: 375px; height: 80vh; margin: 5vh auto; border: 8px solid #333; border-radius: 20px; }

        #canvas { background-size: cover; background-position: center; position: relative; min-height: 100%; background-color: #ffffff; }

        /* UI Controls */
        .fab { position: fixed; width: 55px; height: 55px; border-radius: 50%; color: white; border: none; font-size: 20px; z-index: 1001; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(255,102,0,0.3); }
        #add-btn { bottom: 20px; left: 20px; background: var(--primary); }
        #settings-btn { bottom: 20px; left: 85px; background: #333; }
        
        .popup-panel { position: fixed; bottom: 85px; background: var(--surface); border: 1px solid var(--primary); border-radius: 10px; padding: 12px; display: none; flex-direction: column; z-index: 1000; width: 200px; }
        .item { padding: 10px; margin-bottom: 5px; background: #222; border-radius: 5px; text-align: center; cursor: pointer; color: #fff; font-size: 14px; }
        .item:hover { background: var(--primary); }

        .dropped-element { position: absolute; box-sizing: border-box; cursor: move; }
        .dropped-element > * { width: 100%; height: 100%; pointer-events: none; }
        .selected { outline: 2px solid var(--primary); z-index: 100 !important; }

        #copy-btn { position: fixed; top: 15px; right: 15px; padding: 10px 18px; background: var(--primary); color: white; border: none; border-radius: 5px; font-weight: bold; z-index: 1000; cursor: pointer; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; align-items: center; justify-content: center; }
        .modal-content { background: var(--surface); padding: 20px; border-radius: 12px; width: 90%; max-width: 350px; border: 1px solid var(--primary); }
        
        input { width: 100%; padding: 10px; margin: 10px 0; background: #222; border: 1px solid #444; color: #fff; box-sizing: border-box; border-radius: 5px; }
        .btn-main { background: var(--primary); color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .save-entry { background: #222; padding: 8px; margin-top: 5px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .del-btn { background: #ff4444; border: none; color: white; padding: 4px 8px; border-radius: 3px; cursor: pointer; }
    </style>
</head>
<body>

    <button id="copy-btn">Export Code</button>
    
    <div id="viewport">
        <div id="canvas" style="width:100%; height:1200px;"></div>
    </div>

    <button id="add-btn" class="fab">+</button>
    <button id="settings-btn" class="fab">⚙️</button>

    <div id="panel" class="popup-panel">
        <div class="item" data-type="Heading">Heading</div>
        <div class="item" data-type="Paragraph">Text</div>
        <div class="item" data-type="Button">Button</div>
        <div class="item" data-type="Image">Image</div>
        <div class="item" data-type="Box">Container</div>
    </div>

    <div id="settings-panel" class="popup-panel">
        <div class="item" id="mode-toggle">Mobile Mode</div>
        <div class="item" id="open-manager-btn" style="background:#ff6600">Save/Load Cloud</div>
    </div>

    <div id="save-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin:0 0 15px 0">Cloud Projects</h3>
            <input type="text" id="save-name" placeholder="Name your project...">
            <button id="firebase-save-btn" class="btn-main">Save to Firebase</button>
            <div id="save-list" style="margin-top: 20px; max-height: 200px; overflow-y: auto;"></div>
            <button onclick="document.getElementById('save-modal').style.display='none'" style="background:none; color:#888; border:none; margin-top:15px; width:100%; cursor:pointer;">Close</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // VITAL: This config MUST match your Firebase console exactly
        const firebaseConfig = {
            apiKey: "AIzaSyBZG26OmqR_DwV9UKCVQuRE3JzCy6SleAs",
            authDomain: "dragndrop-eeda4.firebaseapp.com",
            projectId: "dragndrop-eeda4",
            storageBucket: "dragndrop-eeda4.firebasestorage.app",
            messagingSenderId: "124148111401",
            appId: "1:124148111401:web:95011428420e219497e438"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const projectsRef = collection(db, "projects");

        let activeEl, isMoving, startX, startY;

        // Save Function
        const saveProject = async () => {
            const name = document.getElementById('save-name').value.trim();
            if (!name) return alert("Enter a name first!");

            const elements = Array.from(document.querySelectorAll('.dropped-element')).map(el => ({
                type: el.dataset.type,
                html: el.innerHTML,
                style: {
                    left: el.style.left,
                    top: el.style.top,
                    width: el.style.width,
                    height: el.style.height,
                    opacity: el.style.opacity || "1"
                }
            }));

            try {
                console.log("Attempting to save...");
                await addDoc(projectsRef, {
                    name,
                    elements,
                    canvasH: document.getElementById('canvas').style.height,
                    createdAt: serverTimestamp()
                });
                alert("Saved successfully!");
                loadList();
            } catch (err) {
                console.error("Firebase Error:", err);
                alert("FAILED: " + err.message);
            }
        };

        // Load List Function
        const loadList = async () => {
            const list = document.getElementById('save-list');
            list.innerHTML = "Fetching...";
            try {
                const snap = await getDocs(projectsRef);
                list.innerHTML = "";
                snap.forEach(pDoc => {
                    const data = pDoc.data();
                    const div = document.createElement('div');
                    div.className = 'save-entry';
                    div.innerHTML = `<span>${data.name}</span><button class="del-btn" data-id="${pDoc.id}">X</button>`;
                    div.onclick = (e) => { if(e.target.tagName !== 'BUTTON') loadProject(data); };
                    list.appendChild(div);
                });
                
                document.querySelectorAll('.del-btn').forEach(b => {
                    b.onclick = async (e) => {
                        e.stopPropagation();
                        await deleteDoc(doc(db, "projects", b.dataset.id));
                        loadList();
                    };
                });
            } catch (err) {
                list.innerHTML = "Error loading list.";
            }
        };

        const loadProject = (data) => {
            const cv = document.getElementById('canvas');
            cv.innerHTML = "";
            cv.style.height = data.canvasH;
            data.elements.forEach(elData => {
                const el = document.createElement('div');
                el.className = 'dropped-element';
                el.dataset.type = elData.type;
                Object.assign(el.style, elData.style);
                el.innerHTML = elData.html;
                cv.appendChild(el);
                makeDraggable(el);
            });
            document.getElementById('save-modal').style.display = 'none';
        };

        // UI Logic
        const makeDraggable = (el) => {
            el.onmousedown = (e) => {
                activeEl = el;
                startX = e.clientX - el.offsetLeft;
                startY = e.clientY - el.offsetTop;
                document.querySelectorAll('.dropped-element').forEach(d => d.classList.remove('selected'));
                el.classList.add('selected');
            };
        };

        document.getElementById('add-btn').onclick = () => {
            const panel = document.getElementById('panel');
            panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
        };

        document.querySelectorAll('.item[data-type]').forEach(i => {
            i.onclick = () => {
                const el = document.createElement('div');
                el.className = 'dropped-element';
                el.dataset.type = i.dataset.type;
                el.style.left = '50px'; el.style.top = '50px';
                el.style.width = '150px'; el.style.height = '50px';
                el.innerHTML = `<div style="background:#ddd; height:100%; border-radius:8px; display:flex; align-items:center; justify-content:center;">${i.dataset.type}</div>`;
                document.getElementById('canvas').appendChild(el);
                makeDraggable(el);
            };
        });

        window.onmousemove = (e) => {
            if (activeEl) {
                activeEl.style.left = (e.clientX - startX) + 'px';
                activeEl.style.top = (e.clientY - startY) + 'px';
            }
        };
        window.onmouseup = () => { activeEl = null; };

        document.getElementById('firebase-save-btn').onclick = saveProject;
        document.getElementById('open-manager-btn').onclick = () => {
            document.getElementById('save-modal').style.display = 'flex';
            loadList();
        };
    </script>
</body>
</html>
