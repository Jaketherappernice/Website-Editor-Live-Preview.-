<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Fixed viewport to prevent accidental zooming/mobile forcing -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Builder - Desktop Fixed</title>
    <style>
        :root { --primary: #4f46e5; --secondary: #10b981; --grid: #e5e7eb; }
        
        /* Reset and Base Styles */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            overflow: hidden; background: #f3f4f6; 
        }

        /* The Main Container - Now defaults to Desktop */
        #viewport { 
            width: 100%; height: 100vh; 
            margin: 0; background: white; 
            position: relative; overflow-y: auto; overflow-x: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 25px 25px;
        }

        /* Mobile Preview Mode - Only triggers when class is added */
        #viewport.mobile-preview { 
            width: 375px; height: 667px; 
            margin: 40px auto; 
            border: 16px solid #1f2937; border-radius: 36px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        #canvas { min-height: 100%; position: relative; width: 100%; }

        /* Draggable Elements */
        .dropped-element { position: absolute; cursor: move; display: flex; align-items: center; justify-content: center; }
        .dropped-element > *:not(.resizer) { width: 100%; height: 100%; pointer-events: none; }
        .selected { outline: 2px solid var(--primary); z-index: 100; }

        /* UI Controls */
        .fab { position: fixed; width: 56px; height: 56px; border-radius: 50%; color: white; border: none; font-size: 20px; z-index: 1001; cursor: pointer; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        #add-btn { bottom: 20px; left: 20px; background: var(--primary); }
        #toggle-view { bottom: 20px; left: 90px; background: #374151; }
        
        .popup-panel { position: fixed; bottom: 85px; left: 20px; background: white; border-radius: 8px; padding: 10px; display: none; flex-direction: column; z-index: 1000; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); width: 200px; }
        .item { padding: 10px; margin: 2px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 4px; cursor: pointer; font-size: 14px; text-align: center; }
        .item:hover { background: #eff6ff; }

        /* Resizers */
        .resizer { width: 10px; height: 10px; background: white; border: 2px solid var(--primary); position: absolute; z-index: 110; display: none; }
        .selected .resizer { display: block; }
        .se { bottom: -5px; right: -5px; cursor: nwse-resize; }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="canvas"></div>
    </div>

    <button id="add-btn" class="fab" onclick="togglePanel('panel')">+</button>
    <button id="toggle-view" class="fab" onclick="toggleMobile()">📱</button>

    <div id="panel" class="popup-panel">
        <div class="item" onclick="addObject('Heading')">Add Heading</div>
        <div class="item" onclick="addObject('Box')">Add Container</div>
        <div class="item" onclick="importPrompt()">Import Source</div>
    </div>

    <script>
        const viewport = document.getElementById('viewport');
        const canvas = document.getElementById('canvas');
        let isMobile = false;

        // Toggle function to switch between Desktop and Mobile manually
        function toggleMobile() {
            isMobile = !isMobile;
            if (isMobile) {
                viewport.classList.add('mobile-preview');
                document.getElementById('toggle-view').innerText = '💻';
            } else {
                viewport.classList.remove('mobile-preview');
                document.getElementById('toggle-view').innerText = '📱';
            }
        }

        function togglePanel(id) {
            const p = document.getElementById(id);
            p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
        }

        function addObject(type) {
            const el = document.createElement('div');
            el.className = 'dropped-element';
            el.style.left = '50px';
            el.style.top = '50px';
            el.style.width = '200px';
            el.style.height = '50px';
            
            if(type === 'Heading') el.innerHTML = `<h1 style="margin:0;">New Heading</h1>`;
            else el.innerHTML = `<div style="background:#ddd; width:100%; height:100%;"></div>`;
            
            el.innerHTML += `<div class="resizer se"></div>`;
            
            canvas.appendChild(el);
            makeDraggable(el);
            togglePanel('panel');
        }

        function makeDraggable(el) {
            let x = 0, y = 0;
            el.onmousedown = (e) => {
                e.preventDefault();
                document.querySelectorAll('.dropped-element').forEach(item => item.classList.remove('selected'));
                el.classList.add('selected');
                x = e.clientX; y = e.clientY;
                document.onmousemove = (e) => {
                    const dx = x - e.clientX; const dy = y - e.clientY;
                    x = e.clientX; y = e.clientY;
                    el.style.top = (el.offsetTop - dy) + "px";
                    el.style.left = (el.offsetLeft - dx) + "px";
                };
                document.onmouseup = () => { document.onmousemove = null; };
            };
        }

        function importPrompt() {
            const code = prompt("Paste your HTML here:");
            if(code) {
                // Simple import logic for demonstration
                const temp = document.createElement('div');
                temp.innerHTML = code;
                canvas.appendChild(temp);
                togglePanel('panel');
            }
        }
    </script>
</body>
</html>
