<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pro Responsive Builder</title>
<style>
  :root { --primary:#4f46e5; --secondary:#10b981; --grid:#e5e7eb; }
  body,html { margin:0; padding:0; width:100%; height:100%; font-family:sans-serif; overflow:hidden; background:#f3f4f6; touch-action:none; user-select:none; }
  #viewport { width:100vw; height:100vh; margin:0 auto; background:white; position:relative; overflow-y:auto; overflow-x:hidden; transition:width .3s, height .3s; box-shadow:0 0 50px rgba(0,0,0,.1); background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px); background-size:25px 25px; }
  #viewport.mobile { width:375px; height:80vh; margin:5vh auto; border:12px solid #333; border-radius:30px; }
  #canvas { background-size:cover; background-position:center; background-repeat:no-repeat; }

  .fab { position:fixed; width:60px; height:60px; border-radius:50%; color:white; border:none; font-size:24px; z-index:1001; box-shadow:0 4px 15px rgba(0,0,0,.3); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  #add-btn { bottom:20px; left:20px; background:var(--primary); }
  #settings-btn { bottom:20px; left:90px; background:#4b5563; }
  .popup-panel { position:fixed; bottom:95px; left:20px; background:white; border-radius:12px; padding:15px; display:none; flex-direction:column; z-index:1000; box-shadow:0 10px 30px rgba(0,0,0,.2); width:260px; max-height:70vh; overflow-y:auto; }
  .item { padding:12px; margin-bottom:8px; background:#f8fafc; border:1px solid #cbd5e1; text-align:center; border-radius:6px; font-weight:bold; cursor:pointer; }
  .item:hover { background:#e0f2fe; }
  .toggle-active { background:var(--primary)!important; color:white; }

  .dropped-element { position:absolute; box-sizing:border-box; display:flex; align-items:center; justify-content:center; cursor:move; }
  .dropped-element > *:not(.resizer) { width:100%; height:100%; display:block; margin:0; pointer-events:none; object-fit:cover; }
  .selected { outline:2px solid var(--primary); z-index:100!important; }
  .resizer { width:14px; height:14px; background:white; border:2px solid var(--primary); position:absolute; border-radius:2px; display:none; z-index:110; }
  .selected .resizer { display:block; }
  .nw{top:-7px;left:-7px;} .ne{top:-7px;right:-7px;} .sw{bottom:-7px;left:-7px;} .se{bottom:-7px;right:-7px;}

  #copy-btn { position:fixed; top:15px; right:15px; padding:12px 20px; background:var(--secondary); color:white; border:none; border-radius:8px; font-weight:bold; z-index:1000; cursor:pointer; }
  .save-item { display:flex; justify-content:space-between; align-items:center; padding:10px; background:#f1f5f9; border-radius:6px; margin-bottom:6px; gap:6px; }
  .save-item strong { font-size:13px; }
  .save-actions button { font-size:12px; padding:6px 10px; margin-left:4px; border:none; border-radius:4px; cursor:pointer; background:var(--primary); color:white; }
  .save-actions button.del { background:#ef4444; }
  #height-control { position:fixed; bottom:95px; left:20px; background:white; padding:15px; border-radius:12px; display:none; z-index:1000; box-shadow:0 10px 30px rgba(0,0,0,.2); }
  #height-control input { width:120px; }
</style>
</head>
<body>

<button id="copy-btn">Copy Full Website</button>

<div id="viewport">
  <div id="canvas" style="width:100%; height:1000px; position:relative; min-height:100%; background-color:white;"></div>
</div>

<button id="add-btn" class="fab">+</button>
<button id="settings-btn" class="fab">⚙️</button>

<div id="panel" class="popup-panel">
  <div class="item" data-type="Heading">Heading</div>
  <div class="item" data-type="Paragraph">Paragraph</div>
  <div class="item" data-type="Button">Button</div>
  <div class="item" data-type="Image">Image</div>
  <div class="item" data-type="Textarea">Textarea</div>
  <div class="item" data-type="Box">Container</div>
</div>

<div id="settings-panel" class="popup-panel">
  <div class="item" id="mode-toggle" onclick="toggleViewMode()">Switch to Mobile</div>
  <div class="item" onclick="triggerCanvasColor()">BG Color</div>
  <div class="item" onclick="triggerCanvasImage()">BG Image URL</div>
  <div class="item" onclick="showHeight()">Page Height</div>
  <div class="item" onclick="saveProject()" style="background:#dcfce7;">💾 Save Project</div>
  <div class="item" onclick="showLoadPanel()" style="background:#dbeafe;">📂 Load Project</div>
</div>

<div id="load-panel" class="popup-panel" style="width:320px;">
  <h3 style="margin:5px 0 10px 0; text-align:center;">Saved Projects</h3>
  <div id="save-list"></div>
  <div class="item" onclick="document.getElementById('load-panel').style.display='none'" style="background:#ef4444;color:white;">Close</div>
</div>

<div id="height-control">
  <label>Height (px): <input type="number" id="height-num" value="1000" min="500" max="10000" step="50"></label>
  <button onclick="document.getElementById('height-control').style.display='none'">OK</button>
</div>

<input type="color" id="canvasColorPicker" style="display:none">

<script>
const canvas = document.getElementById('canvas');
const viewport = document.getElementById('viewport');
let currentMode = 'desktop';
let activeEl, isMoving, currentResizer, startX, startY, startW, startH, startL, startT;

function toggleP(id) {
  document.querySelectorAll('.popup-panel').forEach(p => p.style.display = 'none');
  const panel = document.getElementById(id);
  panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
}

document.getElementById('add-btn').onclick = () => toggleP('panel');
document.getElementById('settings-btn').onclick = () => toggleP('settings-panel');

function showHeight(){
  const h = document.getElementById('height-control');
  document.getElementById('height-num').value = parseInt(canvas.style.height) || 1000;
  h.style.display = 'block';
}
document.getElementById('height-num').oninput = (e) => { canvas.style.height = e.target.value + 'px'; };

function triggerCanvasColor() {
  const cp = document.getElementById('canvasColorPicker');
  cp.click();
  cp.oninput = () => canvas.style.backgroundColor = cp.value;
}
function triggerCanvasImage() {
  const u = prompt("Background Image URL (leave empty to clear):");
  if (u === null) return;
  canvas.style.backgroundImage = u ? `url('${u}')` : '';
}

// ---------- ELEMENTS ----------
function getInner(el){
  // first child that is NOT a resizer
  for (const c of el.children) if (!c.classList.contains('resizer')) return c;
  return null;
}

document.querySelectorAll('.item[data-type]').forEach(i => {
  i.onclick = () => {
    const y = viewport.scrollTop + 50;
    createNode(i.dataset.type, 50, y);
    toggleP('panel');
  };
});

const HTML_TEMPLATES = {
  'Heading'  : '<h2 style="font-size:24px;color:#000;margin:0;">Heading</h2>',
  'Paragraph': '<p style="font-size:16px;color:#000;margin:0;">Text...</p>',
  'Button'   : '<button style="background:#4f46e5;color:white;border:none;border-radius:12px;width:100%;height:100%;cursor:pointer;font-size:16px;">Click</button>',
  'Image'    : '<img src="https://via.placeholder.com/150" style="border-radius:12px;width:100%;height:100%;">',
  'Textarea' : '<textarea placeholder="Enter text..." style="border:1px solid #ccc;border-radius:12px;padding:10px;width:100%;height:100%;resize:none;font-size:14px;"></textarea>',
  'Box'      : '<div style="border:2px solid #333;background:rgba(0,0,0,0.05);width:100%;height:100%;border-radius:12px;"></div>'
};

function createNode(type, x, y) {
  const el = document.createElement('div');
  el.className = 'dropped-element';
  el.dataset.type = type;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  if (['Box','Image','Textarea'].includes(type)) { el.style.width='200px'; el.style.height='150px'; }
  else { el.style.width='180px'; el.style.height='50px'; }
  el.innerHTML = HTML_TEMPLATES[type] +
    '<div class="resizer nw"></div><div class="resizer ne"></div><div class="resizer sw"></div><div class="resizer se"></div>';
  canvas.appendChild(el);
  setupEl(el);
  saveCurrentState(el);
  // Initialize the OTHER mode too so export always has both
  const other = currentMode === 'desktop' ? 'mobile' : 'desktop';
  if (!el.dataset[other]) el.dataset[other] = el.dataset[currentMode];
}

function setupEl(el) {
  el.onmousedown = el.ontouchstart = (e) => {
    if (e.target.classList.contains('resizer')) return;
    activeEl = el; isMoving = true;
    document.querySelectorAll('.dropped-element').forEach(d => d.classList.remove('selected'));
    el.classList.add('selected');
    const t = e.touches ? e.touches[0] : e;
    startX = t.clientX - el.offsetLeft;
    startY = t.clientY - el.offsetTop;
  };
  el.querySelectorAll('.resizer').forEach(r => {
    r.onmousedown = r.ontouchstart = (e) => {
      e.preventDefault(); e.stopPropagation();
      currentResizer = r; activeEl = el;
      const t = e.touches ? e.touches[0] : e;
      startX = t.clientX; startY = t.clientY;
      startW = el.offsetWidth; startH = el.offsetHeight;
      startL = el.offsetLeft; startT = el.offsetTop;
    };
  });
  let clicks = 0;
  el.onclick = (e) => {
    e.stopPropagation();
    clicks++;
    if (clicks === 2) setTimeout(() => { if (clicks === 2) edit(el); }, 250);
    else if (clicks === 3) { if (confirm("Delete?")) el.remove(); clicks = 0; }
    setTimeout(() => clicks = 0, 500);
  };
}

window.onmousemove = window.ontouchmove = (e) => {
  if (!activeEl) return;
  const t = e.touches ? e.touches[0] : e;
  if (isMoving) {
    activeEl.style.left = (t.clientX - startX) + 'px';
    activeEl.style.top  = (t.clientY - startY) + 'px';
  }
  if (currentResizer) {
    const dx = t.clientX - startX, dy = t.clientY - startY, c = currentResizer.classList;
    if (c.contains('se')) { activeEl.style.width=(startW+dx)+'px'; activeEl.style.height=(startH+dy)+'px'; }
    if (c.contains('ne')) { activeEl.style.width=(startW+dx)+'px'; activeEl.style.height=(startH-dy)+'px'; activeEl.style.top=(startT+dy)+'px'; }
    if (c.contains('sw')) { activeEl.style.width=(startW-dx)+'px'; activeEl.style.left=(startL+dx)+'px'; activeEl.style.height=(startH+dy)+'px'; }
    if (c.contains('nw')) { activeEl.style.width=(startW-dx)+'px'; activeEl.style.left=(startL+dx)+'px'; activeEl.style.height=(startH-dy)+'px'; activeEl.style.top=(startT+dy)+'px'; }
  }
  if (isMoving || currentResizer) saveCurrentState(activeEl);
};
window.onmouseup = window.ontouchend = () => { isMoving = false; currentResizer = null; };

function saveCurrentState(el) {
  const inner = getInner(el);
  const state = {
    w: el.style.width, h: el.style.height,
    l: el.style.left, t: el.style.top,
    fs: (inner && inner.style.fontSize) || "",
    op: el.style.opacity || "1"
  };
  el.dataset[currentMode] = JSON.stringify(state);
  if (!el.dataset[currentMode === 'desktop' ? 'mobile' : 'desktop']) {
    el.dataset[currentMode === 'desktop' ? 'mobile' : 'desktop'] = JSON.stringify(state);
  }
}

function toggleViewMode() {
  currentMode = currentMode === 'desktop' ? 'mobile' : 'desktop';
  viewport.className = currentMode === 'mobile' ? 'mobile' : '';
  const m = document.getElementById('mode-toggle');
  m.innerText = currentMode === 'mobile' ? 'Switch to Desktop' : 'Switch to Mobile';
  m.classList.toggle('toggle-active', currentMode === 'mobile');
  document.querySelectorAll('.dropped-element').forEach(el => {
    const data = JSON.parse(el.dataset[currentMode] || '{}');
    if (data.w) {
      el.style.width=data.w; el.style.height=data.h; el.style.left=data.l; el.style.top=data.t;
      const inner = getInner(el);
      if (data.fs && inner) inner.style.fontSize = data.fs;
      if (data.op) el.style.opacity = data.op;
    }
  });
}

function edit(el) {
  const inner = getInner(el);
  const action = prompt("1: Content   2: Size (font px)   3: Color   4: Opacity   5: Link (Button)");
  if (!action) return;
  if (action === '1') {
    if (inner.tagName === 'IMG') {
      const u = prompt("Image URL:", inner.src); if (u) inner.src = u;
    } else {
      const v = prompt("New text:", inner.innerText); if (v !== null) inner.innerText = v;
    }
  } else if (action === '2') {
    const v = prompt("Font size (px):", parseInt(inner.style.fontSize) || 16);
    if (v) inner.style.fontSize = v + 'px';
  } else if (action === '3') {
    const v = prompt("Color (e.g. #ff0000):", inner.style.color || '#000');
    if (v) {
      if (inner.tagName === 'BUTTON' || el.dataset.type === 'Box') inner.style.background = v;
      else inner.style.color = v;
    }
  } else if (action === '4') {
    const v = prompt("Opacity 0-1:", el.style.opacity || '1');
    if (v) el.style.opacity = v;
  } else if (action === '5') {
    const v = prompt("Link URL:", el.dataset.link || '');
    if (v !== null) el.dataset.link = v;
  }
  saveCurrentState(el);
}

// ==================== SAVE / LOAD ====================
function serializeCanvas() {
  const elements = [];
  document.querySelectorAll('.dropped-element').forEach(el => {
    // make sure current mode state is up to date
    saveCurrentState(el);
    const inner = getInner(el);
    elements.push({
      type: el.dataset.type,
      left: el.style.left, top: el.style.top,
      width: el.style.width, height: el.style.height,
      desktop: el.dataset.desktop || '',
      mobile : el.dataset.mobile  || '',
      content: inner ? inner.outerHTML : '',
      link: el.dataset.link || null,
      opacity: el.style.opacity || '1'
    });
  });
  return {
    version: 2,
    height: canvas.style.height || '1000px',
    bgColor: canvas.style.backgroundColor || 'white',
    bgImage: canvas.style.backgroundImage || '',
    elements
  };
}

function saveProject() {
  const name = prompt("Project name:", "Project " + new Date().toLocaleString());
  if (!name) return;
  const data = serializeCanvas();
  let saves = JSON.parse(localStorage.getItem('websiteSaves') || '[]');
  const i = saves.findIndex(s => s.name === name);
  if (i >= 0) saves[i] = { name, data, timestamp: Date.now() };
  else saves.push({ name, data, timestamp: Date.now() });
  localStorage.setItem('websiteSaves', JSON.stringify(saves));
  document.getElementById('settings-panel').style.display='none';
  alert(`Saved "${name}".`);
}

function loadProject(projectData) {
  canvas.innerHTML = '';
  canvas.style.height = projectData.height || '1000px';
  canvas.style.backgroundColor = projectData.bgColor || 'white';
  canvas.style.backgroundImage = projectData.bgImage || '';

  (projectData.elements || []).forEach(item => {
    const el = document.createElement('div');
    el.className = 'dropped-element';
    el.dataset.type = item.type;
    el.style.left = item.left; el.style.top = item.top;
    el.style.width = item.width; el.style.height = item.height;
    el.style.opacity = item.opacity || '1';
    if (item.link) el.dataset.link = item.link;
    if (item.desktop) el.dataset.desktop = item.desktop;
    if (item.mobile)  el.dataset.mobile  = item.mobile;

    el.innerHTML = (item.content || HTML_TEMPLATES[item.type] || '') +
      '<div class="resizer nw"></div><div class="resizer ne"></div><div class="resizer sw"></div><div class="resizer se"></div>';
    canvas.appendChild(el);
    setupEl(el);

    // Backfill missing mode data so export always works
    if (!el.dataset.desktop || !el.dataset.mobile) {
      const fallback = JSON.stringify({
        w: el.style.width, h: el.style.height,
        l: el.style.left, t: el.style.top,
        fs: (getInner(el) && getInner(el).style.fontSize) || "",
        op: el.style.opacity || "1"
      });
      if (!el.dataset.desktop) el.dataset.desktop = fallback;
      if (!el.dataset.mobile)  el.dataset.mobile  = fallback;
    }
  });

  document.getElementById('load-panel').style.display='none';
}

function showLoadPanel() {
  const list = document.getElementById('save-list');
  list.innerHTML = '';
  const saves = JSON.parse(localStorage.getItem('websiteSaves') || '[]');
  if (!saves.length) {
    list.innerHTML = '<p style="text-align:center;color:#666;padding:20px;">No saved projects yet.</p>';
  } else {
    saves.forEach((s, i) => {
      const div = document.createElement('div');
      div.className = 'save-item';
      div.innerHTML = `
        <div><strong>${s.name}</strong><br><small>${new Date(s.timestamp).toLocaleString()}</small></div>
        <div class="save-actions">
          <button onclick="loadProjectFromIndex(${i})">Load</button>
          <button class="del" onclick="deleteSave(${i})">Del</button>
        </div>`;
      list.appendChild(div);
    });
  }
  toggleP('load-panel');
}
window.loadProjectFromIndex = (i) => {
  const saves = JSON.parse(localStorage.getItem('websiteSaves') || '[]');
  if (saves[i]) loadProject(saves[i].data);
};
window.deleteSave = (i) => {
  if (!confirm("Delete this save?")) return;
  const saves = JSON.parse(localStorage.getItem('websiteSaves') || '[]');
  saves.splice(i, 1);
  localStorage.setItem('websiteSaves', JSON.stringify(saves));
  showLoadPanel(); showLoadPanel(); // reopen
};

// ==================== EXPORT ====================
document.getElementById('copy-btn').onclick = () => {
  // Make sure every element has both desktop+mobile data
  document.querySelectorAll('.dropped-element').forEach(el => {
    saveCurrentState(el);
    if (!el.dataset.desktop) el.dataset.desktop = el.dataset.mobile;
    if (!el.dataset.mobile)  el.dataset.mobile  = el.dataset.desktop;
  });

  const referenceW = canvas.offsetWidth || 1440;
  const mobileW = 375;
  let elementsHTML = "";
  let dStyles = "", mStyles = "";

  document.querySelectorAll('.dropped-element').forEach((el, index) => {
    const id = `el-${index}`;
    const type = el.dataset.type;
    const z = ['Heading','Paragraph','Textarea'].includes(type) ? 40 : type==='Button'?30:type==='Image'?20:10;
    const innerSrc = getInner(el);
    if (!innerSrc) return;
    const inner = innerSrc.cloneNode(true);
    if (type === 'Button' && el.dataset.link) {
      inner.setAttribute('onclick', `window.location.href='${el.dataset.link}'`);
    }
    elementsHTML += `<div id="${id}" class="dropped-element">${inner.outerHTML}</div>`;

    const d = JSON.parse(el.dataset.desktop || '{}');
    const m = JSON.parse(el.dataset.mobile  || el.dataset.desktop || '{}');

    const dL = ((parseFloat(d.l) / referenceW) * 100).toFixed(4) + '%';
    const dW = ((parseFloat(d.w) / referenceW) * 100).toFixed(4) + '%';
    dStyles += `#${id}{left:${dL};top:${d.t};width:${dW};height:${d.h};z-index:${z}!important;opacity:${d.op||1};}\n`;
    if (d.fs) dStyles += `#${id} > *{font-size:${d.fs}!important;}\n`;

    const mL = ((parseFloat(m.l || d.l) / mobileW) * 100).toFixed(4) + '%';
    const mW = ((parseFloat(m.w || d.w) / mobileW) * 100).toFixed(4) + '%';
    mStyles += `#${id}{left:${mL};top:${m.t||d.t};width:${mW};height:${m.h||d.h};z-index:${z}!important;opacity:${m.op||d.op||1};}\n`;
    if (m.fs) mStyles += `#${id} > *{font-size:${m.fs}!important;}\n`;
  });

  const finalHTML =
`<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My Site</title>
<style>
body,html{margin:0;padding:0;width:100%;min-height:100%;overflow-x:hidden;background:#fff;font-family:sans-serif;}
#site-canvas{position:relative;width:100%;max-width:${referenceW}px;height:${canvas.style.height||'1000px'};background-color:${canvas.style.backgroundColor||'white'};background-image:${canvas.style.backgroundImage||'none'};background-size:cover;background-position:center;margin:0 auto;overflow:hidden;}
.dropped-element{position:absolute;display:flex;align-items:center;justify-content:center;box-sizing:border-box;}
.dropped-element > *{width:100%;height:100%;object-fit:cover;border-radius:12px;border:none;margin:0;box-sizing:border-box;}
@media (min-width:601px){${dStyles}}
@media (max-width:600px){#site-canvas{width:100vw;max-width:100vw;}${mStyles}}
</style></head><body><div id="site-canvas">${elementsHTML}</div></body></html>`;

  navigator.clipboard.writeText(finalHTML)
    .then(() => alert("✅ Full website copied to clipboard!"))
    .catch(() => {
      // fallback
      const ta = document.createElement('textarea');
      ta.value = finalHTML; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
      alert("✅ Copied (fallback).");
    });
};

console.log("✅ Builder ready with Save/Load + working Export.");
</script>
</body>
</html>
