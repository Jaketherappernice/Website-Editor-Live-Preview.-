<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apollo Builder - Stable Desktop Version</title>
    <style>
        :root { --neon-orange: #ff6600; --dark-bg: #1a1a1a; --grid-color: #333; }
        
        /* Forces Desktop Layout */
        body, html { 
            margin: 0; padding: 0; width: 100vw; height: 100vh; 
            background: var(--dark-bg); color: white; font-family: sans-serif;
            overflow: hidden; 
        }

        /* The Main Builder Canvas */
        #viewport { 
            width: 100%; height: 100%; 
            overflow-y: auto; overflow-x: auto;
            background-color: #0f0f0f;
            background-image: linear-gradient(var(--grid-color) 1px, transparent 1px), 
                              linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 30px 30px;
            position: relative;
        }

        #canvas { 
            min-height: 2000px; /* Long page support */
            width: 100%; 
            position: relative; 
        }

        /* Draggable Components */
        .dropped-element { 
            position: absolute; 
            min-width: 50px; min-height: 20px;
            cursor: move; 
            transition: outline 0.1s;
        }
        .dropped-element:hover { outline: 1px dashed var(--neon-orange); }
        .selected { outline: 2px solid var(--neon-orange) !important; z-index: 1000; }

        /* UI Overlay */
        .ui-layer { position: fixed; z-index: 9999; pointer-events: none; width: 100%; height: 100%; top: 0; left: 0; }
        .ui-layer * { pointer-events: auto; }

        .fab { 
            position: absolute; width: 60px; height: 60px; border-radius: 50%; 
            background: var(--neon-orange); color: white; border: none; 
            font-size: 24px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #add-btn { bottom: 30px; left: 30px; }
        
        .menu-panel { 
            position: absolute; bottom: 100px; left: 30px; 
            background: #222; border: 1px solid var(--neon-orange);
            border-radius: 8px; padding: 10px; display: none; flex-direction: column; 
            width: 200px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .btn-item { 
            padding: 12px; margin: 5px 0; background: #333; color: white; 
            border: none; border-radius: 4px; text-align: left; cursor: pointer;
        }
        .btn-item:hover { background: var(--neon-orange); }

        /* Hidden Parser */
        #import-temp { visibility: hidden; position: absolute; top: -9999px; width: 100%; }
        
        .resizer { 
            width: 10px; height: 10px; background: white; 
            position: absolute; right: -5px; bottom: -5px; 
            cursor: se-resize; display: none; 
        }
        .selected .resizer { display: block; }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="canvas"></div>
    </div>

    <div class="ui-layer">
        <button id="add-btn" class="fab" onclick="toggleMenu()">+</button>
        
        <div id="main-menu" class="menu-panel">
            <button class="btn-item" onclick="createObject('Heading')">Text Heading</button>
            <button class="btn-item" onclick="createObject('Box')">Container Box</button>
            <button class="btn-item" onclick="importSource()">Import Site Code</button>
            <button class="btn-item" style="color: #ff4444;" onclick="clearCanvas()">Clear All</button>
        </div>
    </div>

    <!-- Hidden div for processing imported code positions -->
    <div id="import-temp"></div>

    <script>
        const canvas = document.getElementById('canvas');
        const temp = document.getElementById('import-temp');
        let selectedEl = null;

        function toggleMenu() {
            const m = document.getElementById('main-menu');
            m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
        }

        function createObject(type, x = 100, y = 100, content = "") {
            const wrapper = document.createElement('div');
            wrapper.className = 'dropped-element';
            wrapper.style.left = x + 'px';
            wrapper.style.top = y + 'px';

            if (type === 'Heading') {
                wrapper.innerHTML = `<h1 style="margin:0; color:white;">${content || "New Heading"}</h1>`;
            } else if (type === 'Box') {
                wrapper.innerHTML = `<div style="width:200px; height:100px; background:#444; border:1px solid #666;"></div>`;
            }

            wrapper.innerHTML += `<div class="resizer"></div>`;
            canvas.appendChild(wrapper);
            initDrag(wrapper);
            return wrapper;
        }

        function importSource() {
            const code = prompt("Paste your HTML/CSS code here:");
            if (!code) return;

            // Load code into hidden area to measure it
            temp.innerHTML = code;
            
            // Wait for browser to calculate styles
            setTimeout(() => {
                const elements = temp.querySelectorAll('*');
                elements.forEach(el => {
                    // Skip technical tags
                    if(['SCRIPT', 'STYLE', 'META', 'TITLE'].includes(el.tagName)) return;

                    const rect = el.getBoundingClientRect();
                    if(rect.width > 2 && rect.height > 2) {
                        const style = window.getComputedStyle(el);
                        const imported = createObject('Heading', rect.left, rect.top + window.scrollY, el.innerText);
                        
                        // Mirror the styles
                        const target = imported.querySelector('h1, div');
                        target.style.width = rect.width + 'px';
                        target.style.height = rect.height + 'px';
                        target.style.backgroundColor = style.backgroundColor;
                        target.style.color = style.color;
                        target.style.fontSize = style.fontSize;
                    }
                });
                temp.innerHTML = "";
                toggleMenu();
            }, 100);
        }

        function initDrag(el) {
            el.onmousedown = (e) => {
                if (e.target.classList.contains('resizer')) return;
                
                if (selectedEl) selectedEl.classList.remove('selected');
                selectedEl = el;
                el.classList.add('selected');

                let shiftX = e.clientX - el.getBoundingClientRect().left;
                let shiftY = e.clientY - el.getBoundingClientRect().top;

                function moveAt(pageX, pageY) {
                    el.style.left = pageX - shiftX + 'px';
                    el.style.top = pageY - shiftY + 'px';
                }

                function onMouseMove(e) { moveAt(e.pageX, e.pageY); }

                document.addEventListener('mousemove', onMouseMove);
                document.onmouseup = () => {
                    document.removeEventListener('mousemove', onMouseMove);
                    document.onmouseup = null;
                };
            };

            // Resizing logic
            const resizer = el.querySelector('.resizer');
            resizer.onmousedown = (e) => {
                e.stopPropagation();
                function resize(ev) {
                    el.style.width = ev.pageX - el.getBoundingClientRect().left + 'px';
                    el.style.height = ev.pageY - el.getBoundingClientRect().top + 'px';
                }
                document.addEventListener('mousemove', resize);
                document.onmouseup = () => {
                    document.removeEventListener('mousemove', resize);
                    document.onmouseup = null;
                };
            };
        }

        function clearCanvas() { if(confirm("Delete everything?")) canvas.innerHTML = ""; }
    </script>
</body>
</html>
