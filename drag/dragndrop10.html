<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Builder - Triple Click Restored</title>
    <style>
        :root { --primary: #4f46e5; --secondary: #10b981; --danger: #ef4444; --grid: #e5e7eb; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: sans-serif; overflow: hidden; background: #f3f4f6; touch-action: none; user-select: none; }
        
        #viewport { 
            width: 100vw; height: 100vh; margin: 0 auto; background: white; position: relative; 
            overflow-y: auto; overflow-x: hidden; transition: width 0.3s ease, height 0.3s ease;
            box-shadow: 0 0 50px rgba(0,0,0,0.1);
            background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 25px 25px;
        }
        
        #viewport.mobile { width: 375px; height: 80vh; margin: 5vh auto; border: 12px solid #333; border-radius: 30px; position: relative; }
        #canvas { background-size: cover; background-position: center; background-repeat: no-repeat; min-height: 100%; position: relative; }

        .fab { position: fixed; width: 60px; height: 60px; border-radius: 50%; color: white; border: none; font-size: 24px; z-index: 1001; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; cursor: pointer; }
        #add-btn { bottom: 20px; left: 20px; background: var(--primary); }
        #settings-btn { bottom: 20px; left: 90px; background: #4b5563; }

        .header-tools { position: fixed; top: 15px; right: 15px; display: flex; gap: 10px; z-index: 1000; }
        .header-btn { padding: 12px 20px; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #copy-btn { background: var(--secondary); }
        #clear-btn { background: var(--danger); }

        .popup-panel { position: fixed; bottom: 95px; background: white; border-radius: 12px; padding: 15px; display: none; flex-direction: column; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.2); width: 220px; }
        .item { padding: 10px; margin-bottom: 8px; background: #f8fafc; border: 1px solid #cbd5e1; text-align: center; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        #project-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 25px; border-radius: 20px; z-index: 3000; width: 320px; max-height: 80vh; overflow-y: auto; box-shadow: 0 0 100px rgba(0,0,0,0.5); }
        
        .dropped-element { position: absolute; box-sizing: border-box; display: flex; align-items: center; justify-content: center; cursor: move; }
        .dropped-element > *:not(.resizer) { width: 100%; height: 100%; display: block; margin: 0; pointer-events: none; object-fit: cover; }
        
        .selected { outline: 2px solid var(--primary); z-index: 100 !important; }
        .resizer { width: 14px; height: 14px; background: white; border: 2px solid var(--primary); position: absolute; border-radius: 2px; display: none; z-index: 110; }
        .selected .resizer { display: block; }
        .nw { top: -7px; left: -7px; } .ne { top: -7px; right: -7px; } .sw { bottom: -7px; left: -7px; } .se { bottom: -7px; right: -7px; }

        #size-control, #height-control, #opacity-control { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 15px; z-index: 2000; width: 250px; text-align: center; box-shadow: 0 0 50px rgba(0,0,0,0.3); }
        .mgr-btn { border: none; padding: 6px 10px; border-radius: 4px; color: white; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header-tools">
        <button id="clear-btn" class="header-btn" onclick="if(confirm('Clear everything?')) canvas.innerHTML=''">Clear Canvas</button>
        <button id="copy-btn" class="header-btn" onclick="alert('Export Logic: ' + canvas.innerHTML)">Export HTML</button>
    </div>
    
    <div id="viewport">
        <div id="canvas" style="width:100%; height:1000px; background-color: white;"></div>
    </div>

    <button id="add-btn" class="fab">+</button>
    <button id="settings-btn" class="fab">⚙️</button>

    <div id="panel" class="popup-panel">
        <div class="item" data-type="Heading">Heading</div>
        <div class="item" data-type="Paragraph">Paragraph</div>
        <div class="item" data-type="Button">Button</div>
        <div class="item" data-type="Image">Image</div>
        <div class="item" data-type="Box">Container</div>
    </div>

    <div id="settings-panel" class="popup-panel">
        <div class="item" id="mode-toggle" onclick="toggleViewMode()">Switch to Mobile</div>
        <div class="item" onclick="triggerCanvasColor()">BG Color</div>
        <div class="item" onclick="document.getElementById('height-control').style.display='block'">Page Height</div>
        <div class="item" onclick="openProjectManager()" style="background:#e0f2fe; border-color:#0ea5e9; color:#0369a1;">📁 Projects</div>
    </div>

    <div id="project-modal">
        <h2>Projects</h2>
        <div style="display:flex; gap:5px; margin-bottom:15px;">
            <input type="text" id="new-save-name" placeholder="Name..." style="flex:1; padding:8px;">
            <button onclick="saveCurrentProject()" class="mgr-btn" style="background:var(--primary)">Save</button>
        </div>
        <div id="save-list"></div>
        <button onclick="closeProjectManager()" class="mgr-btn" style="background:#64748b; width:100%; margin-top:10px;">Close</button>
    </div>

    <div id="size-control">
        <strong>Font Size</strong><br>
        <input type="range" id="size-slider" min="8" max="200"><br>
        <button onclick="this.parentElement.style.display='none'" style="margin-top:10px;">Done</button>
    </div>

    <div id="opacity-control">
        <strong>Opacity</strong><br>
        <input type="range" id="opacity-slider" min="0" max="100" value="100"><br>
        <button onclick="this.parentElement.style.display='none'" style="margin-top:10px;">Done</button>
    </div>

    <div id="height-control">
        <strong>Page Height</strong><br>
        <input type="number" id="height-num" value="1000" style="width:80px;"> px<br>
        <button onclick="updateHeight()" style="margin-top:10px;">Apply</button>
    </div>

    <input type="color" id="colorPicker" style="display:none">
    <input type="color" id="canvasColorPicker" style="display:none">

    <script>
    const canvas = document.getElementById('canvas');
    const viewport = document.getElementById('viewport');
    let currentMode = 'desktop', activeEl, isMoving, currentResizer, startX, startY, startW, startH, startL, startT;

    function setupEl(el) {
        let clickCount = 0;
        let clickTimer = null;

        // Selection and Drag Start
        el.onmousedown = (e) => {
            if (e.target.classList.contains('resizer')) return;
            activeEl = el; 
            isMoving = true;
            document.querySelectorAll('.dropped-element').forEach(d => d.classList.remove('selected'));
            el.classList.add('selected');
            startX = e.clientX - el.offsetLeft; 
            startY = e.clientY - el.offsetTop;
        };

        // Triple Click Logic
        el.addEventListener('click', (e) => {
            e.stopPropagation();
            clickCount++;
            
            clearTimeout(clickTimer);

            if (clickCount === 3) {
                if (confirm("Delete this element?")) {
                    el.remove();
                }
                clickCount = 0;
            } else {
                clickTimer = setTimeout(() => {
                    clickCount = 0;
                }, 500); // 500ms window for triple click
            }
        });

        // Double Click for Edit
        el.ondblclick = (e) => {
            e.stopPropagation();
            edit(el);
        };

        // Resize Logic
        el.querySelectorAll('.resizer').forEach(r => {
            r.onmousedown = (e) => {
                e.preventDefault(); e.stopPropagation();
                currentResizer = r; activeEl = el;
                startX = e.clientX; startY = e.clientY;
                startW = el.offsetWidth; startH = el.offsetHeight;
                startL = el.offsetLeft; startT = el.offsetTop;
            };
        });
    }

    function createNode(type, x, y) {
        const el = document.createElement('div');
        el.className = 'dropped-element';
        el.dataset.type = type;
        el.style.left = x + 'px'; el.style.top = y + 'px';
        el.style.width = (type==='Box'||type==='Image') ? "200px" : "180px";
        el.style.height = (type==='Box'||type==='Image') ? "150px" : "50px";

        const html = {
            'Heading': '<h2 style="font-size:24px;color:#000;">Heading</h2>',
            'Paragraph': '<p style="font-size:16px;color:#000;">Text...</p>',
            'Button': '<button style="background:#4f46e5;color:white;border:none;border-radius:12px;width:100%;height:100%;">Click</button>',
            'Image': '<img src="https://via.placeholder.com/150" style="border-radius:12px;width:100%;height:100%;">',
            'Box': '<div style="border:2px solid #333;background:rgba(0,0,0,0.05);width:100%;height:100%;border-radius:12px;"></div>'
        };

        el.innerHTML = html[type] + `<div class="resizer nw"></div><div class="resizer ne"></div><div class="resizer sw"></div><div class="resizer se"></div>`;
        canvas.appendChild(el);
        setupEl(el);
        saveState(el);
        return el;
    }

    function edit(el) {
        const inner = el.querySelector('h2, p, button, img, div');
        const action = prompt("1: Content/Link | 2: Size | 3: Color/Image URL | 4: Opacity");
        
        if (action === '1') {
            if (el.dataset.type === 'Image') inner.src = prompt("URL:", inner.src) || inner.src;
            else inner.innerText = prompt("Text:", inner.innerText) || inner.innerText;
        } else if (action === '2') {
            document.getElementById('size-control').style.display = 'block';
            const s = document.getElementById('size-slider');
            s.oninput = (e) => { inner.style.fontSize = e.target.value + 'px'; saveState(el); };
        } else if (action === '3') {
            let choice = prompt("1: Color Picker | 2: Image URL (BG)");
            if (choice === '1') {
                const cp = document.getElementById('colorPicker'); cp.click();
                cp.oninput = () => { 
                    if (['Button', 'Box'].includes(el.dataset.type)) inner.style.backgroundColor = cp.value;
                    else inner.style.color = cp.value;
                    saveState(el);
                };
            } else if (choice === '2') {
                let url = prompt("URL:");
                if (url) {
                    inner.style.backgroundImage = `url('${url}')`;
                    inner.style.backgroundSize = 'cover';
                    if (!['Button', 'Box'].includes(el.dataset.type)) {
                        inner.style.webkitBackgroundClip = 'text';
                        inner.style.webkitTextFillColor = 'transparent';
                    }
                    saveState(el);
                }
            }
        } else if (action === '4') {
            document.getElementById('opacity-control').style.display = 'block';
            document.getElementById('opacity-slider').oninput = (e) => { el.style.opacity = e.target.value / 100; saveState(el); };
        }
        saveState(el);
    }

    function toggleViewMode() {
        currentMode = currentMode === 'desktop' ? 'mobile' : 'desktop';
        viewport.className = currentMode === 'mobile' ? 'mobile' : '';
        document.querySelectorAll('.dropped-element').forEach(el => {
            const data = JSON.parse(el.dataset[currentMode] || '{}');
            if (data.w) {
                el.style.width = data.w; el.style.height = data.h; el.style.left = data.l; el.style.top = data.t;
            }
        });
    }

    function saveState(el) {
        el.dataset[currentMode] = JSON.stringify({ w: el.style.width, h: el.style.height, l: el.style.left, t: el.style.top });
    }

    function updateHeight() { canvas.style.height = document.getElementById('height-num').value + 'px'; }
    function triggerCanvasColor() { const cp = document.getElementById('canvasColorPicker'); cp.click(); cp.oninput = () => canvas.style.backgroundColor = cp.value; }

    window.onmousemove = (e) => {
        if (!activeEl) return;
        if (isMoving) { activeEl.style.left = (e.clientX - startX) + 'px'; activeEl.style.top = (e.clientY - startY) + 'px'; }
        if (currentResizer) {
            const dx = e.clientX - startX, dy = e.clientY - startY;
            if (currentResizer.classList.contains('se')) { activeEl.style.width = (startW + dx)+'px'; activeEl.style.height = (startH + dy)+'px'; }
            if (currentResizer.classList.contains('nw')) { 
                activeEl.style.width = (startW - dx)+'px'; activeEl.style.left = (startL + dx)+'px'; 
                activeEl.style.height = (startH - dy)+'px'; activeEl.style.top = (startT + dy)+'px'; 
            }
        }
        if (isMoving || currentResizer) saveState(activeEl);
    };
    window.onmouseup = () => { isMoving = false; currentResizer = null; };

    document.getElementById('add-btn').onclick = () => document.getElementById('panel').style.display = 'flex';
    document.getElementById('settings-btn').onclick = () => document.getElementById('settings-panel').style.display = 'flex';

    document.querySelectorAll('.item[data-type]').forEach(i => {
        i.onclick = () => { createNode(i.dataset.type, 50, 50); document.getElementById('panel').style.display = 'none'; };
    });

    function openProjectManager() { document.getElementById('project-modal').style.display = 'block'; renderSaves(); }
    function closeProjectManager() { document.getElementById('project-modal').style.display = 'none'; }
    function saveCurrentProject() {
        const name = document.getElementById('new-save-name').value;
        if (!name) return;
        const library = JSON.parse(localStorage.getItem('lib') || '{}');
        library[name] = canvas.innerHTML;
        localStorage.setItem('lib', JSON.stringify(library));
        renderSaves();
    }
    function renderSaves() {
        const list = document.getElementById('save-list');
        const lib = JSON.parse(localStorage.getItem('lib') || '{}');
        list.innerHTML = "";
        for (let k in lib) {
            list.innerHTML += `<div style="padding:10px; border-bottom:1px solid #eee; display:flex; justify-content:space-between;">${k} <button onclick="loadSave('${k}')">Load</button></div>`;
        }
    }
    function loadSave(k) {
        const lib = JSON.parse(localStorage.getItem('lib') || '{}');
        canvas.innerHTML = lib[k];
        document.querySelectorAll('.dropped-element').forEach(setupEl);
        closeProjectManager();
    }
    </script>
</body>
</html>
