<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Pro Responsive Builder - Mobile Optimized</title>
    <style>
      :root { --primary: #4f46e5; --secondary: #10b981; --danger: #ef4444; --grid: #e5e7eb; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: sans-serif; overflow: hidden; background: #f3f4f6; touch-action: none; user-select: none; }
        
        #viewport { 
            width: 100vw; height: 100vh; margin: 0 auto; background: white; position: relative; 
            overflow-y: auto; overflow-x: hidden; transition: width 0.3s ease;
            background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 25px 25px;
        }
        
        #viewport.mobile { width: 375px; height: 80vh; margin: 5vh auto; border: 12px solid #333; border-radius: 30px; position: relative; }

        .fab { position: fixed; width: 60px; height: 60px; border-radius: 50%; color: white; border: none; font-size: 24px; z-index: 1001; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; }
        #add-btn { bottom: 20px; left: 20px; background: var(--primary); }
        #settings-btn { bottom: 20px; left: 90px; background: #4b5563; }

        .header-tools { position: fixed; top: 15px; right: 15px; display: flex; gap: 10px; z-index: 1000; }
        .header-btn { padding: 12px 20px; color: white; border: none; border-radius: 8px; font-weight: bold; }
        #copy-btn { background: var(--secondary); }
        #clear-btn { background: var(--danger); }

        .popup-panel { position: fixed; bottom: 95px; background: white; border-radius: 12px; padding: 15px; display: none; flex-direction: column; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.2); width: 220px; }
        .item { padding: 12px; margin-bottom: 8px; background: #f8fafc; border: 1px solid #cbd5e1; text-align: center; border-radius: 6px; font-weight: bold; }
        
        .dropped-element { position: absolute; box-sizing: border-box; display: flex; align-items: center; justify-content: center; touch-action: none; }
        .dropped-element > *:not(.resizer) { width: 100%; height: 100%; display: block; pointer-events: none; }
        
        .selected { outline: 2px solid var(--primary); z-index: 100 !important; }
        .resizer { width: 24px; height: 24px; background: white; border: 3px solid var(--primary); position: absolute; border-radius: 50%; display: none; z-index: 110; }
        .selected .resizer { display: block; }
        .nw { top: -12px; left: -12px; } .ne { top: -12px; right: -12px; } .sw { bottom: -12px; left: -12px; } .se { bottom: -12px; right: -12px; }

        #size-control, #height-control, #opacity-control, #save-management-panel { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 15px; box-shadow: 0 0 50px rgba(0,0,0,0.3); z-index: 2000; width: 280px; text-align: center; }
        .save-list { max-height: 200px; overflow-y: auto; margin-top: 15px; border: 1px solid #eee; }
        .save-entry { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #f0f0f0; }
    </style>
  </head>
  <body>
    <div class="header-tools">
      <button id="clear-btn" class="header-btn">Clear</button>
      <button id="copy-btn" class="header-btn">Export</button>
    </div>
    <div id="viewport">
      <div id="canvas" style="width:100%; height:1000px; position:relative; background-color: white;"></div>
    </div>
    <button id="add-btn" class="fab">+</button>
    <button id="settings-btn" class="fab">⚙️</button>
    
    <div id="panel" class="popup-panel">
      <div class="item" data-type="Heading">Heading</div>
      <div class="item" data-type="Paragraph">Paragraph</div>
      <div class="item" data-type="Button">Button</div>
      <div class="item" data-type="Image">Image</div>
      <div class="item" data-type="Box">Container</div>
    </div>

    <div id="settings-panel" class="popup-panel">
      <div class="item" id="mode-toggle" onclick="toggleViewMode()">Switch to Mobile</div>
      <div class="item" onclick="triggerCanvasColor()">BG Color</div>
      <div class="item" style="background:#4b5563; color:white;" onclick="openSaveManagement()">Save/Load</div>
    </div>

    <div id="save-management-panel">
      <h3>Project Manager</h3>
      <input type="text" id="save-name-input" style="width:100%; padding:10px; margin-bottom:10px;" placeholder="Name..." />
      <button onclick="createNewSave()" style="background:var(--primary);color:white;width:100%;padding:10px;">Save Project</button>
      <div class="save-list" id="save-list-container"></div>
      <button onclick="document.getElementById('save-management-panel').style.display='none'" style="margin-top:10px;">Close</button>
    </div>

    <div id="size-control"><strong>Size</strong><br/><input type="range" id="size-slider" min="8" max="150" /><br/><button onclick="this.parentElement.style.display='none'">Done</button></div>
    <div id="opacity-control"><strong>Opacity</strong><br/><input type="range" id="opacity-slider" min="0" max="100" /><br/><button onclick="this.parentElement.style.display='none'">Done</button></div>
    
    <input type="color" id="colorPicker" style="display:none" />
    <input type="color" id="canvasColorPicker" style="display:none" />

    <script>
    const canvas = document.getElementById('canvas');
    const viewport = document.getElementById('viewport');
    let currentMode = 'desktop'; 
    let activeEl, isMoving, currentResizer, startX, startY, startW, startH, startL, startT;

    function getProjectData() {
        const elements = [];
        document.querySelectorAll('.dropped-element').forEach(el => {
            const inner = el.querySelector('h2, p, button, img, div');
            elements.push({
                type: el.dataset.type, desktop: el.dataset.desktop, mobile: el.dataset.mobile,
                html: inner.innerHTML, style: inner.getAttribute('style'),
                pos: { left: el.style.left, top: el.style.top, width: el.style.width, height: el.style.height, opacity: el.style.opacity }
            });
        });
        return { elements, bg: canvas.style.backgroundColor };
    }

    function createNewSave() {
        const name = document.getElementById('save-name-input').value;
        if (!name) return;
        let saves = JSON.parse(localStorage.getItem('my_saves') || '{}');
        saves[name] = getProjectData();
        localStorage.setItem('my_saves', JSON.stringify(saves));
        renderSaveList();
    }

    function loadNamedProject(name) {
        let saves = JSON.parse(localStorage.getItem('my_saves') || '{}');
        const p = saves[name];
        canvas.innerHTML = "";
        canvas.style.backgroundColor = p.bg;
        p.elements.forEach(item => {
            const el = createNode(item.type, parseInt(item.pos.left), parseInt(item.pos.top), true);
            el.dataset.desktop = item.desktop; el.dataset.mobile = item.mobile;
            el.style.width = item.pos.width; el.style.height = item.pos.height; el.style.opacity = item.pos.opacity;
            const inner = el.querySelector('h2, p, button, img, div');
            inner.innerHTML = item.html; inner.setAttribute('style', item.style);
        });
        document.getElementById('save-management-panel').style.display = 'none';
    }

    function renderSaveList() {
        const container = document.getElementById('save-list-container');
        let saves = JSON.parse(localStorage.getItem('my_saves') || '{}');
        container.innerHTML = Object.keys(saves).map(n => `<div class="save-entry"><span>${n}</span><button onclick="loadNamedProject('${n}')">Load</button></div>`).join('');
    }

    function openSaveManagement() { document.getElementById('settings-panel').style.display = 'none'; document.getElementById('save-management-panel').style.display = 'block'; renderSaveList(); }

    function toggleViewMode() {
        currentMode = (currentMode === 'desktop' ? 'mobile' : 'desktop');
        viewport.className = (currentMode === 'mobile' ? 'mobile' : '');
        document.querySelectorAll('.dropped-element').forEach(el => {
            const data = JSON.parse(el.dataset[currentMode] || '{}');
            if (data.w) { el.style.width = data.w; el.style.height = data.h; el.style.left = data.l; el.style.top = data.t; }
        });
    }

    function saveCurrentState(el) {
        el.dataset[currentMode] = JSON.stringify({ w: el.style.width, h: el.style.height, l: el.style.left, t: el.style.top });
    }

    document.getElementById('add-btn').onclick = () => { document.getElementById('panel').style.display = 'flex'; };
    document.querySelectorAll('.item[data-type]').forEach(i => {
        i.onclick = () => { createNode(i.dataset.type, 50, 50); document.getElementById('panel').style.display = 'none'; };
    });

    function createNode(type, x, y, loading = false) {
        const el = document.createElement('div');
        el.className = 'dropped-element'; el.dataset.type = type;
        el.style.left = x + 'px'; el.style.top = y + 'px';
        el.style.width = "150px"; el.style.height = "50px";
        const html = { 'Heading': '<h2>Title</h2>', 'Paragraph': '<p>Text</p>', 'Button': '<button>Click</button>', 'Image': '<img src="https://via.placeholder.com/150">', 'Box': '<div style="background:#ddd;width:100%;height:100%;"></div>' };
        el.innerHTML = html[type] + `<div class="resizer nw"></div><div class="resizer ne"></div><div class="resizer sw"></div><div class="resizer se"></div>`;
        canvas.appendChild(el);
        setupEl(el);
        if(!loading) saveCurrentState(el);
        return el;
    }

    function setupEl(el) {
        let taps = 0;
        let tapTimer = null;

        // Mobile Dragging Logic
        el.ontouchstart = (e) => {
            activeEl = el; isMoving = true;
            const t = e.touches[0];
            startX = t.clientX - el.offsetLeft; startY = t.clientY - el.offsetTop;
            document.querySelectorAll('.dropped-element').forEach(d => d.classList.remove('selected'));
            el.classList.add('selected');
        };

        // Mobile Multi-Tap Detector (Double = Edit, Triple = Delete)
        el.ontouchend = (e) => {
            taps++;
            if (tapTimer) clearTimeout(tapTimer);
            tapTimer = setTimeout(() => {
                if (taps === 2) edit(el);
                if (taps === 3) { if(confirm("Delete?")) el.remove(); }
                taps = 0;
                tapTimer = null;
            }, 300);
        };

        el.querySelectorAll('.resizer').forEach(r => {
            r.ontouchstart = (e) => {
                e.stopPropagation(); currentResizer = r; activeEl = el;
                const t = e.touches[0];
                startX = t.clientX; startY = t.clientY;
                startW = el.offsetWidth; startH = el.offsetHeight;
            };
        });
    }

    window.ontouchmove = (e) => {
        if (!activeEl) return;
        const t = e.touches[0];
        if (isMoving) { activeEl.style.left = (t.clientX - startX) + 'px'; activeEl.style.top = (t.clientY - startY) + 'px'; }
        if (currentResizer) {
            const dx = t.clientX - startX, dy = t.clientY - startY;
            activeEl.style.width = (startW + dx) + 'px'; activeEl.style.height = (startH + dy) + 'px';
        }
        saveCurrentState(activeEl);
    };

    window.ontouchend = () => { isMoving = false; currentResizer = null; };

    function edit(el) {
        const action = prompt("1:Content | 2:Size | 3:Color | 4:Opacity");
        const inner = el.querySelector('h2, p, button, img, div');
        if (action === '1') inner.innerText = prompt("Text:");
        if (action === '2') document.getElementById('size-control').style.display='block';
        if (action === '3') { 
            const cp = document.getElementById('colorPicker'); cp.click();
            cp.oninput = () => { inner.style.color = cp.value; inner.style.backgroundColor = cp.value; };
        }
        if (action === '4') document.getElementById('opacity-control').style.display='block';
    }

    function triggerCanvasColor() { const cp = document.getElementById('canvasColorPicker'); cp.click(); cp.oninput = () => canvas.style.backgroundColor = cp.value; }
    </script>
  </body>
</html>
