<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Builder Mobile</title>
    <style>
        :root { --primary: #4f46e5; --secondary: #10b981; --danger: #ef4444; --grid: #e5e7eb; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: sans-serif; overflow: hidden; background: #f3f4f6; touch-action: none; user-select: none; }
        
        #viewport { 
            width: 100vw; height: 100vh; margin: 0 auto; background: white; position: relative; 
            overflow-y: auto; overflow-x: hidden; transition: width 0.3s ease, height 0.3s ease;
            box-shadow: 0 0 50px rgba(0,0,0,0.1);
            background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 25px 25px;
        }
        
        #canvas { background-size: cover; background-position: center; background-repeat: no-repeat; min-height: 100%; position: relative; }

        .fab { position: fixed; width: 60px; height: 60px; border-radius: 50%; color: white; border: none; font-size: 24px; z-index: 1001; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; cursor: pointer; }
        #add-btn { bottom: 20px; left: 20px; background: var(--primary); }
        #settings-btn { bottom: 20px; left: 90px; background: #4b5563; }

        .header-tools { position: fixed; top: 15px; right: 15px; display: flex; gap: 10px; z-index: 1000; }
        .header-btn { padding: 12px 20px; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
        #copy-btn { background: var(--secondary); }
        #clear-btn { background: var(--danger); }

        .popup-panel { position: fixed; bottom: 95px; background: white; border-radius: 12px; padding: 15px; display: none; flex-direction: column; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.2); width: 220px; }
        .item { padding: 12px; margin-bottom: 8px; background: #f8fafc; border: 1px solid #cbd5e1; text-align: center; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        .dropped-element { position: absolute; box-sizing: border-box; display: flex; align-items: center; justify-content: center; }
        .dropped-element > *:not(.resizer) { width: 100%; height: 100%; display: block; margin: 0; pointer-events: none; object-fit: cover; }
        
        .selected { outline: 3px solid var(--primary); z-index: 100 !important; }
        .resizer { width: 24px; height: 24px; background: white; border: 3px solid var(--primary); position: absolute; border-radius: 4px; display: none; z-index: 110; }
        .selected .resizer { display: block; }
        .nw { top: -12px; left: -12px; } .ne { top: -12px; right: -12px; } .sw { bottom: -12px; left: -12px; } .se { bottom: -12px; right: -12px; }

        #size-control, #height-control, #opacity-control, #project-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 15px; z-index: 3000; width: 280px; text-align: center; box-shadow: 0 0 50px rgba(0,0,0,0.4); }
    </style>
</head>
<body>

    <div class="header-tools">
        <button id="clear-btn" class="header-btn" onclick="if(confirm('Clear all?')) canvas.innerHTML=''">Clear</button>
        <button id="copy-btn" class="header-btn" onclick="console.log(canvas.innerHTML); alert('HTML Logged to Console')">Export</button>
    </div>
    
    <div id="viewport">
        <div id="canvas" style="width:100%; height:1500px; background-color: white;"></div>
    </div>

    <button id="add-btn" class="fab">+</button>
    <button id="settings-btn" class="fab">⚙️</button>

    <div id="panel" class="popup-panel">
        <div class="item" data-type="Heading">Heading</div>
        <div class="item" data-type="Paragraph">Paragraph</div>
        <div class="item" data-type="Button">Button</div>
        <div class="item" data-type="Image">Image</div>
        <div class="item" data-type="Box">Container</div>
    </div>

    <div id="settings-panel" class="popup-panel">
        <div class="item" onclick="triggerCanvasColor()">BG Color</div>
        <div class="item" onclick="document.getElementById('height-control').style.display='block'">Page Height</div>
        <div class="item" onclick="openProjectManager()">📁 Projects</div>
    </div>

    <div id="project-modal">
        <h3>Projects</h3>
        <input type="text" id="new-save-name" placeholder="Name..." style="width:90%; padding:10px; margin-bottom:10px;">
        <button onclick="saveCurrentProject()" style="background:var(--primary); color:white; border:none; padding:10px; width:100%; border-radius:5px;">Save Current</button>
        <div id="save-list" style="margin-top:15px; max-height:150px; overflow-y:auto;"></div>
        <button onclick="this.parentElement.style.display='none'" style="margin-top:10px; border:none; background:#eee; padding:10px; width:100%;">Close</button>
    </div>

    <div id="size-control">
        <strong>Size Control</strong><br>
        <input type="range" id="size-slider" min="8" max="150" style="width:100%; margin:20px 0;">
        <button onclick="this.parentElement.style.display='none'" style="width:100%; padding:10px;">Done</button>
    </div>

    <div id="opacity-control">
        <strong>Opacity</strong><br>
        <input type="range" id="opacity-slider" min="0" max="100" value="100" style="width:100%; margin:20px 0;">
        <button onclick="this.parentElement.style.display='none'" style="width:100%; padding:10px;">Done</button>
    </div>

    <div id="height-control">
        <strong>Canvas Height</strong><br>
        <input type="number" id="height-num" value="1500" style="width:100px; padding:10px; margin:15px;"> px<br>
        <button onclick="updateHeight(); this.parentElement.style.display='none';" style="width:100%; padding:10px;">Apply</button>
    </div>

    <input type="color" id="colorPicker" style="display:none">
    <input type="color" id="canvasColorPicker" style="display:none">

    <script>
    const canvas = document.getElementById('canvas');
    let activeEl, isMoving, currentResizer, startX, startY, startW, startH, startL, startT;

    function setupEl(el) {
        let tapCount = 0;
        let tapTimer = null;

        // --- Touch Support for Mobile Dragging ---
        el.ontouchstart = (e) => {
            if (e.target.classList.contains('resizer')) return;
            const touch = e.touches[0];
            activeEl = el;
            isMoving = true;
            document.querySelectorAll('.dropped-element').forEach(d => d.classList.remove('selected'));
            el.classList.add('selected');
            startX = touch.clientX - el.offsetLeft;
            startY = touch.clientY - el.offsetTop;
        };

        // --- Triple Tap Delete System ---
        el.addEventListener('touchstart', (e) => {
            if (e.target.classList.contains('resizer')) return;
            tapCount++;
            clearTimeout(tapTimer);

            if (tapCount === 3) {
                if (confirm("Delete this element?")) el.remove();
                tapCount = 0;
            } else {
                tapTimer = setTimeout(() => { tapCount = 0; }, 400);
            }
        });

        // Long Press / Double Tap to Edit
        let lastTap = 0;
        el.addEventListener('touchend', (e) => {
            let currentTime = new Date().getTime();
            let tapLength = currentTime - lastTap;
            if (tapLength < 300 && tapLength > 0) {
                edit(el);
                e.preventDefault();
            }
            lastTap = currentTime;
        });

        // Resize Logic (Touch)
        el.querySelectorAll('.resizer').forEach(r => {
            r.ontouchstart = (e) => {
                e.preventDefault(); e.stopPropagation();
                const touch = e.touches[0];
                currentResizer = r; activeEl = el;
                startX = touch.clientX; startY = touch.clientY;
                startW = el.offsetWidth; startH = el.offsetHeight;
                startL = el.offsetLeft; startT = el.offsetTop;
            };
        });
    }

    function createNode(type, x, y) {
        const el = document.createElement('div');
        el.className = 'dropped-element';
        el.dataset.type = type;
        el.style.left = x + 'px'; el.style.top = y + 'px';
        el.style.width = (type==='Box'||type==='Image') ? "180px" : "150px";
        el.style.height = (type==='Box'||type==='Image') ? "120px" : "45px";

        const html = {
            'Heading': '<h2 style="font-size:24px;color:#000;margin:0;">Heading</h2>',
            'Paragraph': '<p style="font-size:16px;color:#000;margin:0;">Tap to edit...</p>',
            'Button': '<button style="background:#4f46e5;color:white;border:none;border-radius:8px;width:100%;height:100%;">Click</button>',
            'Image': '<img src="https://via.placeholder.com/150" style="border-radius:8px;width:100%;height:100%;">',
            'Box': '<div style="border:2px solid #333;background:rgba(0,0,0,0.05);width:100%;height:100%;border-radius:8px;"></div>'
        };

        el.innerHTML = html[type] + `<div class="resizer nw"></div><div class="resizer ne"></div><div class="resizer sw"></div><div class="resizer se"></div>`;
        canvas.appendChild(el);
        setupEl(el);
        return el;
    }

    function edit(el) {
        const inner = el.querySelector('h2, p, button, img, div');
        const action = prompt("1:Content 2:Size 3:Color 4:Opacity");
        if (action === '1') {
            if (el.dataset.type === 'Image') inner.src = prompt("URL:", inner.src) || inner.src;
            else inner.innerText = prompt("Text:", inner.innerText) || inner.innerText;
        } else if (action === '2') {
            document.getElementById('size-control').style.display = 'block';
            document.getElementById('size-slider').oninput = (e) => { inner.style.fontSize = e.target.value + 'px'; };
        } else if (action === '3') {
            const cp = document.getElementById('colorPicker'); cp.click();
            cp.oninput = () => { 
                if (['Button', 'Box'].includes(el.dataset.type)) inner.style.backgroundColor = cp.value;
                else inner.style.color = cp.value;
            };
        } else if (action === '4') {
            document.getElementById('opacity-control').style.display = 'block';
            document.getElementById('opacity-slider').oninput = (e) => { el.style.opacity = e.target.value / 100; };
        }
    }

    window.ontouchmove = (e) => {
        if (!activeEl) return;
        const touch = e.touches[0];
        if (isMoving) {
            activeEl.style.left = (touch.clientX - startX) + 'px';
            activeEl.style.top = (touch.clientY - startY) + 'px';
        }
        if (currentResizer) {
            const dx = touch.clientX - startX, dy = touch.clientY - startY;
            if (currentResizer.classList.contains('se')) { activeEl.style.width = (startW + dx)+'px'; activeEl.style.height = (startH + dy)+'px'; }
            if (currentResizer.classList.contains('nw')) { 
                activeEl.style.width = (startW - dx)+'px'; activeEl.style.left = (startL + dx)+'px'; 
                activeEl.style.height = (startH - dy)+'px'; activeEl.style.top = (startT + dy)+'px'; 
            }
        }
    };

    window.ontouchend = () => { isMoving = false; currentResizer = null; };

    document.getElementById('add-btn').onclick = () => document.getElementById('panel').style.display = 'flex';
    document.getElementById('settings-btn').onclick = () => document.getElementById('settings-panel').style.display = 'flex';
    document.querySelectorAll('.item[data-type]').forEach(i => {
        i.onclick = () => { createNode(i.dataset.type, 50, 100); document.getElementById('panel').style.display = 'none'; };
    });

    function updateHeight() { canvas.style.height = document.getElementById('height-num').value + 'px'; }
    function triggerCanvasColor() { const cp = document.getElementById('canvasColorPicker'); cp.click(); cp.oninput = () => canvas.style.backgroundColor = cp.value; }

    function openProjectManager() { document.getElementById('project-modal').style.display = 'block'; renderSaves(); }
    function saveCurrentProject() {
        const name = document.getElementById('new-save-name').value;
        if (!name) return;
        const lib = JSON.parse(localStorage.getItem('mb_lib') || '{}');
        lib[name] = canvas.innerHTML;
        localStorage.setItem('mb_lib', JSON.stringify(lib));
        renderSaves();
    }
    function renderSaves() {
        const list = document.getElementById('save-list');
        const lib = JSON.parse(localStorage.getItem('mb_lib') || '{}');
        list.innerHTML = "";
        for (let k in lib) {
            let div = document.createElement('div');
            div.style.cssText = "padding:10px; border-bottom:1px solid #eee; display:flex; justify-content:space-between;";
            div.innerHTML = `<span>${k}</span><button onclick="loadSave('${k}')">Load</button>`;
            list.appendChild(div);
        }
    }
    function loadSave(k) {
        const lib = JSON.parse(localStorage.getItem('mb_lib') || '{}');
        canvas.innerHTML = lib[k];
        document.querySelectorAll('.dropped-element').forEach(setupEl);
        document.getElementById('project-modal').style.display = 'none';
    }
    </script>
</body>
</html>
